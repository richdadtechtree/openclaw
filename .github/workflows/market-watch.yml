name: Market watch checks
on:
  pull_request:
    paths:
      - 'stock/market_watch.py'
      - 'stock/market_data.py'
      - 'stock/app.py'
      - 'stock/kis_client.py'
      - 'stock/index.html'
      - 'stock/templates/index.html'
      - 'scripts/test_market_watch*'
      - '.github/workflows/market-watch.yml'
  push:
    branches: [main]
    paths:
      - 'stock/market_watch.py'
      - 'scripts/test_market_watch*'
permissions:
  contents: read
jobs:
  market-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install fastapi httpx
      - run: python -m py_compile stock/market_watch.py stock/market_data.py stock/app.py stock/kis_client.py
      - run: python -m unittest discover -s scripts -p test_market_watch.py -v
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_market_watch.js
