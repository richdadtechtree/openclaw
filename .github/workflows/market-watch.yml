name: Reader and market checks
on:
  pull_request:
    paths:
      - 'stock/news_bookmark.py'
      - 'stock/news_marks.py'
      - 'stock/slack_digest_live.html'
      - 'stock/gate.py'
      - 'stock/market_watch.py'
      - 'stock/market_data.py'
      - 'stock/app.py'
      - 'stock/kis_client.py'
      - 'stock/index.html'
      - 'stock/templates/index.html'
      - 'scripts/test_market_watch*'
      - 'scripts/test_news_bookmark*'
      - 'scripts/test_viewer_edition.js'
      - 'scripts/test_news_marks.py'
      - 'scripts/test_viewer_marks.js'
      - 'scripts/test_viewer_stickers.js'
      - 'scripts/test_article_checks.js'
      - 'scripts/test_custom_articles.js'
      - '.github/workflows/market-watch.yml'
  push:
    branches: [main]
    paths:
      - 'stock/news_bookmark.py'
      - 'stock/market_watch.py'
      - 'scripts/test_market_watch*'
      - 'scripts/test_news_bookmark*'
permissions:
  contents: read
jobs:
  reader-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install fastapi httpx
      - run: python -m py_compile stock/news_bookmark.py stock/gate.py stock/market_watch.py stock/market_data.py stock/app.py stock/kis_client.py
      - run: python -m unittest discover -s scripts -p test_market_watch.py -v
      - run: python -m unittest discover -s scripts -p test_news_bookmark.py -v
      - run: python -m unittest discover -s scripts -p test_news_marks.py -v
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_market_watch.js
      - run: node scripts/test_news_bookmark.js
      - run: node scripts/test_viewer_edition.js
      - run: node scripts/test_viewer_marks.js
      - run: node scripts/test_viewer_stickers.js
      - run: node scripts/test_article_checks.js
      - run: node scripts/test_custom_articles.js
