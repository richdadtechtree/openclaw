<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--GATE_THEME-->
<title>챌린지</title>
<style>
  /* 🔥 찰스 챌린지 화면 (2026-10-30, 계획서 docs/challenge-plan.md).
     색은 디그 화면과 같은 규칙: 자동(기기 설정) / 화이트(data-theme="light") / 다크(data-theme="dark") */
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--sub:#5b6577;--line:#e3e7ee;--blue:#2f7be0;--soft:#eaf2fd;
        --ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdeaea;--fire:#f06a2b;color-scheme:light}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--ink:#e8ebf1;--sub:#9aa5b8;--line:#2b3340;--blue:#6aa6f5;--soft:#1f2c40;
      --ok:#4cc985;--okbg:#173326;--bad:#f07a7a;--badbg:#3a1d1d;color-scheme:dark}
  }
  :root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--ink:#e8ebf1;--sub:#9aa5b8;--line:#2b3340;--blue:#6aa6f5;--soft:#1f2c40;
      --ok:#4cc985;--okbg:#173326;--bad:#f07a7a;--badbg:#3a1d1d;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7;word-break:keep-all}
  a{color:var(--blue)}
  button,select,textarea{font:inherit;color:var(--ink)}
  button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  button:disabled{opacity:.45;cursor:default}

  /* 맨 위(스크롤해도 고정): 탭 + 제목 */
  .top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
       display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  .top h1{font-size:16px;margin:0;flex:1;white-space:nowrap}
  .sitenav{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
  .sitenav a{display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;
             color:var(--sub);text-decoration:none;border:1px solid var(--line);background:var(--card)}
  .sitenav a:hover{color:var(--ink)}
  .sitenav a.who{margin-left:auto;background:transparent;border-color:transparent;font-weight:500;font-size:13px}
  .sitenav a.logout,.sitenav a.adminlink{padding:5px 12px;font-size:13px}
  .sitenav a[aria-current="page"]{background:var(--blue);color:var(--card);border-color:var(--blue);cursor:default}

  main{max-width:1040px;margin:0 auto;padding:16px 16px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px;margin-bottom:16px}
  .sub{color:var(--sub);font-size:13px}

  /* 진행도 */
  .hero h2{margin:0;font-size:20px}
  .hero .meta{color:var(--sub);font-size:14px;margin:2px 0 12px}
  .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fire),#f5b041);border-radius:99px;transition:width .4s}
  .count{font-size:14px;margin:8px 0 12px}
  .count b{font-size:18px}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .day{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;
       border:1px solid var(--line);font-size:11px;line-height:1.2;color:var(--sub);background:var(--card);padding:0}
  .day b{font-size:16px;line-height:1.3}
  .day.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .day.excused{background:var(--soft);border-color:var(--blue);color:var(--blue)}
  .day.missed{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
  .day.today,.day.wait{border:2px solid var(--fire);color:var(--fire)}
  .day.nopaper{opacity:.45}
  .day.future{opacity:.7}
  .day.sel{box-shadow:0 0 0 3px var(--soft),0 0 0 4px var(--blue)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
  .admin-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}

  /* 그날 */
  .dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
  .dayhead h3{margin:0;font-size:18px;flex:1}
  .msg{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px}
  .msg.warn{background:var(--badbg);color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media (max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media (max-width:560px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}}
  .tile{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);padding:0;
        aspect-ratio:3/4;cursor:pointer}
  .tile img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .tile .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
  .tile .mine{position:absolute;right:6px;top:6px;background:var(--ok);color:#fff;font-size:12px;border-radius:6px;padding:1px 6px}
  .tile .oth{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
  .tile.has{outline:3px solid var(--ok);outline-offset:-3px}

  /* 같은 기수 글 */
  .posts h3{margin:0 0 10px;font-size:17px}
  .post{border-top:1px solid var(--line);padding:14px 0}
  .post:first-of-type{border-top:none}
  .post .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
  .post .who .pg{font-weight:500;font-size:13px}
  .badge{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--blue);font-weight:700}
  .badge.op{background:var(--fire);color:#fff}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:15px}
  .kv dt{font-weight:800;color:var(--blue);font-size:12px;padding-top:3px;white-space:nowrap}
  .kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .lock{text-align:center;padding:22px 10px;color:var(--sub)}
  .lock b{color:var(--ink)}

  /* 글쓰기 창 */
  .ed{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.55);display:none}
  .ed.open{display:flex}
  .ed-box{margin:auto;width:min(1180px,100%);height:min(94vh,100%);background:var(--card);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
  .ed-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .ed-top b{flex:1}
  .ed-body{flex:1;display:flex;min-height:0}
  .ed-img{flex:1.1;overflow:auto;background:#222;position:relative}
  .ed-img img{display:block;width:100%;height:auto;margin:0 auto;transition:width .15s}
  .zoom{position:sticky;top:8px;left:8px;z-index:2;display:inline-flex;gap:4px;margin:8px}
  .zoom button{padding:3px 10px;background:rgba(0,0,0,.6);color:#fff;border-color:transparent}
  .ed-form{flex:1;overflow:auto;padding:14px 16px 20px}
  .fld{margin:0 0 12px}
  .fld label{display:flex;justify-content:space-between;font-weight:800;color:var(--blue);font-size:14px;margin-bottom:4px}
  .fld label small{color:var(--sub);font-weight:500}
  .fld textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
                background:var(--bg);font-size:15px;line-height:1.6}
  .fld textarea:focus{outline:2px solid var(--blue);border-color:transparent}
  .fld .ro{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;min-height:40px}
  .ed-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .ed-actions .st{font-size:13px;color:var(--sub)}
  .ed-actions .st.err{color:var(--bad)}
  .ed-others{margin-top:18px;border-top:1px dashed var(--line);padding-top:10px}
  /* 📖 모르는 용어 */
  .terms .tin{display:flex;gap:6px;flex-wrap:wrap}
  .terms .tin input{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);font:inherit;font-size:15px;color:var(--ink)}
  .terms .tin input:focus{outline:2px solid var(--blue);border-color:transparent}
  .tcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--bg);font-size:14px;line-height:1.6}
  .tcard .th{display:flex;align-items:center;gap:8px}
  .tcard .th b{font-size:15px;flex:1}
  .tcard .th button{padding:1px 8px;font-size:12px}
  .tcard .short{font-weight:700;margin-top:4px}
  .tcard .inv{margin-top:4px;color:var(--sub)}
  .tcard .src{margin-top:6px;font-size:12px;color:var(--sub)}
  .tcard .src a{color:var(--sub)}
  .tcard.wait .short{color:var(--sub);font-weight:500}
  .tchips{display:flex;flex-wrap:wrap;gap:6px}
  .tchips details{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:13px}
  .tchips details[open]{flex-basis:100%;padding:6px 10px}
  .tchips summary{cursor:pointer;color:var(--blue);font-weight:700}
  @media (max-width:900px){
    .ed-box{height:100%;border-radius:0}
    .ed-body{flex-direction:column;overflow:auto}
    .ed-img{flex:none;height:46vh}
    .ed-form{overflow:visible}
  }

  /* 축하 팝업 */
  .cele{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(10,12,16,.6);overflow:hidden}
  .cele.open{display:flex}
  .cele-box{position:relative;z-index:2;background:var(--card);border-radius:22px;padding:34px 28px 26px;max-width:440px;margin:16px;text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  .cele-box .big{font-size:54px;line-height:1}
  .cele-box h2{font-size:24px;line-height:1.45;margin:14px 0 8px;text-wrap:balance}
  .cele-box p{color:var(--sub);margin:0 0 18px}
  .cele-box button{margin:4px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;z-index:1;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  .empty{text-align:center;color:var(--sub);padding:40px 10px}

  /* 📰 오늘 신문 / 📖 용어장 전환 */
  .vtabs{display:flex;gap:6px;margin:0 0 12px}
  .vtabs button{border-radius:999px;font-weight:700;padding:8px 16px}
  .vtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .gtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .gtools input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);font:inherit;font-size:15px;color:var(--ink)}
  .gtools select{border-radius:10px;padding:7px 10px;border:1px solid var(--line);background:var(--card)}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.ggrid{grid-template-columns:1fr}}
  .gcard{border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;background:var(--card);line-height:1.6;font-size:14px}
  .gcard h4{margin:0;font-size:17px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .gcard .short{font-weight:700;margin:6px 0 2px;font-size:15px}
  .gcard .inv{color:var(--sub);margin-top:4px}
  .gcard .gf{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--sub)}
  .gcard .gf a,.gcard .gf button{font-size:12px;color:var(--sub)}
  .gcard .gf button{padding:2px 8px}
  .gcard.none .short{color:var(--sub);font-weight:500}
  .sitefoot{max-width:1040px;margin:0 auto;padding:0 16px 40px;text-align:center;font-size:13px;color:var(--sub)}
  .sitefoot a{color:var(--sub)}
</style>
</head>
<body>
<div class="top">
  <nav class="sitenav" aria-label="페이지 이동">
    <!--GATE_NAV:challenge-->
    <a href="/dig">📚 경제 공부 (디그)</a>
    <a href="/challenge" aria-current="page">🔥 챌린지</a>
    <!--/GATE_NAV-->
    <!--GATE_WHO-->
  </nav>
  <h1>🔥 챌린지</h1>
</div>
<main>
  <section class="card hero" id="hero"><div class="empty">불러오는 중…</div></section>
  <div class="vtabs" role="tablist" aria-label="보기">
    <button role="tab" id="v-day" aria-selected="true">📰 오늘 신문</button>
    <button role="tab" id="v-gloss" aria-selected="false">📖 우리 기수 용어장</button>
  </div>
  <section class="card" id="glosscard" hidden>
    <div class="gtools"><input id="g-q" type="search" placeholder="용어 찾기" aria-label="용어 찾기">
      <select id="g-sort" aria-label="정렬"><option value="abc">가나다순</option><option value="many">많이 나온 순</option><option value="new">최근 순</option></select>
      <span class="sub" id="g-count"></span></div>
    <div class="ggrid" id="g-list"></div>
    <p class="sub" style="margin-top:12px">🤖 풀이는 AI 가 만든 것이라 틀릴 수 있어요. 중요한 투자 판단 전에는 한 번 더 확인해 보세요.</p>
  </section>
  <section class="card" id="daycard">
    <div class="dayhead"><h3 id="daytitle">오늘 신문</h3><button id="totoday" hidden>오늘로</button></div>
    <div id="daymsg"></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="card posts" id="posts"></section>
</main>
<!--GATE_FOOT-->

<!-- 글쓰기 창: 사진(확대) + WHAT/WHY/HOW/생각 -->
<div class="ed" id="ed" role="dialog" aria-modal="true" aria-labelledby="ed-title">
  <div class="ed-box">
    <div class="ed-top"><b id="ed-title">사진</b><button id="ed-close" aria-label="닫기">✕ 닫기</button></div>
    <div class="ed-body">
      <div class="ed-img" id="ed-img">
        <div class="zoom"><button id="zout" aria-label="축소">−</button><button id="zfit">맞춤</button><button id="zin" aria-label="확대">+</button></div>
        <img id="ed-photo" alt="신문 사진">
      </div>
      <div class="ed-form" id="ed-form"></div>
    </div>
  </div>
</div>

<!-- 완수 축하 -->
<div class="cele" id="cele" role="dialog" aria-modal="true">
  <div class="cele-box">
    <div class="big">🎉</div>
    <h2 id="cele-text">꾸준함은 인생을 바꿀 수 있습니다</h2>
    <p id="cele-sub">챌린지를 완수했어요! 이제 모든 화면을 이용할 수 있어요.</p>
    <button class="primary" id="cele-go">📰 신문 요약 보러 가기</button>
    <button id="cele-close">닫기</button>
  </div>
</div>

<script>
(function(){
"use strict";
const FIELDS=[["what","WHAT","무슨 일이 있었나 (사실)"],["why","WHY","왜 중요한가 / 왜 일어났나"],
              ["how","HOW","앞으로 어떻게 될까 / 어떻게 대응하나"],["think","생각 & 투자에 적용할 점","내 생각, 내 투자에 어떻게 쓸까"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["일","월","화","수","목","금","토"];
const S={me:null,day:null,date:null,cohort:"",zoom:1,page:null,terms:[],gl:{}};
/* 📖 모르는 용어: 같은 말 판단(띄어쓰기·대소문자 무시) — 서버 challenge.term_key 와 같은 규칙 */
const tkey=t=>String(t||"").normalize("NFC").replace(/\s+/g,"").toLowerCase();
function glOf(t){const g=S.gl[tkey(t)]||(S.day&&S.day.glossary||{})[tkey(t)];return g&&g.short?g:null;}
function termCard(t,removable){
  const g=glOf(t),fail=(S.gl[tkey(t)]||{}).reason;
  return '<div class="tcard'+(g?'':' wait')+'"><div class="th"><b>'+esc(t)+'</b>'+(removable?'<button data-rm="'+esc(t)+'" aria-label="'+esc(t)+' 빼기">✕</button>':'')+'</div>'+
    (g?'<div class="short">'+esc(g.short)+'</div><div>'+esc(g.easy)+'</div>'+(g.invest?'<div class="inv">💡 '+esc(g.invest)+'</div>':''):
       '<div class="short">'+esc(fail||"아직 뜻을 안 찾았어요 — 🔍 뜻 찾기를 눌러 보세요.")+'</div>')+
    (g?'<div class="src">🤖 AI 풀이(틀릴 수 있어요)</div>':'')+'</div>';
}
function termsChips(list){
  if(!list||!list.length)return "";
  return '<div class="tchips">'+list.map(t=>{const g=glOf(t);return '<details><summary>'+esc(t)+'</summary>'+
    (g?'<div><b>'+esc(g.short)+'</b></div><div>'+esc(g.easy)+'</div>'+(g.invest?'<div class="sub">💡 '+esc(g.invest)+'</div>':''):'<div class="sub">아직 풀이가 없어요.</div>')+
    '</details>';}).join("")+'</div>';
}

function md(d){const t=new Date(d+"T00:00:00");return (t.getMonth()+1)+"월 "+t.getDate()+"일 ("+WD[t.getDay()]+")";}
function pageNo(n){const m=String(n).match(/\d+/);return m?String(+m[0]):n;}

async function api(path,opt){
  const r=await fetch(path,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},opt||{}));
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===401){location.href="/gate/login?next=/challenge";throw new Error("login");}
  if(!r.ok&&!j.message){j.message=j.reason==="range"?"이 날짜는 볼 수 없어요(챌린지 기간 밖).":"요청을 처리하지 못했어요 ("+r.status+")";}
  j._status=r.status;return j;
}

/* ── 진행도 ─────────────────────────── */
const ST={done:["✅","완료"],excused:["🟦","인정"],missed:["✗","빠짐"],today:["⭕","오늘"],wait:["⏳","신문 대기"],nopaper:["–","신문 없음"],future:["·","남은 날"]};
function renderHero(){
  const me=S.me,h=$("hero");
  let out="";
  if(me.progress){
    const p=me.progress,pct=p.total?Math.round(p.done/p.total*100):0;
    out+='<h2>'+esc(p.cohort.name)+' 챌린지</h2><div class="meta">'+esc(p.cohort.start)+' ~ '+esc(p.cohort.end)+' · 평일만 · '+esc(me.nick)+' 님</div>';
    out+='<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';
    out+='<div class="count"><b>'+p.done+'</b> / '+p.total+'일 완료'+(p.missed.length?' · <span style="color:var(--bad)">빠진 날 '+p.missed.length+'일</span>':'')+
         (me.role==="graduate"?' · 🎓 <b>완수</b>':'')+'</div>';
    out+='<div class="days" role="list">'+p.days.map(d=>{
      const s=ST[d.state]||["",""];const t=new Date(d.day+"T00:00:00");
      return '<button class="day '+d.state+(d.day===S.date?' sel':'')+'" role="listitem" data-day="'+d.day+'" title="'+esc(d.day+' '+s[1])+'"'+(d.state==="future"?' disabled':'')+'>'+
             '<span>'+(t.getMonth()+1)+'/'+t.getDate()+' '+WD[t.getDay()]+'</span><b>'+s[0]+'</b></button>';}).join("")+'</div>';
    out+='<div class="legend sub">✅ 완료 · ⭕ 오늘 할 차례 · ✗ 빠진 날 · 🟦 운영자 인정 · – 신문이 없던 날(자동 제외)</div>';
    if(me.why_not&&me.role==="charles")out+='<div class="msg" style="margin-top:10px">⏰ '+esc(me.why_not)+'</div>';
    if(p.missed.length&&me.role==="charles")out+='<div class="msg warn" style="margin-top:10px">빠진 날이 있으면 완수할 수 없어요. 사정이 있었다면 운영자에게 알려 주세요.</div>';
  }else if(me.admin){
    out+='<h2>🛠 관리자 챌린지</h2><div class="meta">평일마다 오늘 신문으로 글을 쓸 수 있고, 관리자 글은 <b>모든 기수</b>에게 보여요.</div>';
  }else{
    out+='<h2>챌린지</h2><div class="meta">아직 기수가 정해지지 않았어요. 운영자에게 문의해 주세요.</div>';
  }
  if(me.admin){
    const opts=['<option value="">모든 기수 글</option>'].concat((me.cohorts||[]).map(c=>'<option value="'+c.id+'"'+(String(c.id)===S.cohort?' selected':'')+'>'+esc(c.name)+' ('+esc(c.start.slice(5))+'~'+esc(c.end.slice(5))+')</option>'));
    out+='<div class="admin-row"><span class="sub">글 보기:</span><select id="cohortsel">'+opts.join("")+'</select><a class="sub" href="/gate/admin?f=charles">🛠 찰스 관리</a></div>';
  }
  h.innerHTML=out;
  h.querySelectorAll(".day[data-day]").forEach(b=>b.onclick=()=>loadDay(b.dataset.day));
  const cs=$("cohortsel");if(cs)cs.onchange=()=>{S.cohort=cs.value;loadDay(S.date);if(S.view==="gloss")loadGloss();};
}

/* ── 그날 ─────────────────────────── */
async function loadDay(date){
  S.date=date||S.me.today;
  $("daytitle").textContent=md(S.date)+" 신문";
  $("totoday").hidden=S.date===S.me.today;
  $("grid").innerHTML='<div class="empty" style="grid-column:1/-1">불러오는 중…</div>';
  const j=await api("/api/challenge/day?date="+S.date+(S.cohort?"&cohort="+S.cohort:""));
  if(!j.ok){$("grid").innerHTML="";$("daymsg").innerHTML='<div class="msg warn">'+esc(j.message||"불러오지 못했어요")+'</div>';$("posts").innerHTML="";return;}
  S.day=j;renderDay();renderHero();
}
function renderDay(){
  const d=S.day;let msg="";
  if(!d.weekday)msg="주말에는 챌린지가 없어요. 푹 쉬세요 🌿";
  else if(!d.images.length)msg=d.today?"오늘 신문이 아직 도착하지 않았어요. 보통 오전 6~7시에 올라와요(자동으로 다시 확인해요).":"이 날은 신문 사진이 없어요.";
  else if(d.archived)msg="지난 날이라 글이 달린 사진만 보관돼 있어요(읽기 전용).";
  else if(d.writable)msg=Object.keys(d.mine).length?"✅ 오늘 글을 썼어요! 다른 기사도 더 써도 돼요. 오늘 밤 12시까지 고칠 수 있어요.":"사진을 하나 골라 <b>WHAT · WHY · HOW · 생각 &amp; 투자에 적용할 점</b>을 써 주세요. 오늘 밤 12시까지 저장해야 인정돼요.";
  else if(!d.today)msg="지난 날은 마감됐어요(읽기 전용).";
  else msg=esc(d.why_not||"지금은 글을 쓸 수 없어요.");
  $("daymsg").innerHTML=msg?'<div class="msg">'+msg+'</div>':"";
  $("grid").innerHTML=d.images.map(im=>'<button class="tile'+(im.mine?' has':'')+'" data-name="'+esc(im.name)+'" aria-label="'+esc(pageNo(im.name))+'면 사진'+(im.mine?' (내 글 있음)':'')+'">'+
      '<img loading="lazy" src="'+esc(im.thumb)+'" alt=""><span class="no">'+esc(pageNo(im.name))+'</span>'+
      (im.mine?'<span class="mine">✅ 내 글</span>':'')+(im.others?'<span class="oth">👥 '+im.others+'</span>':'')+'</button>').join("");
  $("grid").querySelectorAll(".tile").forEach(b=>b.onclick=()=>openEd(b.dataset.name));
  renderPosts();
}
function postHtml(p,withPage){
  return '<article class="post"><div class="who">'+esc(p.nick)+(p.admin?' <span class="badge op">운영자</span>':'')+
    (S.me.admin&&p.cohort?' <span class="badge">'+esc(p.cohort)+'</span>':'')+
    (withPage?' <a href="#" class="pg" data-page="'+esc(p.page)+'">'+esc(pageNo(p.page))+'면 사진 보기</a>':'')+'</div>'+
    '<dl class="kv">'+FIELDS.map(f=>(f[0]==="think"&&p.terms&&p.terms.length?'<dt>용어</dt><dd>'+termsChips(p.terms)+'</dd>':'')+
      '<dt>'+esc(f[1].replace(" & 투자에 적용할 점",""))+'</dt><dd>'+esc(p[f[0]])+'</dd>').join("")+'</dl></article>';
}
function renderPosts(){
  const d=S.day,o=d.others,el=$("posts");
  let h='<h3>👥 '+(S.me.admin?(S.cohort?"이 기수":"모든 기수"):"우리 기수")+' 글 <span class="sub">'+o.count+'개</span></h3>';
  if(o.locked)h+='<div class="lock">🔒 <b>오늘 내 글을 저장하면</b> 우리 기수 찰스들의 글'+(o.count?' '+o.count+'개':'')+'가 열려요.<br><span class="sub">먼저 스스로 생각해 보는 게 챌린지의 핵심이에요.</span></div>';
  else if(!o.posts.length)h+='<div class="lock">아직 다른 찰스의 글이 없어요.</div>';
  else h+=o.posts.map(p=>postHtml(p,true)).join("");
  el.innerHTML=h;
  el.querySelectorAll("a.pg").forEach(a=>a.onclick=e=>{e.preventDefault();openEd(a.dataset.page);});
}

/* ── 글쓰기 창 ─────────────────────────── */
const dkey=(n)=>"ch.draft."+S.date+"."+n;
function setZoom(z){S.zoom=Math.max(1,Math.min(4,z));$("ed-photo").style.width=(S.zoom*100)+"%";}
function openEd(name){
  const d=S.day,im=d.images.find(x=>x.name===name)||{full:"/api/challenge/photo?date="+S.date+"&name="+encodeURIComponent(name)};
  S.page=name;
  $("ed-title").textContent=md(S.date)+" · "+pageNo(name)+"면";
  $("ed-photo").src=im.full;setZoom(1);$("ed-img").scrollTop=0;
  const mine=d.mine[name];let draft=null;
  try{draft=JSON.parse(localStorage.getItem(dkey(name))||"null");}catch(e){}
  let h="";
  if(d.writable){
    const src=draft||mine||{};
    S.terms=(src.terms||[]).slice();
    const fld=f=>'<div class="fld"><label for="f-'+f[0]+'">'+esc(f[1])+' <small id="c-'+f[0]+'"></small></label>'+
       '<textarea id="f-'+f[0]+'" maxlength="'+S.me.limits.max+'" placeholder="'+esc(f[2])+'">'+esc(src[f[0]]||"")+'</textarea></div>';
    h+=FIELDS.slice(0,3).map(fld).join("");
    h+='<div class="fld terms"><label for="t-in">📖 모르는 용어 <small>선택 · '+S.me.limits.terms+'개까지</small></label>'+
       '<div class="tin"><input id="t-in" maxlength="'+S.me.limits.term_len+'" placeholder="예: 기준금리, PER (Enter 로 추가)" autocomplete="off">'+
       '<button id="t-add" type="button">추가</button><button id="t-find" type="button">🔍 뜻 찾기</button></div><div id="t-list"></div></div>';
    h+=fld(FIELDS[3]);
    h+='<div class="ed-actions"><button class="primary" id="ed-save">'+(mine?"고쳐서 저장":"저장")+'</button>'+(mine?'<button id="ed-del">이 글 지우기</button>':'')+
       '<span class="st" id="ed-st">'+(draft?"쓰던 글을 불러왔어요(아직 저장 전).":"칸마다 "+S.me.limits.min+"자 이상 써 주세요.")+'</span></div>';
  }else if(mine){
    h+=FIELDS.map(f=>(f[0]==="think"&&mine.terms&&mine.terms.length?'<div class="fld"><label>📖 모르는 용어</label>'+mine.terms.map(t=>termCard(t,false)).join("")+'</div>':'')+
       '<div class="fld"><label>'+esc(f[1])+'</label><div class="ro">'+esc(mine[f[0]])+'</div></div>').join("");
    h+='<p class="sub">'+(S.me.role==="graduate"?"🎓 완수했어요. 글은 기록으로 남아요(읽기 전용).":"마감된 글이에요(읽기 전용).")+'</p><div class="ed-actions"><span class="st" id="ed-st"></span></div>';
  }else{
    h+='<div class="msg">✏️ '+esc(d.why_not||"이 사진에 쓴 내 글이 없어요.")+'</div>';
  }
  const others=(d.others.posts||[]).filter(p=>p.page===name);
  if(!d.others.locked&&others.length)h+='<div class="ed-others"><b>👥 이 사진에 쓴 글</b>'+others.map(p=>postHtml(p,false)).join("")+'</div>';
  else if(d.others.locked&&d.images.find(x=>x.name===name&&x.others))h+='<div class="ed-others sub">🔒 이 사진에 쓴 다른 찰스 글이 있어요. 내 글을 저장하면 열려요.</div>';
  $("ed-form").innerHTML=h;
  $("ed").classList.add("open");document.body.style.overflow="hidden";
  if(d.writable){
    FIELDS.forEach(f=>{const t=$("f-"+f[0]);const upd=()=>{const n=t.value.trim().length;const c=$("c-"+f[0]);c.textContent=n+"자";c.style.color=n<S.me.limits.min?"var(--bad)":"var(--ok)";};
      t.addEventListener("input",()=>{upd();saveDraft(name);});upd();});
    $("ed-save").onclick=()=>save(name);
    const del=$("ed-del");if(del)del.onclick=()=>delPost(name);
    const tin=$("t-in");
    tin.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===","){e.preventDefault();addTerms(name);}});
    $("t-add").onclick=()=>addTerms(name);
    $("t-find").onclick=()=>findTerms();
    renderTerms(name);
  }
}
function renderTerms(name){
  const el=$("t-list");if(!el)return;
  el.innerHTML=S.terms.map(t=>termCard(t,true)).join("");
  el.querySelectorAll("button[data-rm]").forEach(b=>b.onclick=()=>{S.terms=S.terms.filter(x=>x!==b.dataset.rm);renderTerms(name);saveDraft(name);});
  const f=$("t-find");if(f)f.disabled=!S.terms.some(t=>!glOf(t));
}
function addTerms(name){
  const tin=$("t-in");if(!tin)return true;
  const parts=tin.value.split(/[,\n、，]+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  for(const t of parts){
    if(S.terms.some(x=>tkey(x)===tkey(t)))continue;
    if(S.terms.length>=S.me.limits.terms){st("모르는 용어는 "+S.me.limits.terms+"개까지예요.",true);tin.value="";renderTerms(name);return false;}
    S.terms.push(t.slice(0,S.me.limits.term_len));
  }
  tin.value="";renderTerms(name);saveDraft(name);return true;
}
async function findTerms(){
  const need=S.terms.filter(t=>!glOf(t));if(!need.length)return;
  const b=$("t-find");if(b){b.disabled=true;b.textContent="AI 가 찾는 중…";}
  try{
    const j=await api("/api/challenge/terms",{method:"POST",body:JSON.stringify({terms:need})});
    if(!j.ok){st(j.message||"뜻을 찾지 못했어요.",true);}
    else j.items.forEach(it=>{S.gl[it.key]=it.ok?it:{reason:it.reason};});
  }catch(e){st("인터넷 연결을 확인해 주세요.",true);}
  finally{if(b)b.textContent="🔍 뜻 찾기";renderTerms(S.page);}
}
function saveDraft(name){try{const o={terms:S.terms};FIELDS.forEach(f=>o[f[0]]=$("f-"+f[0]).value);localStorage.setItem(dkey(name),JSON.stringify(o));}catch(e){}}
function closeEd(){$("ed").classList.remove("open");document.body.style.overflow="";$("ed-photo").removeAttribute("src");}
async function save(name){
  if(!addTerms(name))return;                                  // 칸에 적어 두고 '추가'를 안 누른 용어도 함께
  const body={date:S.date,page:name,terms:S.terms};FIELDS.forEach(f=>body[f[0]]=$("f-"+f[0]).value);
  for(const f of FIELDS){if(body[f[0]].trim().length<S.me.limits.min){st(f[1]+" 칸을 "+S.me.limits.min+"자 이상 써 주세요.",true);$("f-"+f[0]).focus();return;}}
  $("ed-save").disabled=true;st("저장 중…");
  try{
    const j=await api("/api/challenge/post",{method:"POST",body:JSON.stringify(body)});
    if(!j.ok){st(j.message||"저장하지 못했어요.",true);if(j.field&&$("f-"+j.field))$("f-"+j.field).focus();return;}
    try{localStorage.removeItem(dkey(name));}catch(e){}
    S.me=j.me;S.day=j.day;renderDay();renderHero();openEd(name);st("✅ 저장했어요!"+(j.day.others.count?" 이제 우리 기수 글을 볼 수 있어요.":""));
    if(S.terms.some(t=>!glOf(t))&&$("t-find"))findTerms();      // 뜻을 아직 안 찾은 용어는 저장하면서 자동으로 찾아 줌
    if(S.me.celebrate)setTimeout(celebrate,500);
  }catch(e){st("인터넷 연결을 확인해 주세요. 쓰던 글은 이 기기에 임시로 남아 있어요.",true);}
  finally{const b=$("ed-save");if(b)b.disabled=false;}
}
async function delPost(name){
  if(!confirm("이 글을 지울까요?"))return;
  const j=await api("/api/challenge/delete",{method:"POST",body:JSON.stringify({date:S.date,page:name})});
  if(!j.ok){st("지우지 못했어요.",true);return;}
  S.me=await api("/api/challenge/me");await loadDay(S.date);openEd(name);st("지웠어요.");
}
function st(t,err){const e=$("ed-st");if(e){e.textContent=t;e.className="st"+(err?" err":"");}}

/* ── 축하 ─────────────────────────── */
function celebrate(){
  const c=$("cele");$("cele-text").textContent=S.me.celebrate_text||"꾸준함은 인생을 바꿀 수 있습니다";
  const name=S.me.progress?S.me.progress.cohort.name+" ":"";
  $("cele-sub").textContent=name+"챌린지를 완수했어요! 이제 모든 화면을 기한 없이 이용할 수 있어요.";
  c.querySelectorAll(".confetti").forEach(x=>x.remove());
  const colors=["#f06a2b","#f5b041","#2f7be0","#1f9d55","#e84393","#8e44ad"];
  for(let i=0;i<70;i++){const s=document.createElement("i");s.className="confetti";s.style.left=Math.random()*100+"%";
    s.style.background=colors[i%colors.length];s.style.animationDuration=(2.2+Math.random()*2.4)+"s";s.style.animationDelay=(Math.random()*.8)+"s";c.appendChild(s);}
  c.classList.add("open");
}
async function celebrated(){try{await api("/api/challenge/celebrated",{method:"POST",body:"{}"});}catch(e){}}
$("cele-go").onclick=async()=>{await celebrated();location.href="/economy";};
$("cele-close").onclick=async()=>{$("cele").classList.remove("open");await celebrated();location.reload();};

/* ── 📖 우리 기수 용어장 ─────────────────────────── */
S.view="day";S.gloss=null;
function setView(v){
  S.view=v;
  $("v-day").setAttribute("aria-selected",v==="day");$("v-gloss").setAttribute("aria-selected",v==="gloss");
  $("daycard").hidden=$("posts").hidden=v!=="day";$("glosscard").hidden=v!=="gloss";
  try{history.replaceState(null,"",v==="gloss"?"#glossary":location.pathname);}catch(e){}
  if(v==="gloss")loadGloss();
}
async function loadGloss(){
  $("g-list").innerHTML='<div class="empty" style="grid-column:1/-1">불러오는 중…</div>';
  const j=await api("/api/challenge/glossary"+(S.cohort?"?cohort="+S.cohort:""));
  if(!j.ok){$("g-list").innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(j.message||"불러오지 못했어요")+'</div>';return;}
  S.gloss=j;renderGloss();
}
function renderGloss(){
  const j=S.gloss;if(!j)return;
  const q=tkey($("g-q").value),sort=$("g-sort").value;
  let items=j.items.filter(x=>!q||x.key.includes(q)||tkey(x.short||"").includes(q));
  items.sort(sort==="many"?(a,b)=>b.count-a.count||a.term.localeCompare(b.term,"ko"):sort==="new"?(a,b)=>b.last.localeCompare(a.last)||a.term.localeCompare(b.term,"ko"):(a,b)=>a.term.localeCompare(b.term,"ko"));
  $("g-count").textContent=j.items.length?("용어 "+j.items.length+"개"+(q?" 중 "+items.length+"개":"")):"";
  if(!j.items.length){$("g-list").innerHTML='<div class="empty" style="grid-column:1/-1">아직 모인 용어가 없어요.<br>글을 쓸 때 <b>📖 모르는 용어</b> 칸에 적으면 여기에 모여요.</div>';return;}
  $("g-list").innerHTML=items.map(x=>{const t=new Date(x.last+"T00:00:00");
    return '<article class="gcard'+(x.short?'':' none')+'"><h4>'+esc(x.term)+(x.mine?' <span class="badge">내 용어</span>':'')+'</h4>'+
      (x.short?'<div class="short">'+esc(x.short)+'</div><div>'+esc(x.easy||"")+'</div>'+(x.invest?'<div class="inv">💡 '+esc(x.invest)+'</div>':''):'<div class="short">아직 풀이가 없어요.</div>')+
      '<div class="gf"><span>'+x.count+'번 · '+x.people+'명</span><button data-day="'+esc(x.last)+'">'+(t.getMonth()+1)+'/'+t.getDate()+' 글 보기</button>'+
      (!x.short&&j.can_lookup?'<button data-find="'+esc(x.term)+'">🔍 뜻 찾기</button>':'')+
      '</div></article>';}).join("")||'<div class="empty" style="grid-column:1/-1">찾는 용어가 없어요.</div>';
  $("g-list").querySelectorAll("button[data-day]").forEach(b=>b.onclick=()=>{setView("day");loadDay(b.dataset.day);});
  $("g-list").querySelectorAll("button[data-find]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="AI 가 찾는 중…";
    try{await api("/api/challenge/terms",{method:"POST",body:JSON.stringify({terms:[b.dataset.find]})});}catch(e){}
    loadGloss();});
}
$("v-day").onclick=()=>setView("day");$("v-gloss").onclick=()=>setView("gloss");
$("g-q").addEventListener("input",renderGloss);$("g-sort").onchange=renderGloss;

/* ── 시작 ─────────────────────────── */
$("ed-close").onclick=closeEd;
$("ed").addEventListener("click",e=>{if(e.target.id==="ed")closeEd();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ed").classList.contains("open"))closeEd();});
$("zin").onclick=()=>setZoom(S.zoom+.5);$("zout").onclick=()=>setZoom(S.zoom-.5);$("zfit").onclick=()=>setZoom(1);
$("ed-photo").addEventListener("dblclick",()=>setZoom(S.zoom>1?1:2));
$("totoday").onclick=()=>loadDay(S.me.today);

async function boot(){
  try{
    const me=await api("/api/challenge/me");
    if(!me.ok){$("hero").innerHTML='<div class="empty">'+esc(me.message||"챌린지 정보를 불러오지 못했어요.")+'</div>';return;}
    S.me=me;renderHero();await loadDay(me.today);
    if(location.hash==="#glossary")setView("gloss");
    if(me.celebrate)setTimeout(celebrate,400);
    // 신문이 아직이면 5분마다 다시 확인
    setInterval(async()=>{if(S.date===S.me.today&&S.day&&!S.day.images.length&&!$("ed").classList.contains("open")){S.me=await api("/api/challenge/me");loadDay(S.me.today);}},300000);
  }catch(e){if(e.message!=="login")$("hero").innerHTML='<div class="empty">불러오지 못했어요. 새로고침해 주세요.</div>';}
}
boot();
})();
</script>
</body>
</html>
