<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘 신문 요약</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#eef0f4; --surface:#fff; --ink:#191c24; --muted:#5c6675; --faint:#8a93a3;
    --line:#dfe3ea; --line-strong:#cfd5df; --accent:#2f4272; --accent-bright:#3a5bd0;
    --c-news:#45589e; --c-brief:#0d7f72; --c-alert:#a86413; --c-side:#bd3529; --c-other:#6a7180;
    --live:#12a150;
    --shadow:0 1px 2px rgba(20,26,40,.05),0 8px 24px -14px rgba(20,26,40,.18);
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono","JetBrains Mono","D2Coding",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1118; --surface:#161a23; --ink:#e7eaf1; --muted:#9aa3b4; --faint:#6f7889;
    --line:#242a36; --line-strong:#313848; --accent:#9fb2ef; --accent-bright:#7f9bf5;
    --c-news:#8aa0f0; --c-brief:#33c3af; --c-alert:#e0a552; --c-side:#f0776d; --c-other:#8b93a4;
    --live:#34d178; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7);
  }}
  :root[data-theme="light"]{
    --bg:#eef0f4;--surface:#fff;--ink:#191c24;--muted:#5c6675;--faint:#8a93a3;--line:#dfe3ea;--line-strong:#cfd5df;
    --accent:#2f4272;--accent-bright:#3a5bd0;--c-news:#45589e;--c-brief:#0d7f72;--c-alert:#a86413;--c-side:#bd3529;--c-other:#6a7180;--live:#12a150;
    --shadow:0 1px 2px rgba(20,26,40,.05),0 8px 24px -14px rgba(20,26,40,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0e1118;--surface:#161a23;--ink:#e7eaf1;--muted:#9aa3b4;--faint:#6f7889;--line:#242a36;--line-strong:#313848;
    --accent:#9fb2ef;--accent-bright:#7f9bf5;--c-news:#8aa0f0;--c-brief:#33c3af;--c-alert:#e0a552;--c-side:#f0776d;--c-other:#8b93a4;--live:#34d178;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:calc(720px + max(0px, (var(--fs) - 1) * 420px));margin:0 auto;padding:0 20px 96px}
  header.mast{padding:40px 0 18px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:10px}
  .eyebrow .label{font-family:var(--sans);letter-spacing:.04em;font-size:12.5px}
  .eyebrow .live{display:inline-flex;align-items:center;gap:6px;color:var(--live);letter-spacing:.08em}
  .eyebrow .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--live)}
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line-strong)}
  h1.date{font-size:clamp(27px,6vw,38px);font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;line-height:1.12;text-wrap:balance;font-variant-numeric:tabular-nums}
  .lede{color:var(--muted);font-size:15px;margin:0 0 16px;max-width:52ch}
  .datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .datebar input[type=date]{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn:focus-visible,input:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
  .btn[hidden]{display:none}
  #unhide{border-style:dashed}
  .updated{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}

  .toolbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:14px -20px 0;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,color .15s,background .15s;user-select:none}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--c-other));flex:none}
  .chip .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{color:var(--ink);border-color:var(--dot,var(--accent));background:color-mix(in srgb,var(--dot,var(--accent)) 9%,var(--surface))}
  .chip[aria-pressed="true"] .n{color:var(--dot,var(--accent))}
  .chip:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
  .chip.all .dot{background:linear-gradient(120deg,var(--accent-bright),var(--c-other))}

  .feed{margin-top:26px;position:relative}
  .entry{position:relative;padding:0 0 26px 78px}
  .entry::before{content:"";position:absolute;left:63px;top:6px;bottom:-6px;width:2px;background:var(--line-strong)}
  .entry:last-child::before{display:none}
  .entry .node{position:absolute;left:57px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--dot,var(--c-other));z-index:1}
  .entry .time{position:absolute;left:0;top:1px;width:46px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px 15px;overflow:hidden}
  .card .meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .tag{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dot);padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--dot) 12%,transparent)}
  .kind{font-family:var(--mono);font-size:11px;color:var(--faint)}
  /* ── 글자 크기 조절 (2026-09-23) ── 요약 글의 크기는 전부 '기본 px × --fs(배율)' 로 계산한다.
     툴바의 가− / 가+ 가 --fs 하나만 바꾸면 제목·카테고리·본문·라벨이 같은 비율로 함께 커진다.
     한국어 가독성: keep-all = 낱말 중간에서 줄을 끊지 않는다('재건'/'축' 처럼 쪼개지지 않게).
     아주 긴 숫자·주소만 overflow-wrap 으로 예외적으로 끊는다(화면 밖으로 삐져나가지 않게). */
  :root{--fs:1}
  .body{font-size:calc(15.5px*var(--fs));line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.003em}
  .body strong{font-weight:700}
  .body em{font-style:italic;color:var(--muted)}
  .body code{font-family:var(--mono);font-size:.9em;background:color-mix(in srgb,var(--muted) 14%,transparent);padding:1px 5px;border-radius:4px}
  .body a{color:var(--accent-bright);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent-bright) 40%,transparent)}
  .body .imgnote{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-size:calc(12px*var(--fs));color:var(--faint);border:1px dashed var(--line-strong);border-radius:6px;padding:4px 9px}
  /* ── 신문 브리핑 전용 서식 ─────────────────────────────────
     슬랙 원문은 한 덩어리 텍스트라 읽기 힘들어서, 뷰어에서
     헤더 / 카테고리 / 기사 제목 / WHAT·WHY·HOW / 원문확인 으로
     쪼개 각각 다른 크기·굵기로 보여준다. */
  .brf-head{font-size:calc(18px*var(--fs));font-weight:800;letter-spacing:-.01em;line-height:1.35;margin:2px 0 16px;padding-bottom:11px;border-bottom:2px solid var(--line-strong)}
  .brf-cat{display:block;font-size:calc(22px*var(--fs));font-weight:800;letter-spacing:-.02em;line-height:1.3;color:var(--accent);margin:30px 0 16px;padding-left:13px;border-left:5px solid var(--accent-bright)}
  .brf-cat:first-child{margin-top:2px}
  .brf-art{margin:0 0 34px}            /* ← 원문 확인 뒤 "두 줄" 여백 (기사 단위 줄바꿈) */
  .brf-art:last-child{margin-bottom:2px}
  .brf-title{font-size:calc(17.5px*var(--fs));font-weight:750;line-height:1.45;letter-spacing:-.012em;margin:0 0 5px;text-wrap:pretty}
  .brf-flag{display:inline-block;font-family:var(--mono);font-size:calc(11px*var(--fs));font-weight:700;letter-spacing:.04em;vertical-align:.15em;margin-right:8px;padding:2px 7px;border-radius:5px;color:var(--c-side);background:color-mix(in srgb,var(--c-side) 12%,transparent);white-space:nowrap}
  .brf-sub{font-size:calc(14px*var(--fs));color:var(--muted);line-height:1.65;margin:0 0 .8em}
  .brf-kv{display:flex;gap:10px;margin:.45em 0;font-size:calc(15px*var(--fs));line-height:1.75}
  .brf-kv .k{flex:none;width:calc(50px*var(--fs));font-family:var(--mono);font-size:calc(10.5px*var(--fs));font-weight:700;letter-spacing:.07em;color:var(--faint);padding-top:.45em}
  .brf-kv .v{flex:1;min-width:0}
  .brf-line{margin:.45em 0;font-size:calc(15px*var(--fs));line-height:1.75}
  /* "🔍 …반드시 연결해서 봐야 할 5가지" 같은 묶음 머리말 + 그 아래 번호 목록 (2026-09-23)
     머리말은 기사 제목과 다른 '섹션 제목' 모양, 번호는 동그라미 배지 + 내어쓰기(둘째 줄도 글 첫머리에 맞춤) */
  .brf-sec{font-size:calc(18px*var(--fs));font-weight:800;letter-spacing:-.015em;line-height:1.4;margin:30px 0 12px;
           padding-bottom:8px;border-bottom:1px solid var(--line-strong)}
  .brf-sec:first-child{margin-top:2px}
  .brf-num{display:flex;gap:10px;align-items:flex-start;margin:.55em 0;font-size:calc(15.5px*var(--fs));line-height:1.75}
  .brf-num .n{flex:none;min-width:1.65em;height:1.65em;margin-top:.08em;border-radius:999px;display:inline-flex;
              align-items:center;justify-content:center;font-family:var(--mono);font-size:.8em;font-weight:800;
              color:var(--accent);background:color-mix(in srgb,var(--accent-bright) 14%,transparent)}
  .brf-num .v{flex:1;min-width:0}
  /* 항목 아래 딸린 설명 — 항목 글 첫머리에 맞춰 흐리게(요점과 설명이 한눈에 구분되게) */
  .brf-num .note{display:block;margin-top:.25em;color:var(--muted);font-size:.94em;line-height:1.7}
  .brf-num + .brf-num{margin-top:.9em}
  /* ── 핵심 요약 블록 (2026-09-24) ─────────────────────────────────────
     GPT 요약 끝의 "📌 오늘 신문 핵심 한 줄 …" 과 "✅ 오늘 반드시 체크할 핵심 주제" 아래 줄들이
     서식 없이 평범한 글줄로 늘어서 눈에 안 들어오던 문제.
       · 핵심 한 줄 → 강조 상자(작은 머리표 + 크고 굵은 한 문장)
       · 체크 주제  → ✓ 표시가 붙은 칸들. 넓은 화면은 2열 격자, 폰은 1열 */
  .brf-key{margin:22px 0 18px;padding:14px 16px 15px;border-radius:12px;border-left:5px solid var(--accent-bright);
           background:color-mix(in srgb,var(--accent-bright) 9%,var(--surface))}
  .brf-key:first-child{margin-top:2px}
  .brf-key .lbl{display:block;font-size:calc(12.5px*var(--fs));font-weight:800;letter-spacing:.02em;color:var(--accent);margin-bottom:6px}
  .brf-key .txt{display:block;font-size:calc(17px*var(--fs));font-weight:650;line-height:1.65;letter-spacing:-.01em}
  .brf-chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px;margin:4px 0 16px}
  .brf-chk{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
           background:var(--surface);font-size:calc(15px*var(--fs));line-height:1.55}
  .brf-chk .ic{flex:none;width:1.35em;height:1.35em;margin-top:.1em;border-radius:999px;display:inline-flex;align-items:center;
               justify-content:center;font-size:.78em;font-weight:900;color:var(--c-brief);
               background:color-mix(in srgb,var(--c-brief) 15%,transparent)}
  .brf-chk .v{flex:1;min-width:0}
  /* 기사가 아닌 앞머리 안내문 — 작고 흐리게, 사진 칸 없음 */
  .brf-intro{margin:0 0 10px;color:var(--muted)}
  .brf-intro .brf-title{font-size:calc(14.5px*var(--fs));font-weight:500;color:var(--muted);margin:0}
  .brf-intro .brf-sub,.brf-intro .brf-line{font-size:calc(14px*var(--fs))}
  .brf-tblwrap{overflow-x:auto;margin:.55em 0 .8em calc(50px*var(--fs) + 10px);-webkit-overflow-scrolling:touch}
  .brf-tbl{border-collapse:collapse;font-size:calc(14px*var(--fs));line-height:1.5;min-width:60%}
  .brf-tbl th,.brf-tbl td{border:1px solid var(--line-strong);padding:.38em .75em;text-align:left;vertical-align:top;word-break:keep-all}
  .brf-tbl th{background:color-mix(in srgb,var(--accent-bright) 10%,var(--surface));font-weight:700;white-space:nowrap}
  .brf-tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .brf-tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--muted) 5%,transparent)}
  .body > .brf-tblwrap,.brf-intro .brf-tblwrap{margin-left:0}
  @media (max-width:520px){ .brf-tblwrap{margin-left:0} }
  .brf-flagnote{margin:2px 0 10px}
  .brf-detail{color:var(--muted);margin-left:calc(50px*var(--fs) + 10px)}   /* WHAT·WHY 본문 첫머리에 맞춤 */
  @media (max-width:520px){ .brf-detail{margin-left:0} }
  .brf-detail .dl{font-weight:700;color:var(--ink)}
  .brf-src{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-family:var(--mono);font-size:calc(12px*var(--fs));color:var(--faint);border:1px dashed var(--line-strong);border-radius:6px;padding:3px 9px}
  .brf-src.fail{color:var(--c-side);border-color:color-mix(in srgb,var(--c-side) 35%,transparent)}
  /* (2026-09-17 원문 링크 표시 중단으로 현재 미사용 — 되살릴 때 그대로 쓸 수 있게 남겨 둠) */
  .brf-src .brf-host{font-weight:700;color:var(--muted)}
  .brf-src.warn{color:var(--c-alert);border-style:solid;border-color:color-mix(in srgb,var(--c-alert) 45%,transparent);background:color-mix(in srgb,var(--c-alert) 8%,transparent)}
  .brf-src .brf-warn{font-family:var(--sans);font-weight:700}
  @media (max-width:520px){
    .brf-cat{font-size:calc(19px*var(--fs));margin:24px 0 13px}
    .brf-title{font-size:calc(16.5px*var(--fs))}
    .brf-kv{display:block}
    .brf-kv .k{display:inline-block;width:auto;margin-right:7px;padding-top:0}
  }
  .daybreak{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:4px 0 20px 78px}
  .empty{text-align:center;color:var(--muted);padding:56px 20px}
  .empty .big{font-size:17px;color:var(--ink);font-weight:700;margin-bottom:6px}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media (max-width:520px){.entry{padding-left:66px}.entry .time{width:40px;font-size:12px}.entry .node{left:47px}.entry::before{left:53px}.daybreak{margin-left:66px}}
  @media (prefers-reduced-motion:no-preference){
    .entry.is-new{animation:rise .4s ease both}   /* 새 메시지에만 등장 효과(기존 카드는 가만히) */
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .pulse{animation:blink 2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  }
  /* ── 오늘 신문 원본 패널 ─────────────────────────────────────────────
     드라이브에 올라온 그날 신문 PDF·사진을 바로 받을 수 있는 카드.
     썸네일은 loading="lazy" + 기본 접힘이라, 열기 전엔 데이터를 쓰지 않는다. */
  .news{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
        padding:15px 17px 16px;margin-top:18px}
  .news-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
  .news-kicker{font-size:15.5px;font-weight:800;letter-spacing:-.015em;color:var(--ink)}
  .news-kicker .ico{margin-right:6px}
  /* 요약줄(order:3)은 항상 아랫줄로 내려보내, 좁은 화면에서도 '받아오기' 버튼이
     제목과 같은 줄에 남도록 한다. */
  .news-sub{order:3;flex-basis:100%;font-family:var(--mono);font-size:11.5px;color:var(--faint);
            font-variant-numeric:tabular-nums;margin-top:-3px}
  .news-sub:empty{display:none}
  .news-refresh{order:2;margin-left:auto;padding:4px 10px;font-size:12px;line-height:1.5}
  .news-refresh[disabled]{opacity:.5;cursor:default}
  .news-actions{display:flex;gap:8px;flex-wrap:wrap}
  .news-actions:empty{display:none}
  .news-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13.5px;font-weight:650;
            text-decoration:none;border-radius:10px;padding:9px 14px;border:1px solid var(--line-strong);
            color:var(--ink);background:var(--surface);transition:border-color .15s,background .15s}
  .news-btn:hover{border-color:var(--accent-bright)}
  .news-btn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
  .news-btn.primary{background:color-mix(in srgb,var(--accent-bright) 12%,var(--surface));border-color:var(--accent-bright);color:var(--accent)}
  .news-btn.primary .sz{color:var(--accent)}
  .news-toggle{margin-top:11px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);
               background:none;border:0;padding:4px 0;cursor:pointer}
  .news-toggle:hover{color:var(--ink)}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:11px}
  /* ⚠️ hidden 속성은 브라우저 기본 display:none 인데, 위의 display:grid 가 더 세서
     그냥 두면 '접기'를 눌러도 안 접힌다(2026-09-16 실제 발생). 명시적으로 눌러준다. */
  .news-grid[hidden]{display:none}
  .news-actions[hidden]{display:none}
  .news-cell{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);
             aspect-ratio:3/4;display:block}
  .news-cell img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg)}
  .news-cell .no{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;
                 background:rgba(15,20,32,.62);padding:2px 6px;border-bottom-right-radius:6px}
  .news-cell .dl{position:absolute;right:4px;bottom:4px;font-size:11px;line-height:1;color:#fff;text-decoration:none;
                 background:rgba(15,20,32,.62);border-radius:6px;padding:4px 6px}
  .news-cell .dl:hover{background:var(--accent-bright)}
  .news-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}
  .news-note a{color:var(--accent-bright);text-decoration:none}
  .news.waiting{border-style:dashed;box-shadow:none}
  @media (max-width:520px){
    .news{padding:13px 14px 14px;border-radius:12px}
    .news-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
    .news-btn{font-size:13px;padding:8px 12px}
  }
  /* ── 신문 넘겨 보기(뷰어) ────────────────────────────────────────────
     신문 사진은 글씨가 작아서 '확대'가 핵심이다. 그래서 단순 크게보기가 아니라
     확대·이동(핀치/더블탭/드래그)까지 넣었다. 배경은 항상 어둡게 — 종이가 밝아서
     주변이 밝으면 눈이 부시고 글씨가 안 읽힌다. */
  .lb{position:fixed;inset:0;z-index:60;background:#0b0e14;display:flex;flex-direction:column;
      touch-action:none;overscroll-behavior:contain}
  .lb[hidden]{display:none}
  .lb-bar{display:flex;align-items:center;gap:6px;padding:10px 12px;
          padding-top:max(10px,env(safe-area-inset-top));color:#e7eaf1;
          background:linear-gradient(#0b0e14ee,#0b0e1400);position:relative;z-index:2}
  .lb-count{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:#c7cedb}
  .lb-count b{color:#fff;font-weight:700}
  .lb-native{font-family:var(--mono);font-size:11.5px;color:#8b93a4;margin-right:auto;margin-left:7px}
  .lb-btn{appearance:none;border:1px solid #2b3244;background:#161a23;color:#e7eaf1;border-radius:9px;
          min-width:38px;height:36px;font-size:15px;line-height:1;cursor:pointer;display:inline-flex;
          align-items:center;justify-content:center;text-decoration:none;padding:0 9px}
  .lb-btn:hover{border-color:#7f9bf5;color:#fff}
  .lb-btn:disabled{opacity:.35;cursor:default}
  .lb-stage{flex:1;position:relative;overflow:hidden}
  /* ⚠️ 확대를 transform:scale 로 하면 브라우저가 '작게 그려둔 그림을 늘려' 글씨가 뭉개진다
     (will-change:transform 이면 더 심하다). 그래서 실제 width/height 를 바꿔서
     그 크기로 '다시 그리게' 한다 → 원본 해상도까지는 글씨가 또렷하다.
     이동(translate)만 transform 으로 하는 건 화질에 영향이 없다. */
  .lb-stage img{position:absolute;left:0;top:0;user-select:none;-webkit-user-drag:none;background:#fff}
  /* ── 형광펜 ───────────────────────────────────────────────────────────
     사진 '위'에 투명한 그림판을 정확히 겹쳐 둔다. 사진과 똑같은 위치·크기·이동을
     그대로 따라가므로, 확대하거나 끌어도 형광펜이 글씨에 딱 붙어 있다.
     mix-blend-mode:multiply → 진짜 형광펜처럼 글씨가 비쳐 보인다(덧칠해도 안 진해짐). */
  .lb-mark{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:multiply;opacity:.62}
  .lb-stage.marking{cursor:crosshair}
  .lb-stage.marking img{cursor:crosshair}
  /* 방금 그린 동그라미 위에 커서를 올리면 '옮길 수 있다'고 모양으로 알려준다.
     .marking 보다 클래스가 하나 더 많아 우선순위가 높다 → 십자 커서를 이긴다. */
  .lb-stage.marking.movable,.lb-stage.marking.movable img{cursor:move}
  .lb-stage.moving,.lb-stage.moving img{cursor:grabbing}
  /* 형광펜 모드일 때 아래쪽에 뜨는 작은 도구모음 */
  /* 도구모음은 **사진 위에 떠 있지 않고** 상단 바 바로 아래 '한 줄'을 차지한다.
     .lb 가 세로 flex 이고 .lb-stage 가 flex:1 이라, 이 줄이 생기면 사진 영역이 그만큼
     줄어들고 사진은 남은 자리에 다시 맞춰진다 → **지면을 절대 가리지 않는다.**
     ⚠️ display:flex 를 주면 hidden 속성이 안 먹는다(작성자 규칙이 UA 규칙을 이긴다).
        실제로 형광펜을 켜지 않아도 도구모음이 계속 떠 있었다 → [hidden] 규칙을 따로 둔다.
     ⚠️ 버튼이 9개라 좁은 폰에서는 한 줄에 다 안 들어간다 → flex-wrap 으로 두 줄로 접는다. */
  .lb-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;align-items:center;
            padding:6px 10px;background:#11151f;border-bottom:1px solid #242a36;
            position:relative;z-index:2}
  .lb-tools[hidden]{display:none}
  .lb-tools button{appearance:none;border:1px solid transparent;background:transparent;color:#e7eaf1;
            border-radius:999px;height:32px;min-width:34px;padding:0 10px;font-size:13px;cursor:pointer;
            display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .lb-tools button:hover{background:#1b2130}
  .lb-tools button[aria-pressed="true"]{background:#2f4272;border-color:#7f9bf5;color:#fff}
  .lb-tools .sep{width:1px;height:20px;background:#2b3244}
  .lb-tools .pen{width:16px;height:16px;border-radius:4px;border:1px solid #00000040}
  /* 선 굵기 견본 — 버튼 안에 '그 굵기의 막대'를 그려 눈으로 바로 비교되게 한다 */
  .lb-tools .gauge{width:17px;height:16px;display:inline-flex;align-items:center;justify-content:center}
  .lb-tools .gauge i{display:block;width:100%;border-radius:999px;background:#c9d2e6}
  .lb-tools button[aria-pressed="true"] .gauge i{background:#fff}
  .lb-saved{font-family:var(--mono);font-size:11px;color:#8b93a4;padding:0 4px}
  @media (max-width:520px){
    .lb-tools{gap:4px;padding:5px 6px}
    .lb-tools button{height:30px;min-width:30px;padding:0 5px;font-size:12px}
    .lb-saved{width:100%;text-align:center;font-size:10.5px}   /* 안내문은 아랫줄로 */
  }
  .lb-stage.zoomed{cursor:grab}
  .lb-stage.zoomed:active{cursor:grabbing}
  .lb-stage.panning{cursor:grabbing}           /* 오른쪽 버튼으로 끌어 옮기는 중 */
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:64px;
          border:0;border-radius:10px;background:#161a23cc;color:#e7eaf1;font-size:26px;line-height:1;
          cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb-nav:hover{background:#2f4272;color:#fff}
  .lb-nav[disabled]{opacity:.25;cursor:default}
  .lb-nav.prev{left:10px} .lb-nav.next{right:10px}
  /* ── 화살표가 신문 글씨를 가리지 않게 ────────────────────────────────
     ① 1초 동안 아무 조작이 없으면 스르륵 사라진다(화면을 만지거나 마우스를
        움직이면 곧바로 다시 나온다).
     ② 사진 양옆에 빈 공간이 있으면 JS 가 화살표를 그 여백으로 옮긴다
        (placeNav) → 아예 지면 위에 올라가지 않는다.
     사라져 있는 동안엔 pointer-events 를 꺼서 잘못 눌리는 일도 없다. */
  .lb-nav{transition:opacity .3s ease, background .15s}
  .lb-nav.idle, .lb-nav[disabled].idle{opacity:0;pointer-events:none}
  .lb-hint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
           font-family:var(--mono);font-size:11.5px;color:#8b93a4;background:#0b0e14cc;border-radius:999px;
           padding:5px 12px;pointer-events:none;transition:opacity .4s;z-index:2;
           white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:520px){.lb-hint{font-size:11px;padding:4px 10px}}
  .lb-hint.gone{opacity:0}
  .lb-spin{position:absolute;width:26px;height:26px;border:2.5px solid #2b3244;border-top-color:#7f9bf5;
           border-radius:50%;animation:lbspin .7s linear infinite}
  @keyframes lbspin{to{transform:rotate(360deg)}}
  @media (max-width:520px){
    .lb-nav{width:38px;height:54px;font-size:22px;background:#161a2399}
    .lb-nav.prev{left:4px} .lb-nav.next{right:4px}
  }
  /* ── 보기 방식 전환: 📝 글만(기존) / 📰 글+지면 (2026-09-23) ─────────────────
     '글+지면' 에선 브리핑의 기사마다 오른쪽에 그 기사가 실린 신문 사진을 붙인다.
     사진을 누르면 넘겨 보기 뷰어가 **형광펜이 켜진 채로** 그 장에서 열린다.
     '글만' 으로 돌아가면 사진 칸을 통째로 걷어내 기존 화면과 완전히 같아진다. */
  .tb-right{margin-left:auto;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fontctl{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);padding:2px}
  .fontctl button{appearance:none;border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-weight:700;
           border-radius:999px;min-width:34px;height:28px;padding:0 8px;cursor:pointer;line-height:1}
  .fontctl button:hover:not(:disabled){background:color-mix(in srgb,var(--accent-bright) 12%,transparent)}
  .fontctl button:disabled{opacity:.35;cursor:default}
  .fontctl button:focus-visible{outline:2px solid var(--accent-bright);outline-offset:1px}
  .fontctl .dn{font-size:12px} .fontctl .up{font-size:16px}
  .fontctl .lv{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted);min-width:46px}
  .viewseg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;
           background:var(--surface);padding:2px;gap:2px}
  .viewseg button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--sans);
           font-size:12.5px;font-weight:650;border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
  .viewseg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
  .viewseg button:focus-visible{outline:2px solid var(--accent-bright);outline-offset:1px}
  body.paper .wrap{max-width:1120px}
  .paper-note{margin:0 0 18px 78px;font-size:13px;color:var(--muted);border:1px dashed var(--line-strong);
              border-radius:10px;padding:9px 12px}
  .brf-art.has-side{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start;
                    padding-top:14px;border-top:1px solid var(--line)}
  .brf-cat + .brf-art.has-side,.brf-head + .brf-art.has-side{border-top:0;padding-top:0}
  .brf-side{display:flex;flex-direction:column;gap:7px;min-width:0}
  .side-fig{appearance:none;display:block;position:relative;width:100%;padding:0;border:1px solid var(--line-strong);
            border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;line-height:0}
  .side-fig:hover{border-color:var(--accent-bright)}
  .side-fig:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
  .side-fig img{display:block;width:100%;height:auto;min-height:60px}
  .side-fig.crop{height:auto;max-height:420px}
  .side-fig canvas{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:multiply;opacity:.62}
  .side-no{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10.5px;font-weight:700;line-height:1.5;
           color:#fff;background:rgba(15,20,32,.66);padding:2px 7px;border-bottom-right-radius:7px}
  .side-acts{display:flex;gap:6px;flex-wrap:wrap}
  .side-acts button{appearance:none;font-family:var(--sans);font-size:12.5px;font-weight:650;color:var(--ink);
           background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 9px;cursor:pointer}
  .side-acts button:hover{border-color:var(--accent-bright)}
  .side-acts button.primary{background:color-mix(in srgb,var(--accent-bright) 12%,var(--surface));
           border-color:var(--accent-bright);color:var(--accent)}
  .side-acts button.quiet{color:var(--muted);border-style:dashed}
  .side-src{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .side-empty{font-size:12.5px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:8px;
              padding:14px 10px;text-align:center;line-height:1.5}
  /* 좁은 화면: 사진을 기사 '아래'에 작게(가로 한 줄) — 세로로 긴 지면이 화면을 다 먹지 않게 */
  @media (max-width:760px){
    .brf-art.has-side{grid-template-columns:minmax(0,1fr);gap:10px}
    .brf-side{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;align-items:start}
    .brf-side .side-fig{grid-row:span 2}
    .brf-side.nolink{display:flex}
    .paper-note{margin-left:66px}
  }
  @media (max-width:520px){ .viewseg button{padding:5px 9px;font-size:12px} }
  /* 뷰어 상단 '📌 이 장 연결' — 지면 고르기 중에만 보인다 */
  .lb-btn[hidden]{display:none}
  @media (max-width:520px){ .lb-btn.pick .lg{display:none} }
  .lb-btn.pick{background:#2f4272;border-color:#7f9bf5;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow"><span class="label">오늘 신문 요약</span><span class="live"><span class="pulse"></span>LIVE</span></div>
    <h1 class="date" id="date">불러오는 중…</h1>
    <p class="lede">쉽게 보는 오늘 뉴스</p>
    <div class="datebar">
      <input type="date" id="datepick" aria-label="날짜 선택">
      <button class="btn" id="today">오늘</button>
      <button class="btn" id="hide-old" title="이 날짜에 지금까지 올라온 요약을 화면에서 치운다(슬랙 원본은 그대로, 되돌리기 가능)">🧹 지금까지 것 숨기기</button>
      <button class="btn" id="unhide" hidden></button>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <!-- 오늘 신문 원본: 구글 드라이브에 올라온 그날 PDF·사진을 바로 내려받는 칸 -->
  <section class="news" id="news" hidden>
    <div class="news-head">
      <span class="news-kicker"><span class="ico">📰</span><span id="news-title">오늘 신문 원본</span></span>
      <span class="news-sub" id="news-sub"></span>
      <button class="btn news-refresh" id="news-refresh" title="구글 드라이브에서 다시 받아오기">↻ 받아오기</button>
    </div>
    <div class="news-actions" id="news-actions"></div>
    <button class="news-toggle" id="news-toggle" aria-expanded="false" hidden></button>
    <div class="news-grid" id="news-grid" hidden></div>
    <div class="news-note" id="news-note"></div>
  </section>

  <div class="toolbar" id="toolbar"></div>
  <main class="feed" id="feed"></main>
  <footer>
    <span id="foot-count">—</span>
    <span>#gpt 채널 기준 · 20초마다 자동 갱신 · KST</span>
  </footer>
</div>

<!-- 신문 사진 넘겨 보기. 썸네일을 누르면 열린다. -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="신문 사진 보기">
  <div class="lb-bar">
    <span class="lb-count" id="lb-count"></span><span class="lb-native" id="lb-native"></span>
    <button class="lb-btn pick" id="lb-pick" hidden title="지금 보는 장을 이 기사의 지면으로 연결">📌 <span class="lg">이 장 </span>연결</button>
    <button class="lb-btn" id="lb-pen" title="형광펜 (H)" aria-label="형광펜" aria-pressed="false">🖍</button>
    <button class="lb-btn" id="lb-out" title="축소" aria-label="축소">−</button>
    <button class="lb-btn" id="lb-in" title="확대" aria-label="확대">＋</button>
    <a class="lb-btn" id="lb-dl" href="#" title="이 장 저장" aria-label="이 장 저장">⤓</a>
    <button class="lb-btn" id="lb-close" title="닫기 (Esc)" aria-label="닫기">✕</button>
  </div>
  <button class="lb-nav prev" id="lb-prev" aria-label="이전 장">‹</button>
  <div class="lb-tools" id="lb-tools" hidden>
    <button id="lb-c1" title="빨강" aria-label="빨강"><span class="pen" style="background:#ff5b5b"></span></button>
    <button id="lb-c2" title="파랑" aria-label="파랑"><span class="pen" style="background:#4da3ff"></span></button>
    <button id="lb-c3" title="노랑" aria-label="노랑"><span class="pen" style="background:#ffd93b"></span></button>
    <span class="sep"></span>
    <button id="lb-t-line" title="직선 — 자를 댄 것처럼 반듯하게" aria-pressed="true">━</button>
    <button id="lb-t-oval" title="동그라미 — 기사를 둥글게 표시 (그린 직후 끌어서 위치 조정)" aria-pressed="false">○</button>
    <button id="lb-t-free" title="자유롭게 긋기" aria-pressed="false">✎</button>
    <span class="sep"></span>
    <button id="lb-w1" title="가는 선 ( [ )" aria-label="가는 선" aria-pressed="false"><span class="gauge"><i style="height:2px"></i></span></button>
    <button id="lb-w2" title="보통 굵기" aria-label="보통 굵기" aria-pressed="true"><span class="gauge"><i style="height:4px"></i></span></button>
    <button id="lb-w3" title="굵은 선 ( ] )" aria-label="굵은 선" aria-pressed="false"><span class="gauge"><i style="height:7px"></i></span></button>
    <span class="sep"></span>
    <button id="lb-erase" title="지우개 — 그은 줄을 톡 치면 지워집니다" aria-pressed="false">🧽</button>
    <button id="lb-undo" title="되돌리기 (Ctrl+Z)">↩</button>
    <button id="lb-clear" title="이 장 표시 모두 지우기">🗑</button>
    <span class="sep"></span>
    <span class="lb-saved" id="lb-saved"></span>
    <button id="lb-pen-off" title="형광펜 끄기">✕ 끄기</button>
  </div>
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""><canvas class="lb-mark" id="lb-mark"></canvas></div>
  <button class="lb-nav next" id="lb-next" aria-label="다음 장">›</button>
  <div class="lb-hint" id="lb-hint">좌우로 넘기기 · 휠/더블탭 확대 · 확대 후 방향키·우클릭 드래그로 이동 · 🖍 형광펜(H) · Esc 닫기</div>
</div>

<script>
const CATS={
  "bot":{label:"뚜떵또 답변",color:"var(--accent-bright)"},
  "user":{label:"사용자 질문",color:"var(--c-other)"},
