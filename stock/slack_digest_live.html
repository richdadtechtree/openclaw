<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘 신문 요약</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#eef0f4; --surface:#fff; --ink:#191c24; --muted:#5c6675; --faint:#8a93a3;
    --line:#dfe3ea; --line-strong:#cfd5df; --accent:#2f4272; --accent-bright:#3a5bd0;
    --c-news:#45589e; --c-brief:#0d7f72; --c-alert:#a86413; --c-side:#bd3529; --c-other:#6a7180;
    --live:#12a150;
    --shadow:0 1px 2px rgba(20,26,40,.05),0 8px 24px -14px rgba(20,26,40,.18);
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono","JetBrains Mono","D2Coding",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1118; --surface:#161a23; --ink:#e7eaf1; --muted:#9aa3b4; --faint:#6f7889;
    --line:#242a36; --line-strong:#313848; --accent:#9fb2ef; --accent-bright:#7f9bf5;
    --c-news:#8aa0f0; --c-brief:#33c3af; --c-alert:#e0a552; --c-side:#f0776d; --c-other:#8b93a4;
    --live:#34d178; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7);
  }}
  :root[data-theme="light"]{
    --bg:#eef0f4;--surface:#fff;--ink:#191c24;--muted:#5c6675;--faint:#8a93a3;--line:#dfe3ea;--line-strong:#cfd5df;
    --accent:#2f4272;--accent-bright:#3a5bd0;--c-news:#45589e;--c-brief:#0d7f72;--c-alert:#a86413;--c-side:#bd3529;--c-other:#6a7180;--live:#12a150;
    --shadow:0 1px 2px rgba(20,26,40,.05),0 8px 24px -14px rgba(20,26,40,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0e1118;--surface:#161a23;--ink:#e7eaf1;--muted:#9aa3b4;--faint:#6f7889;--line:#242a36;--line-strong:#313848;
    --accent:#9fb2ef;--accent-bright:#7f9bf5;--c-news:#8aa0f0;--c-brief:#33c3af;--c-alert:#e0a552;--c-side:#f0776d;--c-other:#8b93a4;--live:#34d178;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px 96px}
  header.mast{padding:40px 0 18px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:10px}
  .eyebrow .label{font-family:var(--sans);letter-spacing:.04em;font-size:12.5px}
  .eyebrow .live{display:inline-flex;align-items:center;gap:6px;color:var(--live);letter-spacing:.08em}
  .eyebrow .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--live)}
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line-strong)}
  h1.date{font-size:clamp(27px,6vw,38px);font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;line-height:1.12;text-wrap:balance;font-variant-numeric:tabular-nums}
  .lede{color:var(--muted);font-size:15px;margin:0 0 16px;max-width:52ch}
  .datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .datebar input[type=date]{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn:focus-visible,input:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
  .updated{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}

  .toolbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:14px -20px 0;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,color .15s,background .15s;user-select:none}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--c-other));flex:none}
  .chip .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{color:var(--ink);border-color:var(--dot,var(--accent));background:color-mix(in srgb,var(--dot,var(--accent)) 9%,var(--surface))}
  .chip[aria-pressed="true"] .n{color:var(--dot,var(--accent))}
  .chip:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
  .chip.all .dot{background:linear-gradient(120deg,var(--accent-bright),var(--c-other))}

  .feed{margin-top:26px;position:relative}
  .entry{position:relative;padding:0 0 26px 78px}
  .entry::before{content:"";position:absolute;left:63px;top:6px;bottom:-6px;width:2px;background:var(--line-strong)}
  .entry:last-child::before{display:none}
  .entry .node{position:absolute;left:57px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--dot,var(--c-other));z-index:1}
  .entry .time{position:absolute;left:0;top:1px;width:46px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px 15px;overflow:hidden}
  .card .meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .tag{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dot);padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--dot) 12%,transparent)}
  .kind{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .body{font-size:15.5px;line-height:1.72;word-break:break-word}
  .body strong{font-weight:700}
  .body em{font-style:italic;color:var(--muted)}
  .body code{font-family:var(--mono);font-size:.9em;background:color-mix(in srgb,var(--muted) 14%,transparent);padding:1px 5px;border-radius:4px}
  .body a{color:var(--accent-bright);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent-bright) 40%,transparent)}
  .body .imgnote{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--faint);border:1px dashed var(--line-strong);border-radius:6px;padding:4px 9px}
  /* ── 신문 브리핑 전용 서식 ─────────────────────────────────
     슬랙 원문은 한 덩어리 텍스트라 읽기 힘들어서, 뷰어에서
     헤더 / 카테고리 / 기사 제목 / WHAT·WHY·HOW / 원문확인 으로
     쪼개 각각 다른 크기·굵기로 보여준다. */
  .brf-head{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.35;margin:2px 0 16px;padding-bottom:11px;border-bottom:2px solid var(--line-strong)}
  .brf-cat{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.3;color:var(--accent);margin:30px 0 16px;padding-left:13px;border-left:5px solid var(--accent-bright)}
  .brf-cat:first-child{margin-top:2px}
  .brf-art{margin:0 0 34px}            /* ← 원문 확인 뒤 "두 줄" 여백 (기사 단위 줄바꿈) */
  .brf-art:last-child{margin-bottom:2px}
  .brf-title{font-size:17.5px;font-weight:750;line-height:1.45;letter-spacing:-.012em;margin:0 0 5px;text-wrap:pretty}
  .brf-flag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;vertical-align:2px;margin-right:8px;padding:2px 7px;border-radius:5px;color:var(--c-side);background:color-mix(in srgb,var(--c-side) 12%,transparent);white-space:nowrap}
  .brf-sub{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 11px}
  .brf-kv{display:flex;gap:10px;margin:6px 0;font-size:15px;line-height:1.7}
  .brf-kv .k{flex:none;width:50px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--faint);padding-top:5px}
  .brf-kv .v{flex:1;min-width:0}
  .brf-line{margin:6px 0;font-size:15px;line-height:1.7}
  .brf-src{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-family:var(--mono);font-size:11.5px;color:var(--faint);border:1px dashed var(--line-strong);border-radius:6px;padding:3px 9px}
  .brf-src.fail{color:var(--c-side);border-color:color-mix(in srgb,var(--c-side) 35%,transparent)}
  @media (max-width:520px){
    .brf-cat{font-size:19px;margin:24px 0 13px}
    .brf-title{font-size:16.5px}
    .brf-kv{display:block}
    .brf-kv .k{display:inline-block;width:auto;margin-right:7px;padding-top:0}
  }
  .daybreak{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:4px 0 20px 78px}
  .empty{text-align:center;color:var(--muted);padding:56px 20px}
  .empty .big{font-size:17px;color:var(--ink);font-weight:700;margin-bottom:6px}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media (max-width:520px){.entry{padding-left:66px}.entry .time{width:40px;font-size:12px}.entry .node{left:47px}.entry::before{left:53px}.daybreak{margin-left:66px}}
  @media (prefers-reduced-motion:no-preference){
    .entry.is-new{animation:rise .4s ease both}   /* 새 메시지에만 등장 효과(기존 카드는 가만히) */
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .pulse{animation:blink 2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  }
  /* ── 오늘 신문 원본 패널 ─────────────────────────────────────────────
     드라이브에 올라온 그날 신문 PDF·사진을 바로 받을 수 있는 카드.
     썸네일은 loading="lazy" + 기본 접힘이라, 열기 전엔 데이터를 쓰지 않는다. */
  .news{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
        padding:15px 17px 16px;margin-top:18px}
  .news-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
  .news-kicker{font-size:15.5px;font-weight:800;letter-spacing:-.015em;color:var(--ink)}
  .news-kicker .ico{margin-right:6px}
  /* 요약줄(order:3)은 항상 아랫줄로 내려보내, 좁은 화면에서도 '받아오기' 버튼이
     제목과 같은 줄에 남도록 한다. */
  .news-sub{order:3;flex-basis:100%;font-family:var(--mono);font-size:11.5px;color:var(--faint);
            font-variant-numeric:tabular-nums;margin-top:-3px}
  .news-sub:empty{display:none}
  .news-refresh{order:2;margin-left:auto;padding:4px 10px;font-size:12px;line-height:1.5}
  .news-refresh[disabled]{opacity:.5;cursor:default}
  .news-actions{display:flex;gap:8px;flex-wrap:wrap}
  .news-actions:empty{display:none}
  .news-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13.5px;font-weight:650;
            text-decoration:none;border-radius:10px;padding:9px 14px;border:1px solid var(--line-strong);
            color:var(--ink);background:var(--surface);transition:border-color .15s,background .15s}
  .news-btn:hover{border-color:var(--accent-bright)}
  .news-btn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
  .news-btn.primary{background:color-mix(in srgb,var(--accent-bright) 12%,var(--surface));border-color:var(--accent-bright);color:var(--accent)}
  .news-btn.primary .sz{color:var(--accent)}
  .news-toggle{margin-top:11px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);
               background:none;border:0;padding:4px 0;cursor:pointer}
  .news-toggle:hover{color:var(--ink)}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:11px}
  .news-cell{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);
             aspect-ratio:3/4;display:block}
  .news-cell img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg)}
  .news-cell .no{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;
                 background:rgba(15,20,32,.62);padding:2px 6px;border-bottom-right-radius:6px}
  .news-cell .dl{position:absolute;right:4px;bottom:4px;font-size:11px;line-height:1;color:#fff;text-decoration:none;
                 background:rgba(15,20,32,.62);border-radius:6px;padding:4px 6px}
  .news-cell .dl:hover{background:var(--accent-bright)}
  .news-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}
  .news-note a{color:var(--accent-bright);text-decoration:none}
  .news.waiting{border-style:dashed;box-shadow:none}
  @media (max-width:520px){
    .news{padding:13px 14px 14px;border-radius:12px}
    .news-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
    .news-btn{font-size:13px;padding:8px 12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow"><span class="label">오늘 신문 요약</span><span class="live"><span class="pulse"></span>LIVE</span></div>
    <h1 class="date" id="date">불러오는 중…</h1>
    <p class="lede">쉽게 보는 오늘 뉴스</p>
    <div class="datebar">
      <input type="date" id="datepick" aria-label="날짜 선택">
      <button class="btn" id="today">오늘</button>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <!-- 오늘 신문 원본: 구글 드라이브에 올라온 그날 PDF·사진을 바로 내려받는 칸 -->
  <section class="news" id="news" hidden>
    <div class="news-head">
      <span class="news-kicker"><span class="ico">📰</span><span id="news-title">오늘 신문 원본</span></span>
      <span class="news-sub" id="news-sub"></span>
      <button class="btn news-refresh" id="news-refresh" title="구글 드라이브에서 다시 받아오기">↻ 받아오기</button>
    </div>
    <div class="news-actions" id="news-actions"></div>
    <button class="news-toggle" id="news-toggle" aria-expanded="false" hidden></button>
    <div class="news-grid" id="news-grid" hidden></div>
    <div class="news-note" id="news-note"></div>
  </section>

  <div class="toolbar" id="toolbar"></div>
  <main class="feed" id="feed"></main>
  <footer>
    <span id="foot-count">—</span>
    <span>#gpt 채널 기준 · 20초마다 자동 갱신 · KST</span>
  </footer>
</div>

<script>
const CATS={
  "bot":{label:"뚜떵또 답변",color:"var(--accent-bright)"},
  "user":{label:"사용자 질문",color:"var(--c-other)"},
  "unknown":{label:"기타",color:"var(--c-other)"},
};
const cat=s=>CATS[s]||CATS.unknown;
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
// 슬랙 전용 :emoji_code: 표기를 실제 이모지로 변환. 매핑에 없는 코드는 조용히 제거(영어 텍스트로 안 남게).
const EMOJI_MAP={
  red_circle:"🔴",large_orange_circle:"🟠",large_yellow_circle:"🟡",large_green_circle:"🟢",
  large_blue_circle:"🔵",large_purple_circle:"🟣",large_brown_circle:"🟤",white_circle:"⚪",black_circle:"⚫",
  mag:"🔍",mag_right:"🔍",pushpin:"📌",round_pushpin:"📍",
  white_check_mark:"✅",heavy_check_mark:"✔️",x:"❌",warning:"⚠️",exclamation:"❗",question:"❓",
  newspaper:"📰",bulb:"💡",fire:"🔥",star:"⭐",sparkles:"✨",rocket:"🚀",
  chart_with_upwards_trend:"📈",chart_with_downwards_trend:"📉",moneybag:"💰",dollar:"💵",bank:"🏦",
  calendar:"📅",date:"📅",clock1:"🕐",alarm_clock:"⏰",
  point_right:"👉",point_left:"👈",point_up:"👆",point_down:"👇",
  thumbsup:"👍","+1":"👍",thumbsdown:"👎","-1":"👎",clap:"👏",
  loudspeaker:"📢",mega:"📣",bell:"🔔",no_bell:"🔕",
  email:"📧",envelope:"✉️",memo:"📝",pencil2:"✏️",
  rotating_light:"🚨",zap:"⚡",boom:"💥",eyes:"👀",tada:"🎉",
};
function emojify(s){
  return s.replace(/:([a-zA-Z][a-zA-Z0-9_+-]{1,30}|[+-]1):/g,(m,name)=>{
    const e=EMOJI_MAP[name.toLowerCase()];
    return e!==undefined?e:"";
  });
}
// 슬랙 mrkdwn(볼드/이탤릭/링크/코드) → HTML. 줄바꿈은 건드리지 않는 '한 줄용' 변환기.
function inline(raw){
  let o=esc(raw);
  o=emojify(o);
  o=o.replace(/&lt;(https?:\/\/[^|&]+)\|([^&>]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$2</a>');
  o=o.replace(/&lt;(https?:\/\/[^&>]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  o=o.replace(/`([^`]+)`/g,"<code>$1</code>");
  o=o.replace(/(^|[\s(])\*(?!\s)([^*\n]+?)\*(?=[\s).,!?]|$)/g,"$1<strong>$2</strong>");
  o=o.replace(/(^|[\s(])_(?!\s)([^_\n]+?)_(?=[\s).,!?]|$)/g,"$1<em>$2</em>");
  o=o.replace(/\[대시보드 이미지\]/g,'<span class="imgnote">🖼 대시보드 이미지 (원본은 슬랙)</span>');
  return o;
}
// 일반 메시지용(줄바꿈 → <br>)
function mrkdwn(raw){ return inline(raw).replace(/\n/g,"<br>"); }

/* ══ 신문 브리핑 전용 서식기 ══════════════════════════════════
   슬랙으로 온 브리핑은 "카테고리 + 제목 + • WHAT/WHY/HOW + • 원문 확인"
   이 한 덩어리로 붙어 있어 눈에 안 들어온다. 아래에서 구조를 뜯어
   (1) 헤더 군더더기 제거 (2) 카테고리 크게 (3) 제목 강조 (4) 기사 사이 여백
   을 적용한다. 형식이 안 맞는 메시지는 건드리지 않고 기존 렌더로 넘어간다. */

// 카테고리로 인정할 낱말(긴 것 먼저 — 정규식 선택지는 앞에서부터 매칭됨)
const CAT_TOKEN="(?:IT·과학|부동산|주거|주택|건설|금융|증권|경제|기업|산업|정책|시장|사회|국제|정치|외교|안보|과학|문화|스포츠|연예|오피니언|건강|생활|테크|글로벌|유통|물류|에너지|자동차|반도체|바이오|노동|교육|환경|IT)";
// 줄 맨 앞의 "부동산·주거" / "[금융]" / "경제 > 정책" 같은 카테고리 머리말
const CAT_RE=new RegExp("^\\[?\\s*("+CAT_TOKEN+"(?:\\s*[·>,/]\\s*"+CAT_TOKEN+")*)\\s*\\]?(?:\\s|$)");
// 카테고리 뒤에 이런 게 와야 진짜 카테고리로 인정(=평범한 기사 제목 오인 방지)
const CAT_GUARD=/^(?:[🔴🟠🟡🟢🔵🟣🟤⚪⚫]|반드시|체크|주목|참고|[|｜])/u;
// "🔴 반드시 체크 | 제목" 형태의 머리표
const FLAG_RE=/^\s*([🔴🟠🟡🟢🔵🟣🟤⚪⚫]?)\s*([^|｜\n]{0,14}?)\s*[|｜]\s*(.+)$/u;

// 브리핑 형식인지 판별(짧은 사용자 질문 "신문 브리핑 해줘" 등은 제외)
function isBriefing(t){
  if(/•\s*(?:WHAT|What|WHY|Why|HOW|How)\s*[:：]/.test(t)) return true;
  return /신문\s*브리핑/.test(t) && /•/.test(t) && t.length>200;
}

// 기사 제목 한 줄 → 머리표(🔴 반드시 체크) + 큰 제목 + 작은 부제(중요한 이유)
function briefTitle(t){
  let flag="";
  const m=t.match(FLAG_RE);
  if(m && (m[1] || /체크|주목|참고|중요|속보/.test(m[2]))){
    flag='<span class="brf-flag">'+inline((m[1]+" "+m[2]).trim())+"</span>";
    t=m[3];
  }
  const s=t.split(/\s*중요한\s*이유\s*[:：]\s*/);
  const title=(s[0]||"").trim();
  const sub=s.slice(1).join(" ").trim();
  return '<div class="brf-title">'+flag+inline(title)+"</div>"+
         (sub?'<div class="brf-sub">'+inline(sub)+"</div>":"");
}

// 본문 전체 → {html, part}. part 는 "1/5" 같은 분할 표시(제목에서 떼어내 작은 배지로 보냄)
function briefing(raw){
  let part="";
  // 슬랙 :emoji_code: 를 먼저 실제 이모지로 바꾼다 — 아래 카테고리/머리표 판별이
  // 🔴 같은 실제 이모지를 기준으로 하기 때문(코드 상태면 못 알아본다).
  const lines=emojify(raw.replace(/\r/g,"")).split("\n");

  // (1) 첫 줄에서 "…신문 브리핑" 까지만 남기고 (1/5)·검증 문구 등 뒷부분은 잘라낸다
  let head="";
  for(let i=0;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const m=lines[i].match(/^(.*?신문\s*브리핑)(.*)$/);
    if(m){
      head=m[1].replace(/[*_]/g,"").trim();
      // ⚠️ 헤더 뒤를 통째로 버리면 안 된다. 같은 줄에 기사 제목(때로는 "🔴 반드시 체크 |"
      //    이나 "• WHAT:" 까지)이 이어 붙어 오는 경우가 있어, 그러면 제목이 통째로 사라진다.
      //    → 버리는 건 딱 두 가지: 분할 표시 "(n/m)" 와 "검증: …확인함." 문구.
      let rest=(m[2]||"").replace(/^[\s*]+/,"");        // 앞쪽 공백·볼드기호 제거
      const pm=rest.match(/^\(\s*(\d+)\s*\/\s*(\d+)\s*\)/);
      if(pm){ part=pm[1]+"/"+pm[2]; rest=rest.slice(pm[0].length); }
      rest=rest.replace(/^[\s*]+/,"").trim();
      if(/^검증/.test(rest)){
        const k=rest.lastIndexOf("확인함.");           // 검증 문구 뒤에 본문이 이어지면 살린다
        rest = k>=0 ? rest.slice(k+"확인함.".length).trim() : "";
      }
      lines[i]=rest;                     // 남은 건 본문(제목 등)이므로 그대로 흘려보낸다
    }
    break;                               // 첫 번째 내용 줄만 헤더 후보
  }

  // 불릿(•)은 무조건 새 줄에서 시작하도록 정리 — 제목과 붙어 오는 경우가 많다
  const body=lines.join("\n").replace(/\s*•\s*/g,"\n• ");

  const out=[];
  let art=null;                                   // 현재 기사 블록(HTML 조각)
  const open=()=>{ if(art===null) art=""; };
  const flush=()=>{ if(art!==null){ out.push('<div class="brf-art">'+art+"</div>"); art=null; } };

  for(const rawLine of body.split("\n")){
    const line=rawLine.trim();
    if(!line) continue;
    if(/^검증\s*[:：]/.test(line)) continue;       // 남아 있는 검증 문구 줄도 제거

    let m;
    if(m=line.match(/^•\s*(WHAT|WHY|HOW|What|Why|How)\s*[:：]\s*([\s\S]*)$/)){
      open(); art+='<div class="brf-kv"><span class="k">'+m[1].toUpperCase()+'</span><span class="v">'+inline(m[2])+"</span></div>";
      continue;
    }
    if(m=line.match(/^•?\s*(원문\s*확인.*)$/)){
      const fail=/실패|없음|불가/.test(m[1]);
      open(); art+='<div class="brf-src'+(fail?" fail":"")+'">'+inline(m[1])+"</div>";
      flush();                                     // ← 기사 끝. 다음 기사는 여백 두고 새 블록
      continue;
    }
    if(m=line.match(/^•\s*([\s\S]*)$/)){           // 그 밖의 불릿
      open(); art+='<div class="brf-line">• '+inline(m[1])+"</div>";
      continue;
    }

    // 불릿이 아니면 카테고리 머리말 또는 기사 제목
    let rest=line.replace(/\*/g,"").trim();        // 제목은 어차피 크게 쓰므로 볼드 기호는 제거
    const cm=rest.match(CAT_RE);
    if(cm){
      const after=rest.slice(cm[0].length).trim();
      if(!after || CAT_GUARD.test(after)){
        flush();
        out.push('<div class="brf-cat">'+inline(cm[1])+"</div>");   // (2) 카테고리 = 큰 글씨 + 줄바꿈
        rest=after;
        if(!rest) continue;
      }
    }
    flush();
    art=briefTitle(rest);                          // (3) 기사 제목 = 다른 크기로 한눈에
  }
  flush();

  const html=(head?'<div class="brf-head">'+inline(head)+"</div>":"")+out.join("");
  return {html:html||mrkdwn(raw), part:part};
}
const hhmm=iso=>{const m=(iso||"").match(/T(\d{2}):(\d{2})/);return m?`${m[1]}:${m[2]}`:""};
function krDate(d){const[y,mo,da]=d.split("-").map(Number);const w=["일","월","화","수","목","금","토"][new Date(Date.UTC(y,mo-1,da)).getUTCDay()];return `${y}년 ${mo}월 ${da}일 (${w})`}
function todayKST(){const n=new Date(Date.now()+9*3600*1000);return n.toISOString().slice(0,10)}

const state={date:todayKST(),active:new Set(),data:{date:todayKST(),messages:[]}};

async function load(){
  try{
    const r=await fetch(`/slack/data?date=${state.date}`,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    state.data=await r.json();
    document.getElementById("updated").textContent="마지막 갱신 "+new Date().toTimeString().slice(0,8);
  }catch(e){
    document.getElementById("updated").textContent="갱신 실패 — 재시도 중";
  }
  render();
}
/* 화면에 영향을 주는 값들을 문자열 하나로 묶은 '지문'.
   20초마다 새로 받아와도 이 지문이 같으면 = 바뀐 게 없다 → 다시 그리지 않는다.
   (예전엔 무조건 feed 를 비우고 다시 만들어서 화면이 20초마다 깜빡였다.) */
function snapshot(){ return JSON.stringify([state.data,[...state.active].sort()]); }
let lastSnapshot=null;      // 마지막으로 그린 지문
let seenKeys=new Set();     // 이미 화면에 있던 메시지들 → 이번에 처음 보이는 것만 애니메이션

function render(){
  const snap=snapshot();
  if(snap===lastSnapshot) return;   // ← 깜빡임 방지의 핵심
  lastSnapshot=snap;

  const msgs=[...(state.data.messages||[])].sort((a,b)=>(a.ts||"").localeCompare(b.ts||""));
  document.getElementById("date").textContent=krDate(state.data.date||state.date);
  document.getElementById("datepick").value=state.data.date||state.date;
  
  const counts={};msgs.forEach(m=>{const k=CATS[m.source]?m.source:"unknown";counts[k]=(counts[k]||0)+1});
  const tb=document.getElementById("toolbar");tb.innerHTML="";
  tb.appendChild(chip("all","전체",msgs.length,null));
  ["bot","user","unknown"].forEach(k=>{if(counts[k])tb.appendChild(chip(k,cat(k).label,counts[k],cat(k).color))});
  syncChips();
  const feed=document.getElementById("feed");feed.innerHTML="";
  if(msgs.length){const bd=document.createElement("div");bd.className="daybreak";bd.textContent="오래된순";feed.appendChild(bd)}
  const shown=msgs.filter(m=>state.active.size===0||state.active.has(CATS[m.source]?m.source:"unknown"));
  if(!shown.length){
    feed.insertAdjacentHTML("beforeend",'<div class="empty"><div class="big">아직 표시할 메시지가 없어요</div>이 날짜에 #gpt 채널에 올라온 대화가 없습니다.</div>');
  }
  shown.forEach(m=>{
    const c=cat(m.source);const el=document.createElement("article");
    // 이번에 처음 등장하는 메시지에만 'is-new' → 그 카드만 스윽 나타난다
    el.className="entry"+(seenKeys.has(msgKey(m))?"":" is-new");
    el.style.setProperty("--dot",c.color);
    const txt=m.text||"";
    // 신문 브리핑이면 전용 서식, 아니면 기존 그대로
    const brf=isBriefing(txt)?briefing(txt):null;
    const bodyHTML=brf?brf.html:mrkdwn(txt);
    const partTag=(brf&&brf.part)?`<span class="kind">${brf.part}</span>`:``;
    el.innerHTML=`<span class="time">${hhmm(m.ts)}</span><span class="node"></span>`+
      `<div class="card"><div class="meta"><span class="tag">${c.label}</span>`+
      partTag+
      (m.kind==="image"?`<span class="kind">이미지</span>`:``)+`</div>`+
      `<div class="body">${bodyHTML}</div></div>`;
    feed.appendChild(el);
  });
  document.getElementById("foot-count").textContent=`메시지 ${msgs.length} · 표시 ${shown.length}`;
  seenKeys=new Set(msgs.map(msgKey));   // 다음 렌더 때 '새 것'을 가려내기 위한 기준
}
// 메시지 한 건을 구별하는 열쇠. ts 는 슬랙에서 메시지마다 고유하다.
function msgKey(m){ return (m.ts||"")+"|"+(m.kind||""); }
function chip(key,label,n,color){
  const b=document.createElement("button");b.className="chip"+(key==="all"?" all":"");b.dataset.key=key;
  if(color)b.style.setProperty("--dot",color);
  b.innerHTML=`<span class="dot"></span><span>${label}</span><span class="n">${n}</span>`;
  b.onclick=()=>{if(key==="all")state.active.clear();else if(state.active.has(key))state.active.delete(key);else state.active.add(key);render()};
  return b;
}
function syncChips(){document.querySelectorAll(".chip").forEach(ch=>{const k=ch.dataset.key;const on=k==="all"?state.active.size===0:state.active.has(k);ch.setAttribute("aria-pressed",on?"true":"false")})}

/* ── 오늘 신문 원본 패널 ────────────────────────────────────────────────
   /api/news/today 가 그날 PDF·사진 목록을 준다. 파일은 서버가 구글 드라이브에서
   미리 받아둔 것(scripts/news_sync.py)이라, 여기서는 목록만 받아 버튼으로 그린다.
   사진 썸네일은 '펼치기'를 눌러야 불러온다 → 페이지 첫 로딩을 가볍게 유지. */
const newsState={open:false,date:"",busy:false};

function mb(n){ n=Number(n||0); if(!n) return ""; return n<1024*1024 ? (n/1024).toFixed(0)+"KB" : (n/1024/1024).toFixed(1)+"MB"; }

async function loadNews(){
  const box=document.getElementById("news");
  if(!box) return;
  let d=null;
  try{
    const r=await fetch(`/api/news/today?date=${state.date}`,{cache:"no-store"});
    d=await r.json();
  }catch(e){ box.hidden=true; return; }
  renderNews(d);
}

let lastNewsSnapshot=null;   // 신문 패널도 똑같이: 목록이 그대로면 버튼을 다시 만들지 않는다
function renderNews(d){
  const snap=JSON.stringify(d);
  if(snap===lastNewsSnapshot) return;
  lastNewsSnapshot=snap;

  const box=document.getElementById("news");
  const acts=document.getElementById("news-actions");
  const grid=document.getElementById("news-grid");
  const toggle=document.getElementById("news-toggle");
  const note=document.getElementById("news-note");
  const sub=document.getElementById("news-sub");
  const ttl=document.getElementById("news-title");
  if(!d||d.ok===false){ box.hidden=true; return; }
  box.hidden=false;

  // 날짜가 바뀌면 펼침 상태와 그려둔 썸네일을 초기화한다.
  if(newsState.date!==d.date){ newsState.date=d.date; newsState.open=false; grid.innerHTML=""; }

  if(!d.ready){
    // 아직 안 올라왔거나(오늘 새벽) 캐시에 없는 지난 날짜.
    box.classList.add("waiting");
    ttl.textContent=(d.date===todayKST()?"오늘":d.date.slice(5).replace("-","/"))+" 신문 원본";
    sub.textContent="";
    acts.innerHTML="";
    toggle.hidden=true; grid.hidden=true;
    const past=d.date<todayKST();
    let msg=past?"이 날짜의 원본은 서버에 없습니다(최근 며칠치만 보관합니다).":
                 "아직 올라오지 않았습니다. 보통 <b>오전 6시</b>쯤 준비됩니다.";
    if(d.latest&&d.latest!==d.date) msg+=` <a href="#" id="news-latest">가장 최근(${d.latest.slice(5).replace("-","/")}) 보기</a>`;
    note.innerHTML=msg;
    const link=document.getElementById("news-latest");
    if(link) link.onclick=(e)=>{e.preventDefault();state.date=d.latest;document.getElementById("datepick").value=d.latest;load();};
    return;
  }

  box.classList.remove("waiting");
  ttl.textContent=(d.date===todayKST()?"오늘":d.date.slice(5).replace("-","/"))+" 신문 원본";
  const parts=[];
  if(d.pdf&&d.pdf.pages) parts.push(d.pdf.pages+"면");
  if(d.count) parts.push("사진 "+d.count+"장");
  if(d.total_size) parts.push("합계 "+mb(d.total_size));
  if(d.updated) parts.push(d.updated.slice(11,16)+" 받음");
  sub.textContent=parts.join(" · ");

  // 버튼: PDF 받기 / PDF 보기 / 사진+PDF ZIP
  acts.innerHTML="";
  if(d.pdf){
    acts.insertAdjacentHTML("beforeend",
      `<a class="news-btn primary" href="${d.pdf.url}"><span>📄 PDF 받기</span><span class="sz">${mb(d.pdf.size)}</span></a>`+
      `<a class="news-btn" href="${d.pdf.view_url}" target="_blank" rel="noopener"><span>👁 PDF 보기</span></a>`);
  }
  if(d.count){
    acts.insertAdjacentHTML("beforeend",
      `<a class="news-btn" href="${d.zip_url}"><span>🗂 전체 ZIP</span><span class="sz">${mb(d.total_size)}</span></a>`);
  }

  // 사진 썸네일(접힘/펼침)
  toggle.hidden=!d.count;
  toggle.textContent=(newsState.open?"▾ 사진 접기":`▸ 사진 ${d.count}장 펼치기`);
  toggle.setAttribute("aria-expanded",newsState.open?"true":"false");
  grid.hidden=!newsState.open;
  // 펼친 상태에서 사진 장수가 달라졌으면(받아오기 직후 등) 그리드를 다시 그린다.
  if(newsState.open&&grid.children.length!==d.count) fillGrid(d);
  toggle.onclick=()=>{
    newsState.open=!newsState.open;
    if(newsState.open&&grid.children.length!==d.count) fillGrid(d);
    grid.hidden=!newsState.open;
    toggle.textContent=(newsState.open?"▾ 사진 접기":`▸ 사진 ${d.count}장 펼치기`);
    toggle.setAttribute("aria-expanded",newsState.open?"true":"false");
  };

  const src=d.source_url?` · <a href="${d.source_url}" target="_blank" rel="noopener">원문 글</a>`:"";
  note.innerHTML=`사진을 누르면 새 탭에서 크게 볼 수 있고, 오른쪽 아래 ⤓ 를 누르면 그 장만 저장됩니다.${src}`;
}

function fillGrid(d){
  const grid=document.getElementById("news-grid");
  grid.innerHTML=d.images.map((im,i)=>
    `<a class="news-cell" href="${im.url}" target="_blank" rel="noopener" title="${im.name}">`+
    `<img loading="lazy" decoding="async" src="${im.thumb}" alt="${im.name}">`+
    `<span class="no">${String(i+1).padStart(2,"0")}</span>`+
    `<span class="dl" data-href="${im.download_url}" title="이 장만 저장">⤓</span></a>`).join("");
  // ⤓ 는 링크 안의 링크라 <a> 로 못 넣는다 → 클릭을 가로채서 직접 내려받는다.
  grid.querySelectorAll(".dl").forEach(el=>{
    el.addEventListener("click",ev=>{ev.preventDefault();ev.stopPropagation();location.href=el.dataset.href;});
  });
}

// ↻ 받아오기: 서버에게 드라이브에서 다시 가져오라고 시키고, 잠시 뒤 목록을 새로고침.
document.getElementById("news-refresh").addEventListener("click",async(e)=>{
  const b=e.currentTarget;
  if(newsState.busy) return;
  newsState.busy=true; b.disabled=true; b.textContent="↻ 받는 중…";
  try{ await fetch(`/api/news/refresh?date=${state.date}`,{method:"POST"}); }catch(_){}
  for(const wait of [4000,6000,10000]){ await new Promise(r=>setTimeout(r,wait)); await loadNews(); }
  newsState.busy=false; b.disabled=false; b.textContent="↻ 받아오기";
});

document.getElementById("datepick").addEventListener("change",e=>{state.date=e.target.value;load();loadNews()});
document.getElementById("today").addEventListener("click",()=>{state.date=todayKST();load();loadNews()});

load(); loadNews();
setInterval(()=>{ if(state.date===todayKST()){ load(); loadNews(); } },20000); // 오늘 볼 때만 자동 갱신
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
