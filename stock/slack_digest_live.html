};
const cat=s=>CATS[s]||CATS.unknown;
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
// 슬랙 전용 :emoji_code: 표기를 실제 이모지로 변환. 매핑에 없는 코드는 조용히 제거(영어 텍스트로 안 남게).
const EMOJI_MAP={
  red_circle:"🔴",large_orange_circle:"🟠",large_yellow_circle:"🟡",large_green_circle:"🟢",
  large_blue_circle:"🔵",large_purple_circle:"🟣",large_brown_circle:"🟤",white_circle:"⚪",black_circle:"⚫",
  mag:"🔍",mag_right:"🔍",pushpin:"📌",round_pushpin:"📍",
  white_check_mark:"✅",heavy_check_mark:"✔️",x:"❌",warning:"⚠️",exclamation:"❗",question:"❓",
  newspaper:"📰",bulb:"💡",fire:"🔥",star:"⭐",sparkles:"✨",rocket:"🚀",
  chart_with_upwards_trend:"📈",chart_with_downwards_trend:"📉",moneybag:"💰",dollar:"💵",bank:"🏦",
  calendar:"📅",date:"📅",clock1:"🕐",alarm_clock:"⏰",
  point_right:"👉",point_left:"👈",point_up:"👆",point_down:"👇",
  thumbsup:"👍","+1":"👍",thumbsdown:"👎","-1":"👎",clap:"👏",
  loudspeaker:"📢",mega:"📣",bell:"🔔",no_bell:"🔕",
  email:"📧",envelope:"✉️",memo:"📝",pencil2:"✏️",
  rotating_light:"🚨",zap:"⚡",boom:"💥",eyes:"👀",tada:"🎉",
};
function emojify(s){
  return s.replace(/:([a-zA-Z][a-zA-Z0-9_+-]{1,30}|[+-]1):/g,(m,name)=>{
    const e=EMOJI_MAP[name.toLowerCase()];
    return e!==undefined?e:"";
  });
}
// 슬랙 mrkdwn(볼드/이탤릭/링크/코드) → HTML. 줄바꿈은 건드리지 않는 '한 줄용' 변환기.
function inline(raw){
  let o=esc(raw);
  o=emojify(o);
  o=o.replace(/&lt;(https?:\/\/[^|&]+)\|([^&>]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$2</a>');
  o=o.replace(/&lt;(https?:\/\/[^&>]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  o=o.replace(/`([^`]+)`/g,"<code>$1</code>");
  o=o.replace(/(^|[\s(])\*(?!\s)([^*\n]+?)\*(?=[\s).,!?]|$)/g,"$1<strong>$2</strong>");
  o=o.replace(/(^|[\s(])_(?!\s)([^_\n]+?)_(?=[\s).,!?]|$)/g,"$1<em>$2</em>");
  o=o.replace(/\[대시보드 이미지\]/g,'<span class="imgnote">🖼 대시보드 이미지 (원본은 슬랙)</span>');
  return o;
}
// 일반 메시지용(줄바꿈 → <br>)
/* ── 표 (2026-09-24) ─────────────────────────────────────────────────
   슬랙에 표로 보이던 자료를 서버(stock/app.py _merge_tables)가 "| 칸 | 칸 |" 줄로 바꿔 글 속 제자리에 넣어 준다.
   여기서 그 줄 묶음을 진짜 표로 그린다. 첫 줄 = 머리칸, "|---|" 구분줄은 건너뜀,
   숫자 칸(1305(1305)·4.92%·160 등)은 오른쪽 정렬 + 자릿수 맞춤. 폭이 좁으면 표만 옆으로 밀어 볼 수 있게 감싼다. */
const TBL_LINE=/^\|.*\|\s*$/;
function tableHtml(lines){
  const rows=lines.map(l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()))
                  .filter(r=>!r.every(c=>/^:?-{2,}:?$/.test(c)||!c));
  if(!rows.length) return "";
  const num=c=>/^[\d.,()%~+\-→/\s]+$/.test(c)&&/\d/.test(c);
  const td=(c,tag)=>`<${tag}${tag==="td"&&num(c)?' class="n"':""}>${inline(c)}</${tag}>`;
  return '<div class="brf-tblwrap"><table class="brf-tbl"><thead><tr>'+rows[0].map(c=>td(c,"th")).join("")+"</tr></thead><tbody>"+
         rows.slice(1).map(r=>"<tr>"+r.map(c=>td(c,"td")).join("")+"</tr>").join("")+"</tbody></table></div>";
}
// 일반 메시지용(줄바꿈 → <br>) — "| … |" 줄 묶음은 표로
function mrkdwn(raw){
  const L=String(raw||"").split("\n"), out=[];
  for(let i=0;i<L.length;i++){
    if(TBL_LINE.test(L[i].trim())&&TBL_LINE.test((L[i+1]||"").trim())){
      const run=[]; while(i<L.length&&TBL_LINE.test(L[i].trim())) run.push(L[i++]);
      i--; out.push({t:tableHtml(run)}); continue;
    }
    out.push({s:L[i]});
  }
  let html="", buf=[];
  const fl=()=>{ if(buf.length){ html+=inline(buf.join("\n")).replace(/\n/g,"<br>"); buf=[]; } };
  out.forEach(o=>{ if(o.t!==undefined){ fl(); html+=o.t; } else buf.push(o.s); });
  fl(); return html;
}

/* ══ 신문 브리핑 전용 서식기 ══════════════════════════════════
   슬랙으로 온 브리핑은 "카테고리 + 제목 + • WHAT/WHY/HOW + • 원문 확인"
   이 한 덩어리로 붙어 있어 눈에 안 들어온다. 아래에서 구조를 뜯어
   (1) 헤더 군더더기 제거 (2) 카테고리 크게 (3) 제목 강조 (4) 기사 사이 여백
   을 적용한다. 형식이 안 맞는 메시지는 건드리지 않고 기존 렌더로 넘어간다. */

// 카테고리로 인정할 낱말(긴 것 먼저 — 정규식 선택지는 앞에서부터 매칭됨)
const CAT_TOKEN="(?:IT·과학|부동산|주거|주택|건설|금융|증권|경제|기업|산업|정책|시장|사회|국제|정치|외교|안보|과학|문화|스포츠|연예|오피니언|건강|생활|테크|글로벌|유통|물류|에너지|자동차|반도체|바이오|노동|교육|환경|IT)";
// 줄 맨 앞의 "부동산·주거" / "[금융]" / "경제 > 정책" 같은 카테고리 머리말
const CAT_RE=new RegExp("^\\[?\\s*("+CAT_TOKEN+"(?:\\s*[·>,/]\\s*"+CAT_TOKEN+")*)\\s*\\]?(?:\\s|$)");
// 카테고리 뒤에 이런 게 와야 진짜 카테고리로 인정(=평범한 기사 제목 오인 방지)
const CAT_GUARD=/^(?:[🔴🟠🟡🟢🔵🟣🟤⚪⚫]|반드시|체크|주목|참고|[|｜])/u;
// "🔴 반드시 체크 | 제목" 형태의 머리표
const FLAG_RE=/^\s*([🔴🟠🟡🟢🔵🟣🟤⚪⚫]?)\s*([^|｜\n]{0,14}?)\s*[|｜]\s*(.+)$/u;

/* 기사가 '몇 번째 신문 사진'에 실렸는지 알려주는 표기 (2026-09-23)
   요약문에 이런 줄이 있으면 '글+지면' 보기에서 그 사진을 자동으로 옆에 붙인다.
     • 사진: 07      • 지면: 7      • 사진 07번      📰 사진 7/30      • 사진: 07.jpg      • *사진*: 07, 08
     제목 끝에 붙은 경우:  목동 9·13단지 최고 49층 재건축 (사진 07)
   ⚠️ 줄 '전체'가 이 모양일 때만 인정한다. "• 사진 3장 공개" 같은 진짜 본문을 번호로 오인하지 않게. */
const PAGE_NUM="(\\d{1,2})\\s*(?:\\.(?:jpe?g|gif|png|webp))?\\s*(?:번|장|쪽|면)?";      // 07 · 07.jpg · 7번
const PAGE_LINE_RE=new RegExp("^•?\\s*(?:📄|📰|🗞️?|📷)?\\s*\\**\\s*(?:사진|지면|스크랩)\\s*(?:번호)?\\s*\\**\\s*[:：]?\\s*"+PAGE_NUM+
  "\\s*(?:[,·~\\-/]\\s*\\d{1,3}.*)?$","u");        // "07, 08"·"7/30" 처럼 뒤에 더 붙으면 첫 번호만 쓴다
const PAGE_TAIL_RE=new RegExp("\\s*[(\\[]\\s*(?:사진|지면)\\s*[:：]?\\s*"+PAGE_NUM+"\\s*(?:[,·~\\-]\\s*\\d{1,2}[^)\\]]*)?[)\\]]\\s*$");

/* ── WHAT/WHY/HOW 표기 흔들림 맞추기 (2026-09-24) ──────────────────────
   GPT 요약이 형식을 바꿔 보내는 날이 있다:
     예전  "• WHAT: …"
     새로  "43. 연휴에 고양이 밥줄 시터 모집 WHAT 추석을 앞두고 …"   ← 제목 줄에 WHAT 이 붙어 옴
           "WHY 연휴에 집을 비우는 …"                                ← 불릿·콜론 없음
   예전 서식기는 "• WHAT:" 만 알아봐서 WHY·HOW 줄을 각각 '새 기사 제목'으로 착각 → 한 기사가 세 개로 쪼개졌다.
   → 그리기 전에 모두 "• WHAT: …" 한 모양으로 바꿔 준다.
   ⚠️ 콜론 없는 형태는 **대문자 WHAT/WHY/HOW** 일 때만 인정(영어 문장 속 how 등을 오인하지 않게).
      이미 "• WHAT:" 인 것은 앞의 • 를 보고 건너뛴다(lookbehind) — 빈 불릿이 생기지 않게. */
function normalizeKV(t){
  return String(t||"")
    .replace(/(?<!•)[ \t]+(WHAT|WHY|HOW)[ \t]*[:：]?[ \t]+(?=\S)/g, "\n• $1: ")   // 줄 중간(제목 뒤)에 붙은 것 → 새 줄
    .replace(/^[ \t]*(WHAT|WHY|HOW)[ \t]*[:：]?[ \t]+(?=\S)/gm, "• $1: ")          // 줄 맨 앞, 불릿 없음
    .replace(/^[ \t]*(What|Why|How)[ \t]*[:：][ \t]*/gm, "• $1: ");                // "What:" 처럼 콜론 있는 것
}

// 브리핑 형식인지 판별(짧은 사용자 질문 "신문 브리핑 해줘" 등은 제외)
/* 핵심 요약 블록 판별 (2026-09-24)
   · 핵심 한 줄 : "📌 오늘 신문 핵심 한 줄 <문장>" (문장이 다음 줄에 와도 됨)
   · 섹션 머리말: 그림문자(✅📌💡🎯…)로 시작 + 40자 이하 + 요약 성격 낱말(핵심·체크·요약·포인트·판세…)
     → 평범한 대화("✅ 확인했어요")는 낱말 조건에 걸리지 않아 그대로 둔다 */
const EMOJI_LEAD=/^\p{Extended_Pictographic}️?\s*/u;
const KEYLINE_RE=/^((?:\p{Extended_Pictographic}️?\s*)?[^.。\n]{0,24}?핵심\s*한\s*줄)\s*[:：]?\s*([\s\S]*)$/u;
// ⚠️ '요약'·'정리' 는 뺐다 — "📰 2026년 9월 24일 신문 재요약" 같은 머리 줄이 체크 목록 머리말로 잡혀 아래 기사까지 삼켰다(2026-09-24)
const SEC_WORDS=/(핵심|체크|포인트|판세|테마|결론|키워드|주목|관전|일정)/;
function isSecHead(l){
  const p=String(l||"").replace(/[*_]/g,"").trim();
  // "🔴 반드시 체크 | 기사 제목" 은 기사 머리표라 제외(| 가 있으면 섹션 머리말이 아니다)
  return EMOJI_LEAD.test(p) && p.length<=40 && SEC_WORDS.test(p) && !/[.。]$/.test(p) && !/[→|｜]/.test(p);
}

function isBriefing(t){
  if(/•\s*(?:WHAT|What|WHY|Why|HOW|How)\s*[:：]/.test(t)) return true;
  // 불릿·콜론 없이 "WHAT …" / "제목 WHAT …" 으로 오는 새 형식(2026-09-24)도 브리핑
  if(/(?:^|\s)WHAT\s*[:：]?\s+\S/.test(t) && /(?:^|\s)(?:WHY|HOW)\s*[:：]?\s+\S/.test(t)) return true;
  // "…5가지 1. …" 묶음만 따로 온 메시지도 같은 서식(머리말 줄바꿈 + 번호 목록)으로
  // ⚠️ 슬랙 원문은 ✅ 가 아니라 ":white_check_mark:" 글자로 온다 → 그림문자로 바꾼 뒤에 판별(2026-09-24 실제 누락)
  const L=emojify(String(t)).split("\n").map(l=>l.replace(/\*/g,"").trim()).filter(Boolean);
  if(L.some((l,i)=>{ const h=splitListHead(l); return h && (h[1] || /^1[.)]\s/.test(L[i+1]||"")); })) return true;
  // "📌 …핵심 한 줄" 이나 "✅ …체크할 핵심 주제" 아래 항목이 있는 메시지도 같은 서식으로
  if(L.some((l,i)=>KEYLINE_RE.test(l) || (isSecHead(l) && L[i+1]))) return true;
  return /신문\s*브리핑/.test(t) && /•/.test(t) && t.length>200;
}

/* ── 검증·면책 안내문 숨기기 ────────────────────────────────────────
   AI 가 브리핑 끝에 습관처럼 붙이는 "확인했다 / 확정 사실이 아니다" 안내문은
   읽는 사람에게 새 정보가 없어서 뷰어에서만 감춘다(발송 쪽은 그대로 둔다).
     예) 검증: metadata.json 날짜 대조함.
         ※ 지면 30쪽과 metadata 날짜를 대조함. 수치·단위는 지면에서 다시
            확인함. 기사 속 전망은 확정 사실이 아님.
   ⚠️ 넓게 지우면 진짜 기사까지 사라진다. 그래서 조건을 두 겹으로 건다 —
      ① 줄이 "검증:" 으로 시작하거나 "※ / ＊ / ⚠" 로 시작하고
      ② 안내문에서만 쓰는 낱말(대조·확인함·확정 사실이 아님 …)이 들어 있을 것. */
const NOTE_WORD=/(대조(?:함|했|한)|재?확인함|확정\s*사실이?\s*아님|사실이\s*아님|metadata|지면\s*\d+\s*쪽|검증)/;
const NOTE_MARK=/^(?:검증\s*[:：]|[※＊]|⚠️?)/u;           // 안내문 머리 기호
const NOTE_LEAD=/^[\s*_~>·\-]+/;                          // 앞에 붙은 공백·볼드기호(*·_)

// 이 한 줄이 통째로 안내문인가?
function isNote(s){
  const t=String(s||"").replace(NOTE_LEAD,"").trim();
  if(!t) return false;
  if(/^검증\s*[:：]/.test(t)) return true;                  // "검증: …" 은 무조건 안내문
  return NOTE_MARK.test(t) && NOTE_WORD.test(t);            // "※ …대조함/확인함…"
}

// 줄 '끝'에 안내문이 붙어 온 경우(제목 … ※ 지면 30쪽과 …)에만 그 부분을 잘라낸다.
// 뒤에 진짜 본문이 더 이어지는 줄은 건드리지 않으려고, 문장이 안내문투로 '끝날 때'만 자른다.
const NOTE_TAIL=/(?:아님|확인함|대조함|확인했음|확인함니다)\s*[.。!]?\s*$/;
function stripNote(s){
  const t=String(s||"");
  const i=t.search(/[※＊]|⚠/u);
  if(i<=0) return t;                                        // ※ 가 없거나 줄 맨 앞(=isNote 담당)
  const tail=t.slice(i);
  return (NOTE_WORD.test(tail) && NOTE_TAIL.test(tail)) ? t.slice(0,i).trim() : t;
}

/* 메시지 원문에서 안내문 줄을 걷어낸다.
   안내문이 두세 줄로 접혀 올 수도 있어서, 한 번 안내문이 시작되면
   '안내문 낱말이 계속 나오는 동안' 이어지는 줄까지 함께 지운다.
   단 불릿(•)이나 다른 내용이 나오면 즉시 멈춘다(본문 보호). */
function dropNotes(raw){
  const out=[]; let inNote=false;
  for(const rawLine of String(raw||"").replace(/\r/g,"").split("\n")){
    const line=rawLine.trim();
    if(isNote(line)){ inNote=true; continue; }                       // 안내문 시작
    if(inNote){
      if(!line){ continue; }                                         // 안내문 사이 빈 줄
      if(!/^[•\-*]/.test(line) && NOTE_WORD.test(line) && line.length<160){ continue; }  // 접혀 온 뒷줄
      inNote=false;                                                  // 본문 재개
    }
    out.push(stripNote(rawLine));                                    // 줄 끝에 붙은 안내문만 제거
  }
  return out.join("\n").trim();
}

/* ── 슬랙 '앱 발신 꼬리표' 지우기 (2026-09-23) ─────────────────────────
   ChatGPT 같은 슬랙 연결 앱이 사용자 대신 글을 올리면 슬랙이 끝에
   "다음을 사용하여 보냄 <@U0BUG6LJXL0>" (영어: "Sent using <@U…>") 를 붙인다.
   AI 가 쓴 게 아니라 슬랙이 붙이는 것이라 프롬프트로는 못 막는다 → 화면에서 지운다.
   (서버 stock/app.py 의 _clean_slack_text 도 같은 일을 한다 — 여기는 옛 로그·서버 미반영 대비 2중 안전장치)
   줄 '끝'에 이 문구(+멘션)가 올 때만 지운다 → 본문 속 "공법을 사용하여" 같은 말은 안전. */
const SENT_USING_RE=/[ \t]*[_*~]*(?:다음을\s*사용하여\s*보냄|다음을\s*통해\s*보냄|Sent\s+using)[_*~]*[ \t]*[:：]?[ \t]*(?:<@[A-Z0-9]+(?:\|[^>]*)?>|@[\w.\-]+)?[_*~]*[ \t]*$/gimu;
function cleanSent(t){ return String(t||"").replace(SENT_USING_RE,"").replace(/\n{3,}/g,"\n\n").trim(); }

/* ── 요약 GPT 가 붙여 주는 '기사↔지면' JSON 묶음 (2026-09-24) ─────────────
   요약을 만드는 ChatGPT 에게, 사람이 읽는 요약 **끝에** 아래 같은 JSON 을 붙여 달라고 한다.
     ```json
     {"date":"2026-09-24","articles":[
       {"article_id":"20260924-001","title":"3억대 서울 분양도 나와","page":3,"bbox":[0.05,0.12,0.9,0.35]}
     ]}
     ```
   · page = 신문 PDF 쪽 번호 = 사진 번호(PDF 는 사진을 순서대로 묶은 것) → 03 사진에 연결
   · bbox = 그 쪽 안에서 기사가 차지하는 네모 [왼쪽, 위, 너비, 높이] (0~1 비율, 없어도 됨)
            → 있으면 기사 옆에 **그 부분만 잘라** 보여주고, 누르면 그 기사로 확대된 채 열린다
   이 묶음은 화면에 그리지 않는다(사람이 읽을 글이 아니다). 슬랙이 ``` 를 떼어 버린 경우도 대비해
   '{ … "articles" … }' 모양이면 괄호 짝을 맞춰 찾아낸다. 깨진 JSON 은 조용히 무시하고 그 부분만 숨긴다. */
function extractSummaryJson(text){
  let t=String(text||""); const arts=[];
  const take=(src)=>{ try{ const o=JSON.parse(src); (o&&o.articles||[]).forEach(a=>{ if(a&&a.title) arts.push(a); }); }catch(e){} };
  // ① ```json … ``` 로 감싼 것
  t=t.replace(/```[a-zA-Z-]*\s*([\s\S]*?)```/g,(m,body)=>{
    if(!/"articles"\s*:/.test(body)) return m;       // 다른 코드 블록은 그대로
    take(body.trim()); return "";
  });
  // ② 감싸지 않은 { … "articles": [ … ] … } — 괄호 짝을 맞춰 끝을 찾는다(문자열 안의 괄호는 무시)
  let k;
  while((k=t.search(/\{\s*"(?:date|articles)"\s*:/))>=0){
    let depth=0, inStr=false, esc=false, end=-1;
    for(let i=k;i<t.length;i++){
      const c=t[i];
      if(inStr){ if(esc) esc=false; else if(c==="\\") esc=true; else if(c==='"') inStr=false; continue; }
      if(c==='"') inStr=true; else if(c==="{") depth++; else if(c==="}"){ if(--depth===0){ end=i; break; } }
    }
    const chunk=t.slice(k, end<0?t.length:end+1);
    if(!/"articles"\s*:/.test(chunk)) break;
    take(chunk); t=t.slice(0,k)+t.slice(end<0?t.length:end+1);
  }
  return {text:t.replace(/\n{3,}/g,"\n\n").trim(), articles:arts};
}
// 날짜별로 모아 둔 JSON 기사 정보 — render() 가 매번 다시 채운다
let SUMMARY_META=[];
const bigrams=s=>{ const t=String(s||"").replace(/[^0-9A-Za-z가-힣]/g,""); const o=new Set(); for(let i=0;i<t.length-1;i++) o.add(t.slice(i,i+2)); return o; };
/* 요약 기사 제목 → JSON 의 같은 기사. GPT 가 제목을 살짝 바꿔 쓰기도 해서
   ①글자만 남겨 완전히 같으면 바로, ②한쪽이 다른 쪽을 품으면, ③두 글자 조각이 60% 이상 겹치면 같은 기사로 본다 */
function findMeta(title){
  const k=artKey(title); if(!k||!SUMMARY_META.length) return null;
  let best=null, bs=0;
  for(const a of SUMMARY_META){
    const ak=artKey(a.title); if(!ak) continue;
    if(ak===k) return a;
    if(ak.length>=6 && (k.includes(ak)||ak.includes(k))){ if(0.95>bs){ bs=0.95; best=a; } continue; }
    const A=bigrams(k), B=bigrams(ak); let n=0; A.forEach(x=>{ if(B.has(x)) n++; });
    const d=2*n/((A.size+B.size)||1);
    if(d>bs){ bs=d; best=a; }
  }
  return bs>=0.6?best:null;
}
function validBox(b){
  if(!Array.isArray(b)||b.length!==4) return null;
  const v=b.map(Number); if(v.some(x=>!isFinite(x))) return null;
  let [x,y,w,h]=v;
  if(x>1||y>1||w>1||h>1) return null;                 // 비율(0~1)만 받는다 — 픽셀이면 무시
  x=Math.max(0,x); y=Math.max(0,y); w=Math.min(1-x,w); h=Math.min(1-y,h);
  return (w>0.03&&h>0.03)?[x,y,w,h]:null;
}

// 메시지 전체가 안내문뿐이면 카드 자체를 만들지 않는다(빈 카드 방지).
function isNoteOnly(raw){
  const t=String(raw||"").trim();
  if(!t) return false;
  return !!t && !dropNotes(t) && /(?:검증\s*[:：]|[※＊]|⚠)/u.test(t);
}

/* ── 묶음 머리말 + 번호 목록 (2026-09-23) ─────────────────────────────────
   GPT 요약 끝에 자주 오는
     🔍 오늘 신문에서 반드시 연결해서 봐야 할 5가지 1. 서울 매매 … 2. …
   가 한 줄로 붙어 와 '기사 제목' 처럼 크게 뭉쳐 보이던 문제. 머리말 뒤에서 **항상 줄을 바꾸고**,
   1. 2. 3. … 은 한 항목씩 따로 그린다.
   ⚠️ 본문 속 숫자("3.5%", "1. 5배")를 목록으로 오인하지 않게:
      · 머리말은 'N가지 / 포인트 / 체크포인트 / 키워드 / 정리' 로 끝나야 하고, 바로 뒤에 "1." 이 와야 한다
      · 목록을 자를 때는 **1 → 2 → 3 순서대로 이어지는 번호**에서만 자른다 */
const LIST_HEAD_END=/(?:\d+\s*가지|포인트|체크\s*포인트|키워드|이슈|정리|요약)\s*[:：]?$/;
const NUM_ITEM_RE=/^(\d{1,2})[.)]\s+([\s\S]+)$/;
function splitListHead(line){
  const m=line.match(/^(.+?)\s*[:：]?\s+(1[.)]\s+\S[\s\S]*)$/);
  if(m && LIST_HEAD_END.test(m[1].replace(/[*_]/g,"").trim())) return [m[1], m[2]];
  if(LIST_HEAD_END.test(line.replace(/[*_]/g,"").trim()) && line.length<=80) return [line, ""];   // 머리말만 한 줄
  return null;
}
// "1. 가 2. 나 3. 다" → ["1. 가","2. 나","3. 다"] (번호가 순서대로 이어질 때만 자른다)
function splitNumbered(s){
  const first=s.match(/^(\d{1,2})[.)]\s/); if(!first) return [s];
  let k=+first[1]+1, start=0; const out=[]; const re=/\s+(\d{1,2})[.)]\s+/g; let m;
  while((m=re.exec(s))){
    if(+m[1]!==k) continue;
    out.push(s.slice(start,m.index).trim());
    start=m.index+(m[0].length-m[0].trimStart().length);
    k++;
  }
  out.push(s.slice(start).trim());
  return out.filter(Boolean);
}
function numItem(t){
  const m=t.match(NUM_ITEM_RE);
  return m ? '<div class="brf-num"><span class="n">'+m[1]+'</span><span class="v">'+inline(m[2])+"</span></div>"
           : '<div class="brf-line">'+inline(t)+"</div>";
}

// 기사 제목 한 줄 → 머리표(🔴 반드시 체크) + 큰 제목 + 작은 부제(중요한 이유)
function briefTitle(t){
  let flag="";
  const m=t.match(FLAG_RE);
  if(m && (m[1] || /체크|주목|참고|중요|속보/.test(m[2]))){
    flag='<span class="brf-flag">'+inline((m[1]+" "+m[2]).trim())+"</span>";
    t=m[3];
  }
  const s=t.split(/\s*중요한\s*이유\s*[:：]\s*/);
  const title=(s[0]||"").trim();
  const sub=s.slice(1).join(" ").trim();
  return '<div class="brf-title">'+flag+inline(title)+"</div>"+
         (sub?'<div class="brf-sub">'+inline(sub)+"</div>":"");
}

// 본문 전체 → {html, part}. part 는 "1/5" 같은 분할 표시(제목에서 떼어내 작은 배지로 보냄)
function briefing(raw){
  let part="";
  // 슬랙 :emoji_code: 를 먼저 실제 이모지로 바꾼다 — 아래 카테고리/머리표 판별이
  // 🔴 같은 실제 이모지를 기준으로 하기 때문(코드 상태면 못 알아본다).
  const lines=emojify(raw.replace(/\r/g,"")).split("\n");

  // (1) 첫 줄에서 "…신문 브리핑" 까지만 남기고 (1/5)·검증 문구 등 뒷부분은 잘라낸다
  let head="";
  for(let i=0;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const m=lines[i].match(/^(.*?신문\s*브리핑)(.*)$/);
    if(m){
      head=m[1].replace(/[*_]/g,"").trim();
      // ⚠️ 헤더 뒤를 통째로 버리면 안 된다. 같은 줄에 기사 제목(때로는 "🔴 반드시 체크 |"
      //    이나 "• WHAT:" 까지)이 이어 붙어 오는 경우가 있어, 그러면 제목이 통째로 사라진다.
      //    → 버리는 건 딱 두 가지: 분할 표시 "(n/m)" 와 "검증: …확인함." 문구.
      let rest=(m[2]||"").replace(/^[\s*]+/,"");        // 앞쪽 공백·볼드기호 제거
      const pm=rest.match(/^\(\s*(\d+)\s*\/\s*(\d+)\s*\)/);
      if(pm){ part=pm[1]+"/"+pm[2]; rest=rest.slice(pm[0].length); }
      rest=stripNote(rest.replace(/^[\s*]+/,"").trim());   // 줄 끝 "※ …확인함." 제거
      if(isNote(rest)) rest="";                             // 헤더 뒤가 통째로 안내문이면 버린다
      if(/^검증/.test(rest)){
        const k=rest.lastIndexOf("확인함.");           // 검증 문구 뒤에 본문이 이어지면 살린다
        rest = k>=0 ? rest.slice(k+"확인함.".length).trim() : "";
      }
      lines[i]=rest;                     // 남은 건 본문(제목 등)이므로 그대로 흘려보낸다
    }
    break;                               // 첫 번째 내용 줄만 헤더 후보
  }

  // 불릿(•)은 무조건 새 줄에서 시작하도록 정리 — 제목과 붙어 오는 경우가 많다
  const body=normalizeKV(lines.join("\n").replace(/\s*•\s*/g,"\n• "));

  const out=[];
  let inList=false;                               // "…5가지" 머리말 아래 번호 목록을 그리는 중인가
  let lastItem=-1;                                // 방금 그린 번호 항목의 out 위치(설명 줄을 붙일 곳)
  let chk=null;                                   // "✅ …핵심 주제" 아래 체크 항목들(그리는 중이면 배열)
  let keyWait=null;                               // "📌 핵심 한 줄" 머리표만 오고 문장은 다음 줄에 올 때
  const flushChk=()=>{ if(chk&&chk.length) out.push('<div class="brf-chks">'+chk.join("")+"</div>"); chk=null; };
  const chkItem=(t)=>'<div class="brf-chk"><span class="ic">✓</span><span class="v">'+inline(t)+"</span></div>";
  const keyBox=(lbl,txt)=>'<div class="brf-key"><span class="lbl">'+inline(lbl)+'</span><span class="txt">'+inline(txt)+"</span></div>";
  // 목록·체크 묶음이 끝나는 곳: 카테고리 머리말, 또는 다음 줄이 "• WHAT:" 인 새 기사 제목
  const endsBlock=(plain,li)=>{ const c=plain.match(CAT_RE);
    return (c && (!plain.slice(c[0].length).trim() || CAT_GUARD.test(plain.slice(c[0].length).trim()))) || KV_RE.test(nextLine(li)); };
  const pushItems=(txt)=>splitNumbered(txt).forEach(t=>{ out.push(numItem(t)); lastItem=out.length-1; });
  // 번호 항목 아래 딸린 설명 줄 → 그 항목 안에 흐린 글씨로 붙인다(2026-09-23: 1번만 특별해 보이던 문제)
  const addNote=(txt)=>{ out[lastItem]=out[lastItem].replace(/<\/span><\/div>$/,
                           '<span class="note">'+inline(txt)+'</span></span></div>'); };
  let art=null;                                   // 현재 기사 블록(HTML 조각)
  let pageHint=0;                                 // 이 기사가 실린 사진 번호(본문에 적혀 있을 때만)
  const open=()=>{ if(art===null) art=""; };
  // 기사 본문은 .brf-main 으로 한 번 감싼다 — '글+지면' 보기에서 그 옆에 사진 칸(.brf-side)을
  // 나란히 붙이기 위한 자리. '글만' 보기에선 평범한 div 라 화면이 달라지지 않는다.
  let artKV=new Set();                            // 지금 기사에 이미 나온 WHAT/WHY/HOW
  let lastArt=-1;                                 // 마지막으로 닫은 기사의 out 위치(뒤늦게 온 출처 줄을 붙일 곳)
  const flush=()=>{
    if(art!==null){
      /* WHAT·WHY·HOW 가 하나도 없고 사진 번호도 없는 덩어리는 기사가 아니라 **앞머리 안내문**이다
         (예: "상호작용 요소가 있는 [신문요약 수정본 1/7]", "원본: 2026-09-24.pdf", "30쪽 전체를 이미지로 확인함 …").
         → 기사 제목처럼 크게 그리지 않고, '글+지면' 사진 칸도 붙이지 않는다(.brf-art 가 아니면 사진 칸 대상이 아님). 2026-09-24 */
      if(!artKV.size && !pageHint) out.push('<div class="brf-intro">'+art+"</div>");
      else{
        out.push('<div class="brf-art"'+(pageHint?' data-page="'+pageHint+'"':'')+'><div class="brf-main">'+art+"</div></div>");
        lastArt=out.length-1;
      }
      art=null;
    }
    pageHint=0; artKV=new Set();
  };
  /* ── 기사 안에 딸린 줄들 (2026-09-24) ───────────────────────────────────
     GPT 요약이 기사마다 이런 줄을 덧붙이기 시작했다:
       · 보충 설명  "기사 속 테스트: 20만줄 코드 …"   (WHAT 과 WHY 사이, 불릿 없음)
       · 출처       "<링크|원문> · PDF 21쪽"          (기사 맨 끝)
     예전엔 '불릿이 아닌 줄 = 새 기사 제목' 이라 한 기사가 여러 개로 쪼개지고 출처 줄도 따로 카드가 됐다.
     → 출처 줄은 그 기사 끝에 작은 글씨로 붙이고(PDF 쪽 번호는 사진 번호 단서로도 쓴다),
       보충 설명은 '다음에 오는 표지가 WHY/HOW(아직 안 나온 것)거나 출처 줄'이면 같은 기사 안에 둔다.
       다음 표지가 WHAT 이면 그 줄은 진짜 새 기사 제목이다. */
  const srcPlain=(t)=>String(t||"").replace(/<[^|>]+\|([^>]+)>/g,"$1").replace(/<https?:[^>]+>/g,"링크").replace(/[*_•]/g,"").trim();
  const isSrcLine=(t)=>{ const p=srcPlain(t);
    return p.length<=70 && (/^(?:원문|출처)(?=[\s·:：|,(]|$)/.test(p) || /^PDF\s*\d{1,3}\s*(?:쪽|p|페이지)/i.test(p)); };
  const nextMark=(i)=>{                          // 다음에 오는 표지: "WHAT"/"WHY"/"HOW"/"SRC"/null
    for(let j=i+1, seen=0; j<LINES.length && seen<6; j++){
      const t=LINES[j].trim(); if(!t) continue; seen++;
      const k=t.match(/^•\s*(WHAT|WHY|HOW)\s*[:：]/i); if(k) return k[1].toUpperCase();
      if(isSrcLine(t)) return "SRC";
    }
    return null;
  };
  const detailHtml=(t)=>{ const d=t.match(/^([^:：<]{2,16})[:：]\s*([\s\S]+)$/);
    return '<div class="brf-line brf-detail">'+(d?'<span class="dl">'+inline(d[1].replace(/[*_]/g,""))+'</span> '+inline(d[2]):inline(t))+"</div>"; };

  const LINES=body.split("\n");
  // i 번째 줄 다음의 '내용 있는 줄' — 목록이 끝나고 새 기사가 시작되는지 미리 보려고 쓴다
  const nextLine=(i)=>{ for(let j=i+1;j<LINES.length;j++){ const t=LINES[j].trim(); if(t) return t; } return ""; };
  const KV_RE=/^•\s*(?:WHAT|WHY|HOW|What|Why|How)\s*[:：]/;
  for(let li=0; li<LINES.length; li++){
    const line=LINES[li].trim();
    if(!line) continue;
    if(isNote(line)) continue;                   // 남아 있는 검증·면책 안내문 줄 제거

    let m;
    // "| … |" 줄 묶음 = 표 → 지금 기사 안에(기사가 없으면 그 자리에) 그린다
    if(TBL_LINE.test(line)){
      const run=[]; while(li<LINES.length && TBL_LINE.test(LINES[li].trim())) run.push(LINES[li++]);
      li--;
      const t=tableHtml(run);
      if(chk){ flushChk(); } inList=false; lastItem=-1;
      if(art!==null) art+=t; else out.push(t);
      continue;
    }
    // 제목 바로 아래 "🔴 오늘 신문에서 …가장 중요한 기사임." 같은 표시 줄 → 제목에 딸린 설명(새 제목 아님)
    // ⚠️ 예전 요약은 "🔴 “3억대 서울 분양도 나와”…청약 큰장" 처럼 🔴 로 **제목**을 시작했다 → 구분:
    //    설명은 마침표로 끝나는 문장, 제목은 마침표로 안 끝난다.
    if(art!==null && !artKV.size && /^(?:[🔴🟠🟡🟢🔵🟣⭐❗]|‼️?)/u.test(line) && !/[|｜]/.test(line)
       && /[.。](?:\*|_)*\s*$/.test(line)){
      art+='<div class="brf-sub brf-flagnote">'+inline(line)+"</div>";
      continue;
    }
    if(m=line.match(/^•\s*(WHAT|WHY|HOW|What|Why|How)\s*[:：]\s*([\s\S]*)$/)){
      open(); art+='<div class="brf-kv"><span class="k">'+m[1].toUpperCase()+'</span><span class="v">'+inline(m[2])+"</span></div>";
      artKV.add(m[1].toUpperCase());
      continue;
    }
    // ── 원문 링크 표시 중단 (2026-09-17, 사용자 요청) ─────────────────
    //    '원문 확인: …' 줄을 **화면에 그리지 않는다.** 다만 이 줄은 '기사 끝'을 알리는
    //    표시이기도 해서, flush() 는 그대로 호출해 기사 사이 여백은 유지한다.
    //    (다시 켜려면 아래 주석 처리된 예전 렌더를 되살리면 된다)
    if(/^•?\s*원문\s*확인/.test(line)){
      flush();                                     // ← 기사 끝. 다음 기사는 여백 두고 새 블록
      continue;
    }
    // "<링크|원문> · PDF 21쪽" → 그 기사 끝에 작은 출처 줄로(따로 카드 만들지 않음). PDF 쪽 = 사진 번호 단서
    if(isSrcLine(line)){
      const pm=srcPlain(line).match(/PDF\s*(\d{1,3})\s*(?:쪽|p|페이지)/i);
      const html='<div class="brf-src">'+inline(line.replace(/^•\s*/,""))+"</div>";
      if(art!==null){ art+=html; if(pm&&!pageHint) pageHint=+pm[1]; flush(); }
      else if(lastArt>=0){
        out[lastArt]=out[lastArt].replace(/<\/div><\/div>$/, html+"</div></div>");
        if(pm && !/data-page=/.test(out[lastArt])) out[lastArt]=out[lastArt].replace('<div class="brf-art"','<div class="brf-art" data-page="'+(+pm[1])+'"');
      }
      continue;
    }
    // "• 사진: 07" 같은 '지면 번호' 줄 — 화면엔 안 그리고, 기사에 사진 번호로만 붙여 둔다
    if(m=line.match(PAGE_LINE_RE)){
      open(); pageHint=+m[1];
      continue;
    }
    // 체크 묶음 안의 불릿(• …)은 체크 항목 하나
    if(chk && !KV_RE.test(line) && (m=line.match(/^•\s*([\s\S]+)$/))){ chk.push(chkItem(m[1])); continue; }
    // 번호 목록 안의 불릿(• …)은 방금 항목의 설명으로 붙인다
    if(inList && lastItem>=0 && (m=line.match(/^•\s*([\s\S]+)$/))){ addNote(m[1]); continue; }
    if(m=line.match(/^•\s*([\s\S]*)$/)){           // 그 밖의 불릿
      open(); art+='<div class="brf-line">• '+inline(m[1])+"</div>";
      continue;
    }

    const plain0=line.replace(/[*_]/g,"").trim();
    // "📌 오늘 신문 핵심 한 줄" 뒤 문장이 다음 줄에 따로 온 경우
    if(keyWait!==null){ out.push(keyBox(keyWait,plain0)); keyWait=null; continue; }
    // "📌 오늘 신문 핵심 한 줄 서울 주택은 …" → 강조 상자
    const km=plain0.match(KEYLINE_RE);
    if(km){
      flush(); flushChk(); inList=false; lastItem=-1;
      if(km[2].trim()) out.push(keyBox(km[1],km[2].trim())); else keyWait=km[1];
      continue;
    }
    // "✅ 오늘 반드시 체크할 핵심 주제" → 섹션 머리말 + 아래 줄들을 체크 항목으로
    if(isSecHead(plain0) && !splitListHead(plain0)){
      flush(); flushChk(); inList=false; lastItem=-1;
      out.push('<div class="brf-sec">'+inline(plain0)+"</div>");
      chk=[];
      continue;
    }
    if(chk){
      if(NUM_ITEM_RE.test(plain0)){ flushChk(); inList=true; lastItem=-1; pushItems(plain0); continue; }  // 번호가 오면 번호 목록으로
      if(!endsBlock(plain0,li) && !(/^\d{1,3}[.)]\s/.test(plain0) && nextMark(li)==="WHAT")){ chk.push(chkItem(plain0)); continue; }
      flushChk();
    }

    // "🔍 …봐야 할 5가지 1. …" → 머리말은 따로, 번호는 한 줄씩
    const lh=splitListHead(line.replace(/\*/g,"").trim());
    if(lh){
      flush(); flushChk();
      out.push('<div class="brf-sec">'+inline(lh[0])+"</div>");
      lastItem=-1;
      if(lh[1]) pushItems(lh[1]);
      inList=true;
      continue;
    }
    // 머리말 아래 이어지는 "2. …" "3. …" 줄들
    if(inList && NUM_ITEM_RE.test(line)){
      pushItems(line.replace(/\*/g,"").trim());
      continue;
    }
    /* 번호가 아닌 줄 = 보통 바로 위 항목의 '설명 한 줄'. 목록을 끝내는 건 딱 두 경우뿐:
         ① 카테고리 머리말(부동산·주거 등)  ② 다음 줄이 "• WHAT:" → 이 줄은 새 기사 제목 */
    if(inList && lastItem>=0){
      const plain=line.replace(/\*/g,"").trim(), cm2=plain.match(CAT_RE);
      const isCat=cm2 && (!plain.slice(cm2[0].length).trim() || CAT_GUARD.test(plain.slice(cm2[0].length).trim()));
      if(!isCat && !KV_RE.test(nextLine(li))){ addNote(plain); continue; }
    }
    inList=false; lastItem=-1;

    // 불릿이 아니면 카테고리 머리말 또는 기사 제목
    let rest=line.replace(/\*/g,"").trim();        // 제목은 어차피 크게 쓰므로 볼드 기호는 제거
    const cm=rest.match(CAT_RE);
    if(cm){
      const after=rest.slice(cm[0].length).trim();
      if(!after || CAT_GUARD.test(after)){
        flush();
        out.push('<div class="brf-cat">'+inline(cm[1])+"</div>");   // (2) 카테고리 = 큰 글씨 + 줄바꿈
        rest=after;
        if(!rest) continue;
      }
    }
    // 기사 안의 보충 설명 줄 — 다음 표지가 아직 안 나온 WHY/HOW 이거나 출처 줄이면 새 제목이 아니다
    if(art!==null && artKV.size){
      const nm=nextMark(li);
      if(nm==="SRC" || (nm && nm!=="WHAT" && !artKV.has(nm))){ art+=detailHtml(line); continue; }
    }
    flush();
    // 제목 끝에 "(사진 07)" 처럼 붙어 온 지면 번호도 떼어서 기억한다
    const tp=rest.match(PAGE_TAIL_RE);
    if(tp){ rest=rest.slice(0,tp.index).trim(); }
    art=briefTitle(rest);                          // (3) 기사 제목 = 다른 크기로 한눈에
    if(tp) pageHint=+tp[1];                        // flush() 가 0 으로 되돌린 뒤에 넣어야 한다
  }
  if(keyWait!==null) out.push('<div class="brf-sec">'+inline(keyWait)+"</div>");   // 문장 없이 끝났으면 머리말만
  flushChk();
  flush();

  const html=(head?'<div class="brf-head">'+inline(head)+"</div>":"")+out.join("");
  return {html:html||mrkdwn(raw), part:part};
}
const hhmm=iso=>{const m=(iso||"").match(/T(\d{2}):(\d{2})/);return m?`${m[1]}:${m[2]}`:""};
function krDate(d){const[y,mo,da]=d.split("-").map(Number);const w=["일","월","화","수","목","금","토"][new Date(Date.UTC(y,mo-1,da)).getUTCDay()];return `${y}년 ${mo}월 ${da}일 (${w})`}
function todayKST(){const n=new Date(Date.now()+9*3600*1000);return n.toISOString().slice(0,10)}

const state={date:todayKST(),active:new Set(),data:{date:todayKST(),messages:[]}};

async function load(){
  try{
    const r=await fetch(`/slack/data?date=${state.date}`,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    state.data=await r.json();
    syncHideBtns();
    document.getElementById("updated").textContent="마지막 갱신 "+new Date().toTimeString().slice(0,8);
  }catch(e){
    document.getElementById("updated").textContent="갱신 실패 — 재시도 중";
  }
  render();
}
/* 화면에 영향을 주는 값들을 문자열 하나로 묶은 '지문'.
   20초마다 새로 받아와도 이 지문이 같으면 = 바뀐 게 없다 → 다시 그리지 않는다.
   (예전엔 무조건 feed 를 비우고 다시 만들어서 화면이 20초마다 깜빡였다.) */
function snapshot(){ return JSON.stringify([state.data,[...state.active].sort()]); }   // JSON 묶음도 메시지 안에 있어 함께 바뀐다
let lastSnapshot=null;      // 마지막으로 그린 지문
let seenKeys=new Set();     // 이미 화면에 있던 메시지들 → 이번에 처음 보이는 것만 애니메이션

function render(){
  const snap=snapshot();
  if(snap===lastSnapshot) return;   // ← 깜빡임 방지의 핵심
  lastSnapshot=snap;

  // 검증·면책 안내문만 담긴 메시지는 아예 목록에서 뺀다(카운트·필터도 함께 맞춰짐)
  // 요약 끝의 '기사↔지면' JSON 묶음은 떼어서 모아 두고(SUMMARY_META), 화면엔 사람이 읽는 글만 그린다
  SUMMARY_META=[];
  const bodyOf=new Map();
  (state.data.messages||[]).forEach(m=>{
    const sj=extractSummaryJson(cleanSent(m.text));
    SUMMARY_META.push(...sj.articles); bodyOf.set(m, sj.text);
  });
  const msgs=[...(state.data.messages||[])]
    .filter(m=>!isNoteOnly(bodyOf.get(m)) && (m.kind==="image" || bodyOf.get(m)))   // 꼬리표·JSON 만 있던 메시지도 뺀다
    .sort((a,b)=>(a.ts||"").localeCompare(b.ts||""));
  document.getElementById("date").textContent=krDate(state.data.date||state.date);
  document.getElementById("datepick").value=state.data.date||state.date;
  
  const counts={};msgs.forEach(m=>{const k=CATS[m.source]?m.source:"unknown";counts[k]=(counts[k]||0)+1});
  const tb=document.getElementById("toolbar");tb.innerHTML="";
  tb.appendChild(chip("all","전체",msgs.length,null));
  ["bot","user","unknown"].forEach(k=>{if(counts[k])tb.appendChild(chip(k,cat(k).label,counts[k],cat(k).color))});
  const right=document.createElement("div"); right.className="tb-right";
  right.append(fontCtl(), viewSeg());        // 오른쪽 끝: 가− 100% 가+ · 📝 글만 / 📰 글+지면
  tb.appendChild(right);
  syncChips();
  const feed=document.getElementById("feed");feed.innerHTML="";
  if(msgs.length){const bd=document.createElement("div");bd.className="daybreak";bd.textContent="오래된순";feed.appendChild(bd)}
  const shown=msgs.filter(m=>state.active.size===0||state.active.has(CATS[m.source]?m.source:"unknown"));
  if(!shown.length){
    feed.insertAdjacentHTML("beforeend",'<div class="empty"><div class="big">아직 표시할 메시지가 없어요</div>이 날짜에 #gpt 채널에 올라온 대화가 없습니다.</div>');
  }
  shown.forEach(m=>{
    const c=cat(m.source);const el=document.createElement("article");
    // 이번에 처음 등장하는 메시지에만 'is-new' → 그 카드만 스윽 나타난다
    el.className="entry"+(seenKeys.has(msgKey(m))?"":" is-new");
    el.style.setProperty("--dot",c.color);
    const raw=bodyOf.get(m)||"";                    // 꼬리표·JSON 묶음을 뗀 사람이 읽는 글
    const txt=dropNotes(raw)||raw;                  // 안내문 줄을 걷어낸 본문(다 지워지면 원문 유지)
    // 신문 브리핑이면 전용 서식, 아니면 기존 그대로
    const brf=isBriefing(txt)?briefing(txt):null;
    const bodyHTML=brf?brf.html:mrkdwn(txt);
    const partTag=(brf&&brf.part)?`<span class="kind">${brf.part}</span>`:``;
    el.innerHTML=`<span class="time">${hhmm(m.ts)}</span><span class="node"></span>`+
      `<div class="card"><div class="meta"><span class="tag">${c.label}</span>`+
      partTag+
      (m.kind==="image"?`<span class="kind">이미지</span>`:``)+`</div>`+
      `<div class="body">${bodyHTML}</div></div>`;
    feed.appendChild(el);
  });
  document.getElementById("foot-count").textContent=`메시지 ${msgs.length} · 표시 ${shown.length}`;
  seenKeys=new Set(msgs.map(msgKey));   // 다음 렌더 때 '새 것'을 가려내기 위한 기준
  feedVer++; decorate();                // 피드를 새로 그렸으면 '글+지면' 사진 칸도 다시 붙인다
}
// 메시지 한 건을 구별하는 열쇠. ts 는 슬랙에서 메시지마다 고유하다.
function msgKey(m){ return (m.ts||"")+"|"+(m.kind||""); }
function chip(key,label,n,color){
  const b=document.createElement("button");b.className="chip"+(key==="all"?" all":"");b.dataset.key=key;
  if(color)b.style.setProperty("--dot",color);
  b.innerHTML=`<span class="dot"></span><span>${label}</span><span class="n">${n}</span>`;
  b.onclick=()=>{if(key==="all")state.active.clear();else if(state.active.has(key))state.active.delete(key);else state.active.add(key);render()};
  return b;
}
function syncChips(){document.querySelectorAll(".chip").forEach(ch=>{const k=ch.dataset.key;const on=k==="all"?state.active.size===0:state.active.has(k);ch.setAttribute("aria-pressed",on?"true":"false")})}

/* ── 오늘 신문 원본 패널 ────────────────────────────────────────────────
   /api/news/today 가 그날 PDF·사진 목록을 준다. 파일은 서버가 구글 드라이브에서
   미리 받아둔 것(scripts/news_sync.py)이라, 여기서는 목록만 받아 버튼으로 그린다.
   사진 썸네일은 '펼치기'를 눌러야 불러온다 → 페이지 첫 로딩을 가볍게 유지. */
const newsState={open:false,date:"",busy:false,images:[]};

function mb(n){ n=Number(n||0); if(!n) return ""; return n<1024*1024 ? (n/1024).toFixed(0)+"KB" : (n/1024/1024).toFixed(1)+"MB"; }

async function loadNews(){
  const box=document.getElementById("news");
  if(!box) return;
  let d=null;
  try{
    const r=await fetch(`/api/news/today?date=${state.date}`,{cache:"no-store"});
    d=await r.json();
  }catch(e){ box.hidden=true; return; }
  renderNews(d);
  decorate();                           // 사진 목록이 새로 왔으면 기사 옆 사진 칸도 맞춘다(바뀐 게 없으면 그대로)
}

let lastNewsSnapshot=null;   // 신문 패널도 똑같이: 목록이 그대로면 버튼을 다시 만들지 않는다
function renderNews(d){
  const snap=JSON.stringify(d);
  if(snap===lastNewsSnapshot) return;
  lastNewsSnapshot=snap;

  const box=document.getElementById("news");
  const acts=document.getElementById("news-actions");
  const grid=document.getElementById("news-grid");
  const toggle=document.getElementById("news-toggle");
  const note=document.getElementById("news-note");
  const sub=document.getElementById("news-sub");
  const ttl=document.getElementById("news-title");
  if(!d||d.ok===false){ box.hidden=true; return; }
  box.hidden=false;

  // 날짜가 바뀌면 펼침 상태와 그려둔 썸네일을 초기화한다.
  if(newsState.date!==d.date){ newsState.date=d.date; newsState.open=false; grid.innerHTML=""; }
  newsState.images=d.ready?(d.images||[]):[];   // 뷰어가 쓸 목록(아직 없으면 빈 목록)

  if(!d.ready){
    // 아직 안 올라왔거나(오늘 새벽) 캐시에 없는 지난 날짜.
    box.classList.add("waiting");
    ttl.textContent=(d.date===todayKST()?"오늘":d.date.slice(5).replace("-","/"))+" 신문 원본";
    sub.textContent="";
    acts.innerHTML="";
    toggle.hidden=true; grid.hidden=true;
    const past=d.date<todayKST();
    let msg=past?"이 날짜의 원본은 서버에 없습니다(최근 며칠치만 보관합니다).":
                 "아직 올라오지 않았습니다. 보통 <b>오전 6시</b>쯤 준비됩니다.";
    if(d.latest&&d.latest!==d.date) msg+=` <a href="#" id="news-latest">가장 최근(${d.latest.slice(5).replace("-","/")}) 보기</a>`;
    note.innerHTML=msg;
    const link=document.getElementById("news-latest");
    if(link) link.onclick=(e)=>{e.preventDefault();state.date=d.latest;document.getElementById("datepick").value=d.latest;load();};
    return;
  }

  box.classList.remove("waiting");
  ttl.textContent=(d.date===todayKST()?"오늘":d.date.slice(5).replace("-","/"))+" 신문 원본";
  const parts=[];
  if(d.pdf&&d.pdf.pages) parts.push(d.pdf.pages+"면");
  if(d.count) parts.push("사진 "+d.count+"장");
  if(d.total_size) parts.push("합계 "+mb(d.total_size));
  if(d.updated) parts.push(d.updated.slice(11,16)+" 받음");
  sub.textContent=parts.join(" · ");

  // 버튼: PDF 받기 / PDF 보기 / 사진+PDF ZIP
  acts.innerHTML="";
  if(d.pdf){
    acts.insertAdjacentHTML("beforeend",
      `<a class="news-btn primary" href="${d.pdf.url}"><span>📄 PDF 받기</span><span class="sz">${mb(d.pdf.size)}</span></a>`+
      `<a class="news-btn" href="${d.pdf.view_url}" target="_blank" rel="noopener"><span>👁 PDF 보기</span></a>`);
  }
  if(d.count){
    acts.insertAdjacentHTML("beforeend",
      `<a class="news-btn" href="${d.zip_url}"><span>🗂 사진 ${d.count}장 ZIP</span>`+
      `<span class="sz">${mb(d.photos_size||d.total_size)}</span></a>`);
  }

  // 사진 썸네일(접힘/펼침)
  toggle.hidden=!d.count;
  toggle.textContent=(newsState.open?"▾ 사진 접기":`▸ 사진 ${d.count}장 펼치기`);
  toggle.setAttribute("aria-expanded",newsState.open?"true":"false");
  grid.hidden=!newsState.open;
  // 펼친 상태에서 사진 장수가 달라졌으면(받아오기 직후 등) 그리드를 다시 그린다.
  if(newsState.open&&grid.children.length!==d.count) fillGrid(d);
  toggle.onclick=()=>{
    newsState.open=!newsState.open;
    if(newsState.open&&grid.children.length!==d.count) fillGrid(d);
    grid.hidden=!newsState.open;
    toggle.textContent=(newsState.open?"▾ 사진 접기":`▸ 사진 ${d.count}장 펼치기`);
    toggle.setAttribute("aria-expanded",newsState.open?"true":"false");
  };

  const src=d.source_url?` · <a href="${d.source_url}" target="_blank" rel="noopener">원문 글</a>`:"";
  note.innerHTML=`사진을 누르면 <b>넘겨 보기</b>가 열립니다(확대·좌우 넘김). 오른쪽 아래 ⤓ 는 그 장만 저장.${src}`;
}

function fillGrid(d){
  const grid=document.getElementById("news-grid");
  grid.innerHTML=d.images.map((im,i)=>
    `<a class="news-cell" href="${im.url}" data-i="${i}" title="${im.name}">`+
    `<img loading="lazy" decoding="async" src="${im.thumb}" alt="${im.name}">`+
    `<span class="no">${String(i+1).padStart(2,"0")}</span>`+
    `<span class="dl" data-href="${im.download_url}" title="이 장만 저장">⤓</span></a>`).join("");
  // 썸네일 클릭 → 뷰어 열기(새 탭 대신). ⤓ 는 링크 안의 링크라 <a> 로 못 넣어 클릭을 가로챈다.
  grid.querySelectorAll(".news-cell").forEach(cell=>{
    cell.addEventListener("click",ev=>{ev.preventDefault();openViewer(+cell.dataset.i);});
  });
  grid.querySelectorAll(".dl").forEach(el=>{
    el.addEventListener("click",ev=>{ev.preventDefault();ev.stopPropagation();location.href=el.dataset.href;});
  });
}

/* ── 신문 넘겨 보기(뷰어) ───────────────────────────────────────────────
   신문은 글씨가 작아서 '크게 띄우기'만으론 부족하다. 확대(핀치·더블탭·＋−)와
   이동(드래그)까지 있어야 실제로 읽힌다. 아래가 그 최소 구현. */
const V={list:[],i:0,zoom:1,tx:0,ty:0,nat:{w:1,h:1},fitW:0,fitH:0,stage:null,drag:null,pts:new Map(),pinch:null,
         navT:null,navPos:null};
const $=id=>document.getElementById(id);

/* ── 넘김 화살표: 자동 숨김 ───────────────────────────────────────────
   신문 사진 위에 화살표가 얹혀 글씨를 가린다는 문제. 1초 동안 아무 조작이
   없으면 감추고, 만지거나 마우스를 움직이면 다시 보여준다. */
const NAV_HIDE_MS=1000;
function showNav(){
  $("lb-prev").classList.remove("idle");
  $("lb-next").classList.remove("idle");
  clearTimeout(V.navT);
  V.navT=setTimeout(hideNav, NAV_HIDE_MS);
}
function hideNav(){
  $("lb-prev").classList.add("idle");
  $("lb-next").classList.add("idle");
}
/* 사진 양옆 여백이 화살표가 들어갈 만큼 넓으면, 화살표를 '사진 바깥'으로 옮긴다.
   → 지면 위에 아예 안 올라간다. 좁으면(휴대폰 세로 등) 화면 가장자리에 붙인다. */
function placeNav(){
  if(!V.stage) return;
  const btnW=window.innerWidth<=520?38:44;      // CSS 의 화살표 너비와 맞춘다
  const edge=window.innerWidth<=520?4:10;
  const gap=(V.stage.w - V.fitW*V.zoom)/2;      // 사진 한쪽 여백
  // 여백 안에 화살표가 통째로 들어가면 사진 바로 바깥에 붙인다
  const pos=(gap>=btnW+edge+4) ? Math.round(gap-btnW-4) : edge;
  if(pos===V.navPos) return;                   // 값이 그대로면 다시 쓰지 않는다(버벅임 방지)
  V.navPos=pos;
  $("lb-prev").style.left=pos+"px";
  $("lb-next").style.right=pos+"px";
}

/* ══ 형광펜 ═══════════════════════════════════════════════════════════════
   신문 사진 위에 손가락·마우스로 줄을 긋는다.

   좌표를 왜 '비율(0~1)'로 저장하나:
     화면 크기도 확대 배율도 기기마다 다르다. 픽셀로 저장하면 폰에서 그은 줄이
     PC 에서 엉뚱한 데 찍힌다. 사진 왼쪽 위를 0,0 / 오른쪽 아래를 1,1 로 보면
     어디서 보든 같은 글자 위에 얹힌다.

   저장은 하지 않는다 — 이 창의 메모리에만 있다(아래 '일회성' 설명 참고). */
const M={on:false, erase:false, color:"#ff5b5b", tool:"line", wk:1,
         marks:{}, date:"", cur:null, sel:null, move:null};

/* ── 형광펜은 '일회성' 이다 (2026-09-17) ──────────────────────────────
   그은 줄은 이 창의 메모리(M.marks)에만 있다.
     · 새로고침하거나 창을 닫으면 사라진다.
     · 서버에도, 브라우저 저장소에도 **아무것도 남기지 않는다.**
     · 접속한 사람마다 각자의 창에서만 보이므로 자연히 완전히 분리된다.
       (IP 로 나누는 것보다 정확하다 — 같은 WiFi 를 쓰는 가족은 IP 가 같고,
        휴대폰은 이동하면 IP 가 바뀐다.)
   창이 열려 있는 동안에는 장을 넘겨도, 뷰어를 닫았다 다시 열어도 유지된다.
   날짜를 바꾸면 다른 신문이므로 비운다. */
function resetMarksIfNewDate(){
  if(M.date!==state.date){ M.marks={}; M.date=state.date; M.cur=null; M.sel=null; }
}

const markName=()=> (V.list[V.i]||{}).name || "";          // 지금 보는 사진의 파일 이름
const markList=()=> (M.marks[markName()] ||= []);          // 그 사진에 그은 줄 목록

let savedT=null;
function setSaved(t){
  const el=$("lb-saved"); if(!el) return;
  el.textContent=t; clearTimeout(savedT);
  if(t) savedT=setTimeout(()=>{ if(el.textContent===t) el.textContent=""; },2000);
}

/* ── 도구: 직선 · 동그라미 · 자유 ─────────────────────────────────────
   비율 좌표(0~1)는 가로·세로 기준이 다르다(사진이 세로로 길다). 각도·길이를 다룰 땐
   세로를 '가로 기준'으로 환산해야 화면에서 본 모양과 계산이 일치한다.
   그 환산 비율이 aspect = 사진높이 / 사진너비 다. */
const aspect=()=> (V.fitH||1)/(V.fitW||1);

/* 자를 댄 것처럼 — 거의 수평/수직이면 정확히 딱 맞춰 준다.
   신문 기사 줄에 밑줄을 그을 땐 손이 조금 기울어도 반듯하게 나와야 한다.
   7도 안쪽이면 눕히거나 세우고, 그보다 기울면 그은 대로 둔다(대각선도 그을 수 있게). */
const SNAP_DEG=7;
function snapStraight(a,b){
  const dx=b[0]-a[0], dy=(b[1]-a[1])*aspect();
  if(!dx && !dy) return b;
  const deg=Math.abs(Math.atan2(dy,dx)*180/Math.PI);
  if(deg<=SNAP_DEG || deg>=180-SNAP_DEG) return [b[0], a[1]];   // 수평으로 눕힌다
  if(Math.abs(deg-90)<=SNAP_DEG)         return [a[0], b[1]];   // 수직으로 세운다
  return b;
}

/* 표시 하나의 '크기'(가로 기준 길이). 너무 작으면 버리려고 쓴다. */
function strokeSpan(st){
  const a=st.pts[0], b=st.pts[st.pts.length-1];
  return Math.hypot(b[0]-a[0], (b[1]-a[1])*aspect());
}

/* ── 선 굵기 ──────────────────────────────────────────────────────────
   굵기도 '사진 높이의 몇 %' 라는 비율로 저장한다. 그래야 확대해도 글씨와 같은
   비율로 함께 굵어져, 어느 배율에서 보든 그을 때 본 모습 그대로다.
   도구마다 기본값이 다르다 — 동그라미는 테두리라 가늘어야 안쪽 글씨가 안 가려진다.
   여기에 사용자가 고른 배율(M.wk = 가늘게 0.6 · 보통 1 · 굵게 1.7)을 곱한다. */
const BASE_W={free:0.018, line:0.018, oval:0.009};
const strokeW=(tool)=> (BASE_W[tool]||0.018)*M.wk;

/* ── 방금 그린 동그라미를 통째로 옮기기 (2026-09-21) ──────────────────
   동그라미는 한 번에 기사에 딱 맞게 두르기가 어렵다(특히 손가락). 그래서
   **그린 직후 그 하나만** '고른 상태'로 두고, 안쪽을 끌면 위치를 옮길 수 있게 했다.
   고른 상태가 풀리는 때 — 딴 곳 긋기 · 도구 바꾸기 · 장 넘기기 · 지우개 켜기 · Esc · 형광펜 끄기.
   (색·굵기를 바꾸는 건 '고른 동그라미'에 바로 적용되므로 풀리지 않는다)
   풀린 뒤에는 예전처럼 지우개로 지우고 다시 그린다 — 평소 '긋기'와 헷갈리지 않게 '방금 것'만 허용. */
function selStroke(){
  const list=M.marks[markName()];
  // 지워지거나 장이 바뀌어 목록에서 사라졌으면 고른 상태가 아니다
  if(!M.sel||!list||list.indexOf(M.sel)<0){ M.sel=null; return null; }
  return M.sel;
}
/* 고른 동그라미를 감싸는 네모 칸 [왼쪽,위,오른쪽,아래] — 판정과 점선 표시에 함께 쓴다 */
function selBox(st){
  const [a,b]=st.pts;
  return [Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])];
}
/* 누른 자리가 그 동그라미 '안'인가. 테두리 바로 바깥도 조금 인정한다(손가락은 뚱뚱하다).
   세로 여유는 aspect 로 나눠야 가로와 '눈으로 본 거리'가 같아진다. */
const SEL_PAD=0.012;
function inSel(st,nx,ny){
  const [x0,y0,x1,y1]=selBox(st), py=SEL_PAD/aspect();
  return nx>=x0-SEL_PAD && nx<=x1+SEL_PAD && ny>=y0-py && ny<=y1+py;
}
/* 처음 자리(orig)에서 dx,dy 만큼 민다. 사진 밖으로 나가지 않게 이동량을 먼저 깎는다. */
function moveSel(st,orig,dx,dy){
  const xs=orig.map(p=>p[0]), ys=orig.map(p=>p[1]);
  dx=Math.max(-Math.min(...xs), Math.min(1-Math.max(...xs), dx));
  dy=Math.max(-Math.min(...ys), Math.min(1-Math.max(...ys), dy));
  st.pts=orig.map(([x,y])=>[x+dx,y+dy]);
  drawMarks();
}

/* 지우개가 '이 표시를 눌렀나' 판정할 때 쓸 대표 점들.
   동그라미는 두 점(모서리)만 저장하므로, 테두리를 24점으로 풀어서 비교해야
   테두리를 톡 쳤을 때 지워진다(모서리만 보면 한가운데를 쳐야 지워진다). */
function hitPoints(st){
  if(st.t!=="oval") return st.pts;
  const [a,b]=st.pts;
  const cx=(a[0]+b[0])/2, cy=(a[1]+b[1])/2;
  const rx=Math.abs(b[0]-a[0])/2, ry=Math.abs(b[1]-a[1])/2;
  return Array.from({length:24},(_,i)=>{
    const t=i/24*Math.PI*2;
    return [cx+rx*Math.cos(t), cy+ry*Math.sin(t)];
  });
}

/* 화면 좌표 → 사진 안에서의 비율(0~1). 사진 밖이면 가장자리로 붙인다. */
function toImgXY(cx,cy){
  const r=$("lb-img").getBoundingClientRect();
  if(!r.width||!r.height) return null;
  const clamp=v=>Math.min(Math.max(v,0),1);
  return [clamp((cx-r.left)/r.width), clamp((cy-r.top)/r.height)];
}

/* 표시 하나를 그림판에 그린다. 뷰어(큰 사진)와 기사 옆 작은 사진이 **같은 함수**를 쓴다
   → 좌표·굵기가 둘 다 '사진 대비 비율'이라 크기가 달라도 같은 글자 위에 같은 모양으로 얹힌다. */
function strokeOne(ctx, st, pw, ph, minW){
  ctx.strokeStyle=st.c; ctx.lineWidth=Math.max(minW, st.w*ph);
  ctx.beginPath();
  if(st.t==="oval"){
    // 끌어서 만든 네모 칸에 딱 들어가는 타원 — 기사를 둥글게 둘러싸는 표시
    const [a,b]=st.pts;
    const cx=(a[0]+b[0])/2*pw, cy=(a[1]+b[1])/2*ph;
    const rx=Math.abs(b[0]-a[0])/2*pw, ry=Math.abs(b[1]-a[1])/2*ph;
    ctx.ellipse(cx,cy,Math.max(rx,1),Math.max(ry,1),0,0,Math.PI*2);
  }else{
    st.pts.forEach(([x,y],k)=>{ const px=x*pw, py=y*ph; k?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    if(st.pts.length===1){ const [x,y]=st.pts[0]; ctx.lineTo(x*pw+0.1, y*ph); }  // 점 하나도 보이게
  }
  ctx.stroke();
}

/* 형광펜 그림판을 사진과 똑같은 위치·크기로 맞추고 다시 그린다.
   캔버스 픽셀 수는 화면 점 밀도(devicePixelRatio)만큼 키워야 선이 안 뭉갠다. */
function drawMarks(){
  const cv=$("lb-mark"), img=$("lb-img");
  if(!cv||!img) return;
  const w=V.fitW*V.zoom, h=V.fitH*V.zoom;
  if(!(w>0&&h>0)) return;
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);      // 너무 키우면 느려진다
  cv.style.width=w+"px"; cv.style.height=h+"px";
  cv.style.transform=img.style.transform;                    // 사진과 같은 위치로 이동
  const pw=Math.round(w*dpr), ph=Math.round(h*dpr);
  if(cv.width!==pw||cv.height!==ph){ cv.width=pw; cv.height=ph; }
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,pw,ph);
  ctx.lineCap="round"; ctx.lineJoin="round";
  const all=(M.marks[markName()]||[]).concat(M.cur?[M.cur]:[]);
  for(const st of all) strokeOne(ctx, st, pw, ph, 1.5);    // 가는 선도 가늘게 나오도록 최소 1.5

  /* 고른 동그라미에는 점선 네모를 덧그린다 — '여기를 끌면 옮길 수 있어요' 표시.
     점선은 표시가 아니라 안내라서, 옮기기가 끝나 고른 상태가 풀리면 같이 사라진다. */
  const sel=selStroke();
  if(sel){
    ctx.save();
    const [x0,y0,x1,y1]=selBox(sel);
    ctx.strokeStyle=sel.c; ctx.lineWidth=Math.max(1.2, 0.003*ph);
    ctx.setLineDash([Math.max(5,0.012*ph), Math.max(4,0.010*ph)]);
    ctx.strokeRect(x0*pw, y0*ph, (x1-x0)*pw, (y1-y0)*ph);
    ctx.restore();
  }
}

/* 지우개 — 톡 친 자리에서 가장 가까운 줄을 지운다. */
function eraseAt(nx,ny){
  const list=M.marks[markName()]||[];
  let hit=-1, best=Infinity;
  const ar=aspect();                               // 가로세로 비율을 맞춰야 거리 계산이 맞다
  for(let i=list.length-1;i>=0;i--){
    for(const [x,y] of hitPoints(list[i])){        // 동그라미는 테두리를 풀어서 비교
      const d=Math.hypot(x-nx, (y-ny)*ar);
      if(d<best){ best=d; hit=i; }
    }
  }
  if(hit>=0 && best<0.035){
    if(list[hit]===M.sel) M.sel=null;            // 고른 동그라미를 지웠으면 점선도 없앤다
    list.splice(hit,1); drawMarks(); return true;
  }
  return false;
}

function setPen(on){
  M.on=on; M.erase=false; M.sel=null; M.move=null;
  $("lb-stage").classList.remove("movable","moving");
  $("lb-pen").setAttribute("aria-pressed", on?"true":"false");
  $("lb-tools").hidden=!on;
  $("lb-stage").classList.toggle("marking", on);
  const eraseBtn=$("lb-erase"); if(eraseBtn) eraseBtn.setAttribute("aria-pressed","false");
  // 도구모음 줄이 생기거나 사라지면 사진이 쓸 수 있는 높이가 달라진다 → 다시 맞춘다
  if($("lb-img").naturalWidth) measure();
  if(on){ showNav(); setSaved("이 창에서만 유지 · 새로고침하면 사라짐"); }
}

/* opts (2026-09-23, '글+지면' 보기에서 쓰는 선택 사항 — 안 주면 예전과 똑같이 열린다)
     pen  : true 면 형광펜을 켠 채로 연다(기사 옆 사진을 누르면 바로 줄을 그을 수 있게)
     pick : {key,title} 면 '지면 고르기' — 상단에 📌 이 장 연결 버튼이 나온다 */
const HINT_DEFAULT=document.getElementById("lb-hint").textContent;
function openViewer(i,opts={}){
  if(!newsState.images||!newsState.images.length) return;
  V.list=newsState.images; V.i=Math.max(0,Math.min(i,V.list.length-1));
  V.pick=opts.pick||null;
  V.box=opts.box||null;                        // 열자마자 이 기사 영역으로 확대(요약 JSON 의 bbox)
  $("lb-pick").hidden=!V.pick;
  $("lb").hidden=false;
  document.body.style.overflow="hidden";     // 뒤쪽 페이지가 같이 스크롤되지 않게
  showPage();
  // 지면 고르기면 '무엇을 하면 되는지'를 더 오래 보여준다
  $("lb-hint").textContent = V.pick
    ? `「${V.pick.title.slice(0,24)}${V.pick.title.length>24?"…":""}」 실린 장을 찾아 📌 연결`
    : HINT_DEFAULT;
  $("lb-hint").classList.remove("gone");
  clearTimeout(V.hintT); V.hintT=setTimeout(()=>$("lb-hint").classList.add("gone"), V.pick?6000:2600);
  V.navPos=null; showNav();                    // 열자마자 한 번 보여주고 1초 뒤 감춘다
  resetMarksIfNewDate();                       // 날짜가 바뀌었으면 비운다
  if(opts.pen && !M.on) setPen(true);
  drawMarks();
}
function closeViewer(){
  $("lb").hidden=true;
  document.body.style.overflow="";
  clearTimeout(V.navT);                        // 닫은 뒤 타이머가 남아 돌지 않게
  if(M.on) setPen(false);                      // 형광펜 모드였다면 꺼 둔다
  V.pick=null; $("lb-pick").hidden=true;
  // 그은 줄은 메모리에 그대로 남는다 → 다시 열면 보인다(새로고침하면 사라짐)
  drawSideMarks();                             // 기사 옆 작은 사진에도 방금 그은 줄을 반영
}
function showPage(){
  const im=V.list[V.i]; if(!im) return;
  const img=$("lb-img");
  img.style.visibility="hidden";
  img.src=im.url;                              // 뷰어는 썸네일이 아니라 원본을 쓴다
  img.alt=`${V.i+1}번째 장`;
  $("lb-count").innerHTML=`<b>${String(V.i+1).padStart(2,"0")}</b> / ${V.list.length}`;
  $("lb-dl").href=im.download_url;
  $("lb-prev").disabled=V.i<=0;
  $("lb-next").disabled=V.i>=V.list.length-1;
  V.zoom=1;
  // 같은 사진을 다시 열면 브라우저가 load 를 다시 안 보낼 수 있다 → 이미 다 받았으면 직접 부른다.
  // 두 번 불려도 한 번만 처리되게 '이번 장 번호표(tok)'로 막는다(두 번째에 확대가 풀리는 것 방지).
  const tok=V.loadTok=(V.loadTok||0)+1;
  const done=()=>{ if(V.loadTok!==tok||V.loadedTok===tok) return; V.loadedTok=tok;
    V.zoom=1; measure(); if(V.box){ zoomToBox(V.box); V.box=null; } img.style.visibility="visible"; };
  img.onload=done;
  if(img.complete&&img.naturalWidth) requestAnimationFrame(done);
  // 다음·이전 장을 미리 받아둔다 → 넘길 때 하얗게 안 뜬다
  [V.i+1,V.i-1].forEach(k=>{ if(V.list[k]) new Image().src=V.list[k].url; });
}
function measure(){
  // 사진 원본 크기와, 화면에 '딱 맞게' 넣었을 때의 크기를 계산해 둔다.
  const img=$("lb-img"), st=$("lb-stage").getBoundingClientRect();
  V.nat={w:img.naturalWidth||1,h:img.naturalHeight||1};
  const fit=Math.min(st.width/V.nat.w, st.height/V.nat.h);
  V.fitW=V.nat.w*fit; V.fitH=V.nat.h*fit;
  V.stage={w:st.width,h:st.height};
  if(V.zoom===undefined) V.zoom=1;
  center(); paint();
}
function center(){
  V.tx=(V.stage.w-V.fitW*V.zoom)/2;
  V.ty=(V.stage.h-V.fitH*V.zoom)/2;
}
function clampPan(){
  const w=V.fitW*V.zoom, h=V.fitH*V.zoom;
  V.tx = w<=V.stage.w ? (V.stage.w-w)/2 : Math.max(V.stage.w-w, Math.min(0, V.tx));
  V.ty = h<=V.stage.h ? (V.stage.h-h)/2 : Math.max(V.stage.h-h, Math.min(0, V.ty));
}
let paintQueued=false;
function paint(){
  // 손가락 핀치 중엔 매 프레임 크기를 바꾸면 버벅이므로 한 프레임에 한 번만 그린다.
  if(paintQueued) return;
  paintQueued=true;
  requestAnimationFrame(()=>{
    paintQueued=false;
    const img=$("lb-img"), st=$("lb-stage");
    clampPan();
    img.style.width=(V.fitW*V.zoom)+"px";
    img.style.height=(V.fitH*V.zoom)+"px";
    img.style.transform=`translate(${Math.round(V.tx)}px,${Math.round(V.ty)}px)`;
    st.classList.toggle("zoomed", V.zoom>1.001);
    placeNav();                                // 여백이 바뀌면 화살표 위치도 따라간다
    drawMarks();                               // 형광펜도 사진과 같이 움직인다
    // '선명하게 보이는 한계'를 정확히 계산해 알려준다.
    // 요즘 폰은 화면 점이 촘촘해서(devicePixelRatio 2~3), CSS 크기 그대로가 아니라
    // 화면의 실제 점 개수로 따져야 한다. 예: 1600px 사진, 3배 화면 → CSS 533px 에서 이미 1:1.
    const sharpW=V.nat.w/(window.devicePixelRatio||1);
    const native=(V.fitW*V.zoom)>=sharpW*0.98;
    $("lb-native").textContent = V.zoom<=1.001 ? "" : (native?"원본 한계":Math.round(V.zoom*100)+"%");
  });
}
function maxZoom(){
  // 선명한 한계(1:1)의 3배까지만 허용. 그 이상은 없는 정보를 늘리는 것이라 의미가 없다.
  const sharpW=V.nat.w/(window.devicePixelRatio||1);
  return Math.max(1.5, (sharpW*3)/(V.fitW||1));
}
function resetZoom(){ V.zoom=1; if(V.stage) center(); paint(); }
function zoomAt(factor,cx,cy){
  const st=$("lb-stage").getBoundingClientRect();
  const x=(cx??(st.left+st.width/2))-st.left, y=(cy??(st.top+st.height/2))-st.top;
  const next=Math.max(1,Math.min(maxZoom(),V.zoom*factor));
  if(Math.abs(next-V.zoom)<0.001) return;
  const k=next/V.zoom;
  // 손가락이 가리킨 지점이 제자리에 남도록 위치를 보정한다
  V.tx=x-(x-V.tx)*k;
  V.ty=y-(y-V.ty)*k;
  V.zoom=next; paint();
}
/* ── 확대한 사진을 끌어 옮기기(팬) ──────────────────────────────────────
   확대를 안 한 상태(1배)에서는 사진이 화면에 딱 맞아 움직일 곳이 없다.
   경계 밖으로 나가지 않게 막는 일은 paint() 안의 clampPan() 이 알아서 한다. */
function panBy(dx,dy){
  if(V.zoom<=1.001) return false;              // 옮길 여백이 없음
  V.tx+=dx; V.ty+=dy; paint();
  return true;
}
/* 키보드 한 번에 움직일 거리 — 화면 크기의 12%(너무 작으면 답답, 크면 훌쩍 넘어간다).
   방향키를 꾹 누르면 브라우저가 알아서 반복해 주므로 부드럽게 이어진다. */
function panStep(){
  const st=V.stage||{w:600,h:600};
  return { x:Math.max(40, st.w*0.12), y:Math.max(40, st.h*0.12) };
}

function applyTransform(){ paint(); }   // 옛 이름 호환
/* 사진 속 네모 영역 [x,y,w,h](0~1)이 화면에 꽉 차게 확대하고 그 가운데로 옮긴다 */
function zoomToBox(b){
  if(!V.stage||!V.fitW) return;
  const [x,y,w,h]=b;
  const z=Math.max(1,Math.min(maxZoom(), 0.94*Math.min(V.stage.w/(w*V.fitW), V.stage.h/(h*V.fitH))));
  V.zoom=z;
  V.tx=V.stage.w/2-(x+w/2)*V.fitW*z;
  V.ty=V.stage.h/2-(y+h/2)*V.fitH*z;
  paint();
}
function go(step){
  const n=V.i+step;
  if(n<0||n>=V.list.length) return;
  V.i=n; V.box=null; showPage();
  showNav();                                   // 넘길 땐 화살표를 다시 보여준다
  M.sel=null;                                  // 다른 장으로 갔으니 '방금 그린 것'도 없다
  drawMarks();                                 // 장마다 형광펜이 따로 있다
}

// ── 입력: 버튼 ──────────────────────────────────────────────────────────
$("lb-close").onclick=closeViewer;
$("lb-prev").onclick=()=>go(-1);
$("lb-next").onclick=()=>go(1);

// 감춰진 화살표 되살리기 — 화면을 만지거나(터치·클릭) 마우스를 움직이면 다시 나온다.
$("lb").addEventListener("pointerdown",showNav);
$("lb").addEventListener("mousemove",showNav);
// 화살표에 마우스를 올려둔 동안엔 사라지지 않게(누르려는데 사라지면 곤란하다)
["lb-prev","lb-next"].forEach(id=>{
  $(id).addEventListener("mouseenter",()=>clearTimeout(V.navT));
  $(id).addEventListener("mouseleave",showNav);
});
$("lb-in").onclick=()=>zoomAt(1.6);
$("lb-out").onclick=()=>zoomAt(1/1.6);

// ── 형광펜 버튼들 ───────────────────────────────────────────────────────
$("lb-pen").onclick=()=>setPen(!M.on);
$("lb-pen-off").onclick=()=>setPen(false);
// 색 고르기 — 빨강 · 파랑 · 노랑
const COLORS=[["lb-c1","#ff5b5b"],["lb-c2","#4da3ff"],["lb-c3","#ffd93b"]];
COLORS.forEach(([id,col])=>{
  $(id).onclick=()=>{
    M.color=col; setErase(false);
    COLORS.forEach(([k])=>$(k).setAttribute("aria-pressed", k===id?"true":"false"));
    const sel=selStroke();                     // 방금 그린 동그라미는 색도 바로 바뀐다
    if(sel){ sel.c=col; drawMarks(); }
  };
});
$("lb-c1").setAttribute("aria-pressed","true");        // 기본은 빨강

// 도구 고르기 — 직선(기본) · 동그라미 · 자유
const TOOLS=[["lb-t-line","line"],["lb-t-oval","oval"],["lb-t-free","free"]];
function setTool(t){
  M.tool=t; setErase(false);
  M.sel=null;                                  // 도구를 바꾸면 '방금 그린 것' 고르기는 끝
  TOOLS.forEach(([id,k])=>$(id).setAttribute("aria-pressed", k===t?"true":"false"));
  drawMarks();                                 // 점선 안내를 지운다
}
TOOLS.forEach(([id,t])=>{ $(id).onclick=()=>setTool(t); });

// 선 굵기 — 가늘게 · 보통(기본) · 굵게. 앞으로 그을 선에 적용된다.
// 이미 그은 줄은 그을 때의 굵기를 그대로 간직한다(방금 그린 동그라미만 예외로 같이 바뀐다).
const WEIGHTS=[["lb-w1",0.6],["lb-w2",1],["lb-w3",1.7]];
function setWeight(k){
  M.wk=k;
  WEIGHTS.forEach(([id,v])=>$(id).setAttribute("aria-pressed", v===k?"true":"false"));
  const sel=selStroke();
  if(sel){ sel.w=strokeW(sel.t); drawMarks(); }
}
WEIGHTS.forEach(([id,v])=>{ $(id).onclick=()=>setWeight(v); });

function setErase(on){
  M.erase=on;
  if(on){ M.sel=null; drawMarks(); }           // 지울 땐 옮기기 안내(점선)를 치운다
  $("lb-erase").setAttribute("aria-pressed", on?"true":"false");
}
$("lb-erase").onclick=()=>setErase(!M.erase);
$("lb-undo").onclick=()=>{
  const list=M.marks[markName()];
  if(list&&list.length){
    if(M.sel===list[list.length-1]) M.sel=null;  // 되돌린 게 고른 것이면 같이 푼다
    list.pop(); drawMarks();
  }
};
$("lb-clear").onclick=()=>{
  const list=M.marks[markName()];
  if(!list||!list.length) return;
  if(!confirm(`이 장(${V.i+1}쪽)에 그은 형광펜을 모두 지울까요?`)) return;
  M.marks[markName()]=[]; M.sel=null; drawMarks();
};
// 도구모음을 누를 때 사진 쪽 동작(그리기·닫기)이 같이 일어나지 않게 막는다
$("lb-tools").addEventListener("pointerdown",e=>e.stopPropagation());

// ── 입력: 키보드 ────────────────────────────────────────────────────────
/* 방향키는 '장 넘기기' 와 '화면 옮기기' 둘 다에 쓰고 싶은 키다. 그래서 이렇게 나눈다.
     · 확대한 상태(1배 초과) → 방향키 = **화면 옮기기** (지금 보는 기사를 계속 읽으려는 상황)
     · 원래 크기            → 방향키 = **장 넘기기** (지금까지 하던 대로)
   확대한 채로 장을 넘기고 싶을 때가 있으므로, 배율과 상관없이 넘길 수 있는 길도 둔다:
     Shift+←/→  ·  PageUp/PageDown  ·  스페이스(다음 장)
   WASD 로도 옮길 수 있게 해 둔다(게임처럼 왼손만으로). */
const ARROW_DELTA={ArrowLeft:[1,0],ArrowRight:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1],
                   a:[1,0],d:[-1,0],w:[0,1],s:[0,-1],A:[1,0],D:[-1,0],W:[0,1],S:[0,-1]};
document.addEventListener("keydown",e=>{
  if($("lb").hidden) return;
  // Esc 는 한 단계씩 물러난다: 동그라미 고르기 해제 → 형광펜 끄기 → 뷰어 닫기
  if(e.key==="Escape"){
    if(selStroke()){ M.sel=null; drawMarks(); return; }
    M.on ? setPen(false) : closeViewer(); return;
  }
  if(e.key==="h"||e.key==="H"){ setPen(!M.on); return; }
  if((e.key==="z"||e.key==="Z")&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); $("lb-undo").onclick(); return; }
  // 선 굵기 한 단계씩 — [ 가늘게 / ] 굵게
  if(M.on&&(e.key==="["||e.key==="]")){
    const i=WEIGHTS.findIndex(([,v])=>v===M.wk);
    const k=Math.max(0, Math.min(WEIGHTS.length-1, (i<0?1:i)+(e.key==="]"?1:-1)));
    setWeight(WEIGHTS[k][1]); return;
  }

  // 배율과 상관없이 장 넘기기
  if(e.key==="PageDown"){ e.preventDefault(); go(1); return; }
  if(e.key==="PageUp"){ e.preventDefault(); go(-1); return; }
  if(e.shiftKey&&e.key==="ArrowRight"){ e.preventDefault(); go(1); return; }
  if(e.shiftKey&&e.key==="ArrowLeft"){ e.preventDefault(); go(-1); return; }
  if(e.key===" "){ e.preventDefault(); go(1); return; }

  // 방금 그린 동그라미가 고른 상태면 방향키는 '그 동그라미 미세 조정'이 된다.
  // (Shift+←→ 는 위에서 이미 장 넘기기로 처리되므로 여기 오지 않는다)
  const selK=M.on?selStroke():null;
  if(selK&&ARROW_DELTA[e.key]){
    e.preventDefault();
    const [kx,ky]=ARROW_DELTA[e.key];          // 화면을 미는 방향이라 부호가 반대다
    const step=0.004;                          // 한 번에 사진 가로의 0.4%
    moveSel(selK, selK.pts.map(p=>p.slice()), -kx*step, -ky*step/aspect());
    return;
  }

  const mv=ARROW_DELTA[e.key];
  if(mv){
    e.preventDefault();
    const st=panStep();
    // 확대한 상태면 옮기고, 아니면(옮길 여백이 없으면) 장을 넘긴다
    if(!panBy(mv[0]*st.x, mv[1]*st.y)){
      if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") go(1);
      else if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") go(-1);
    }
    return;
  }

  if(e.key==="+"||e.key==="=") zoomAt(1.6);
  else if(e.key==="-") zoomAt(1/1.6);
  else if(e.key==="0") resetZoom();
});

// ── 입력: 마우스 휠(Ctrl) / 더블클릭 ────────────────────────────────────
const stage=$("lb-stage");
/* 마우스 휠로 확대·축소. 위로 굴리면 커지고 아래로 굴리면 작아진다.
   커서가 가리킨 지점을 기준으로 확대되므로(zoomAt), 보고 싶은 기사에 대고 굴리면 된다.

   ⚠️ 휠이 주는 값(deltaY)은 기기마다 단위가 제각각이다.
      · 마우스 휠      : 한 칸에 100 안팎 (deltaMode 0 = 픽셀)
      · 어떤 브라우저  : 3 안팎 (deltaMode 1 = 줄 수)  → 16 을 곱해 픽셀로 맞춘다
      · 트랙패드       : 아주 잘게 여러 번 (2~10)
      그래서 단위를 픽셀로 통일하고, 한 번에 너무 확 튀지 않게 상한을 둔다.
   지수(exp)를 쓰는 이유: 확대는 '더하기'가 아니라 '곱하기'다. 그래야 많이 확대한
   상태에서도, 축소한 상태에서도 굴린 만큼 똑같은 느낌으로 변한다. */
function wheelFactor(e){
  let d=e.deltaY;
  if(e.deltaMode===1) d*=16;                   // 줄 단위 → 픽셀로 환산
  else if(e.deltaMode===2) d*=400;             // 페이지 단위 → 픽셀로 환산
  d=Math.max(-240,Math.min(240,d));            // 한 번에 너무 크게 튀지 않게
  const step=e.ctrlKey?0.0035:0.0022;          // 트랙패드 핀치(ctrl+휠)는 조금 더 민감하게
  return Math.exp(-d*step);                    // 위로 굴리면(d<0) 1보다 커짐 = 확대
}
stage.addEventListener("wheel",e=>{
  e.preventDefault();                          // 뒤 페이지가 같이 스크롤되지 않게
  zoomAt(wheelFactor(e), e.clientX, e.clientY);
},{passive:false});
function toggleZoomAt(x,y){ V.zoom>1.001?resetZoom():zoomAt(2.6,x,y); }
stage.addEventListener("dblclick",e=>toggleZoomAt(e.clientX,e.clientY));
// ⚠️ 휴대폰(터치)에서는 dblclick 이벤트가 안 오는 경우가 많다 → 탭 두 번을 직접 센다.
let lastTap=0,lastTapX=0,lastTapY=0;
function maybeDoubleTap(x,y){
  const now=Date.now();
  if(now-lastTap<320&&Math.hypot(x-lastTapX,y-lastTapY)<30){ lastTap=0; toggleZoomAt(x,y); return true; }
  lastTap=now; lastTapX=x; lastTapY=y; return false;
}

// ── 입력: 손가락 — 드래그 이동 / 두 손가락 핀치 / 스와이프로 장 넘기기 ──
// 오른쪽 버튼을 눌렀을 때 브라우저 메뉴가 뜨면 끌어 옮길 수가 없다 → 사진 위에서만 막는다.
// (사진 저장은 상단 바의 ⤓ 버튼으로 하면 된다)
stage.addEventListener("contextmenu",e=>e.preventDefault());

stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);
  V.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  // ★ 오른쪽 버튼 = 언제나 '화면 끌어 옮기기'.
  //   형광펜 모드에서는 왼쪽 버튼이 그리기라, 옮기려면 이 길이 필요하다.
  if(e.button===2){
    M.cur=null;
    V.drag={x:e.clientX,y:e.clientY,tx:V.tx,ty:V.ty,t:Date.now(),moved:0,pan:true};
    stage.classList.add("panning");
    return;
  }
  // 형광펜 모드: 손가락 하나면 '그리기'. 두 손가락이면 평소처럼 확대(핀치).
  if(M.on && V.pts.size===1){
    const q=toImgXY(e.clientX,e.clientY);
    if(q){
      if(M.erase){ eraseAt(q[0],q[1]); V.drag=null; return; }
      // ★ 방금 그린 동그라미 '안'을 눌렀다 → 새로 긋지 말고 통째로 옮긴다
      const sel=selStroke();
      if(sel&&inSel(sel,q[0],q[1])){
        M.move={st:sel, from:q, orig:sel.pts.map(p=>p.slice())};
        stage.classList.add("moving");
        V.drag=null; return;
      }
      if(sel){ M.sel=null; }                   // 딴 데서 시작했으면 고르기는 여기서 끝
      // 직선·동그라미는 '시작점과 끝점' 두 개만 있으면 된다(끌면서 끝점만 갱신).
      // 자유 긋기만 지나온 점을 전부 쌓는다.
      M.cur = (M.tool==="free")
        ? {c:M.color, w:strokeW("free"), t:"free", pts:[q]}
        : {c:M.color, w:strokeW(M.tool), t:M.tool, pts:[q,q]};
      V.drag=null; drawMarks(); return;
    }
  }
  if(V.pts.size===2){ V.pinch=pinchState(); V.drag=null; M.cur=null; }
  else { V.drag={x:e.clientX,y:e.clientY,tx:V.tx,ty:V.ty,t:Date.now(),moved:0}; }
});
function pinchState(){
  const [a,b]=[...V.pts.values()];
  return {d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,zoom:V.zoom};
}
stage.addEventListener("pointermove",e=>{
  if(!V.pts.has(e.pointerId)) return;
  V.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(M.move){                                  // 동그라미를 통째로 옮기는 중
    const q=toImgXY(e.clientX,e.clientY);
    if(q) moveSel(M.move.st, M.move.orig, q[0]-M.move.from[0], q[1]-M.move.from[1]);
    return;
  }
  if(M.cur){                                   // 표시를 긋는 중
    const q=toImgXY(e.clientX,e.clientY);
    if(!q) return;
    if(M.cur.t==="free"){
      const last=M.cur.pts[M.cur.pts.length-1];
      // 너무 촘촘한 점은 버린다 — 그리는 속도를 아낀다
      if(Math.hypot(q[0]-last[0],q[1]-last[1])>0.002){ M.cur.pts.push(q); drawMarks(); }
    }else{
      M.cur.pts[1]= M.cur.t==="line" ? snapStraight(M.cur.pts[0],q) : q;
      drawMarks();
    }
    return;
  }
  if(V.pts.size===2&&V.pinch){
    const now=pinchState();
    const target=Math.max(1,Math.min(maxZoom(),V.pinch.zoom*(now.d/V.pinch.d)));
    zoomAt(target/V.zoom,now.cx,now.cy);
    return;
  }
  if(!V.drag) return;
  const dx=e.clientX-V.drag.x, dy=e.clientY-V.drag.y;
  V.drag.moved=Math.max(V.drag.moved,Math.hypot(dx,dy));
  if(V.zoom>1.001){ V.tx=V.drag.tx+dx; V.ty=V.drag.ty+dy; paint(); }
});
/* 누르지 않고 지나가기만 할 때 — 고른 동그라미 위면 커서를 '옮기기' 모양으로.
   (손가락에는 커서가 없으니 마우스일 때만 본다) */
stage.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||M.move||M.cur) return;
  const sel=M.on?selStroke():null;
  const q=sel?toImgXY(e.clientX,e.clientY):null;
  stage.classList.toggle("movable", !!(sel&&q&&inSel(sel,q[0],q[1])));
});

function endPointer(e){
  V.pts.delete(e.pointerId);
  if(V.pts.size<2) V.pinch=null;
  if(M.move){                                  // 옮기기 끝 — 고른 상태는 그대로 둔다(계속 조정 가능)
    M.move=null; stage.classList.remove("moving"); V.drag=null; return;
  }
  if(M.cur){                                   // 긋기 끝
    const st=M.cur; M.cur=null;
    // 살짝 눌렀다 뗀 것(길이가 거의 0)은 점만 남아 지저분하므로 버린다
    const tooSmall = st.t!=="free" && strokeSpan(st) < 0.012;
    if(!tooSmall){
      markList().push(st);
      // 동그라미는 한 번에 맞추기 어렵다 → 방금 그린 것을 고른 상태로 두어 옮길 수 있게
      M.sel = st.t==="oval" ? st : null;
      if(M.sel) setSaved("동그라미 안쪽을 끌면 옮길 수 있어요 · 방향키로 미세조정 · Esc 로 확정");
    }
    drawMarks(); V.drag=null; return;
  }
  // 오른쪽 버튼으로 옮긴 것뿐이면 여기서 끝 — 장을 넘기거나 닫으면 안 된다
  if(V.drag && V.drag.pan){ V.drag=null; stage.classList.remove("panning"); return; }
  if(M.on){ V.drag=null; return; }             // 형광펜 모드에선 넘기기·닫기 동작 안 함
  if(!V.drag) return;
  const dx=e.clientX-V.drag.x, dy=e.clientY-V.drag.y, dt=Date.now()-V.drag.t;
  // 확대 안 한 상태에서 옆으로 쓸면 장 넘기기
  if(V.zoom<=1.001&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6&&dt<700) go(dx<0?1:-1);
  else if(V.drag.moved<6){
    // 제자리 탭 — 두 번 두드리면 확대/원복
    if(maybeDoubleTap(e.clientX,e.clientY)){ V.drag=null; return; }
    // 사진 바깥의 '어두운 여백'을 톡 치면 닫기.
    // ⚠️ e.target 만 믿으면 사진 위를 눌러도 닫히는 일이 있었다(2026-09-16 발견)
    //    → 사진의 실제 화면 위치와 비교해 확실히 바깥일 때만 닫는다.
    const r=$("lb-img").getBoundingClientRect();
    const outside=e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;
    if(V.zoom<=1.001&&outside) closeViewer();
  }
  V.drag=null;
}
stage.addEventListener("pointerup",endPointer);
stage.addEventListener("pointercancel",e=>{
  V.pts.delete(e.pointerId); V.pinch=null; V.drag=null;
  stage.classList.remove("panning","moving");
  if(M.move){ M.move=null; return; }           // 옮기던 중 끊겼으면 그 자리에 둔다
  if(M.cur){
    const st=M.cur; M.cur=null;
    if(!(st.t!=="free" && strokeSpan(st)<0.012)) markList().push(st);
    drawMarks();
  }
});
window.addEventListener("resize",()=>{ if(!$("lb").hidden) measure(); });

/* ══ 보기 방식: 📝 글만 / 📰 글+지면 (2026-09-23) ═══════════════════════════
   '글+지면' 에선 브리핑 기사마다 옆에 그 기사가 실린 신문 사진을 붙인다.

   어느 사진인지 어떻게 아나? (믿을 수 있는 순서대로)
     ① 사용자가 직접 연결한 장 — 📌 지면 찾아 연결 로 고른 것. 이 브라우저에 기억한다.
     ② 요약문에 적힌 사진 번호 — "• 사진: 07" / 제목 끝 "(사진 07)" (PAGE_LINE_RE)
     ③ 둘 다 없으면 **짐작하지 않는다** — "어느 지면인지 아직 몰라요 + 📌 지면 찾아 연결".
        (순서로 대충 맞히면 엉뚱한 지면을 자신 있게 보여주게 된다 → 차라리 비워 둔다)

   무엇을 브라우저에 남기나 (localStorage — 이 브라우저에서만, 서버로 안 보냄)
     · 고른 보기 방식            digest.view
     · 직접 연결한 기사→사진     digest.pageLinks  { "2026-09-23": { "<기사 제목>": "07.jpg" } }
     ⚠️ 형광펜 줄은 여전히 **어디에도 저장하지 않는다**(일회성 규칙 그대로).
     저장소가 막힌 브라우저(사생활 모드 등)에서도 이 창에서는 그대로 동작한다. */
const VIEW_KEY="digest.view", LINK_KEY="digest.pageLinks";
const mem={view:null, links:null, font:null};             // 저장소가 막혔을 때의 대체 기억 장소
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function viewMode(){ return mem.view || (lsGet(VIEW_KEY)==="paper"?"paper":"text"); }
function setViewMode(v){ mem.view=v; lsSet(VIEW_KEY,v); syncViewSeg(); decorate(); }
function allLinks(){
  if(mem.links) return mem.links;
  try{ mem.links=JSON.parse(lsGet(LINK_KEY)||"{}")||{}; }catch(e){ mem.links={}; }
  return mem.links;
}
function saveLinks(){
  // 오래된 날짜는 30일치만 남긴다(사진 보관은 14일이라 그 이상은 어차피 못 연다)
  const L=allLinks(), keep=Object.keys(L).sort().slice(-30);
  Object.keys(L).forEach(d=>{ if(!keep.includes(d)) delete L[d]; });
  lsSet(LINK_KEY, JSON.stringify(L));
}
function getLink(key){ return (allLinks()[state.date]||{})[key]||""; }
function setLink(key,name){
  const L=allLinks();
  if(name){ (L[state.date] ||= {})[key]=name; }
  else if(L[state.date]){ delete L[state.date][key]; }
  saveLinks(); decorate(true);
}

/* ── 글자 크기 (2026-09-23) ─────────────────────────────────────────────
   요약 글자 크기를 6단계로 고른다. CSS 변수 --fs(배율) 하나만 바꾸면 제목·본문·라벨이
   같은 비율로 커진다(각 글자 크기가 'px × --fs' 로 적혀 있음).
   고른 크기는 이 브라우저에 기억(digest.fontScale) — 폰과 PC 가 각자 편한 크기를 가진다.
   ⚠️ 브라우저 자체 확대(Ctrl +)와 달리 사진 뷰어·버튼 크기는 그대로다 → 글만 커진다. */
const FONT_KEY="digest.fontScale";
const FONT_STEPS=[0.9,1,1.12,1.25,1.4,1.6];
function fontScale(){
  const v=parseFloat(mem.font||lsGet(FONT_KEY)||"1");
  return FONT_STEPS.includes(v)?v:1;
}
function applyFont(){
  document.documentElement.style.setProperty("--fs", String(fontScale()));
  const i=FONT_STEPS.indexOf(fontScale());
  document.querySelectorAll(".fontctl").forEach(g=>{
    g.querySelector(".dn").disabled = i<=0;
    g.querySelector(".up").disabled = i>=FONT_STEPS.length-1;
    g.querySelector(".lv").textContent = Math.round(fontScale()*100)+"%";
  });
  if(typeof drawSideMarks==="function") requestAnimationFrame(drawSideMarks);   // 글+지면: 사진 칸 폭이 바뀌면 형광펜 다시
}
function stepFont(d){
  const i=FONT_STEPS.indexOf(fontScale());
  const v=FONT_STEPS[Math.max(0,Math.min(FONT_STEPS.length-1,i+d))];
  mem.font=String(v); lsSet(FONT_KEY,String(v)); applyFont();
}
function fontCtl(){
  const g=document.createElement("div");
  g.className="fontctl"; g.setAttribute("role","group"); g.setAttribute("aria-label","글자 크기");
  g.innerHTML='<button class="dn" title="글자 작게" aria-label="글자 작게">가−</button>'+
              '<button class="lv" title="기본 크기로 (100%)" aria-label="글자 크기 기본으로"></button>'+
              '<button class="up" title="글자 크게" aria-label="글자 크게">가+</button>';
  g.querySelector(".dn").onclick=()=>stepFont(-1);
  g.querySelector(".up").onclick=()=>stepFont(1);
  g.querySelector(".lv").onclick=()=>{ mem.font="1"; lsSet(FONT_KEY,"1"); applyFont(); };
  setTimeout(applyFont);
  return g;
}

function viewSeg(){
  const g=document.createElement("div");
  g.className="viewseg"; g.setAttribute("role","group"); g.setAttribute("aria-label","보기 방식");
  g.innerHTML='<button data-view="text" title="지금까지처럼 요약 글만">📝 글만</button>'+
              '<button data-view="paper" title="기사마다 옆에 실린 신문 사진을 함께 — 눌러서 형광펜">📰 글+지면</button>';
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>setViewMode(b.dataset.view));
  setTimeout(syncViewSeg);
  return g;
}
function syncViewSeg(){
  const v=viewMode();
  document.querySelectorAll(".viewseg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===v?"true":"false"));
}

// 기사 하나를 구별하는 열쇠 = 제목(머리표·공백·기호 빼고). 제목이 없으면 본문 앞부분.
function artTitle(art){
  const t=art.querySelector(".brf-title");
  let s="";
  if(t){ const c=t.cloneNode(true); c.querySelectorAll(".brf-flag").forEach(n=>n.remove()); s=c.textContent; }
  else s=(art.querySelector(".brf-main")||art).textContent;
  return s.replace(/\s+/g," ").trim();
}
const artKey=title=>title.replace(/[^0-9A-Za-z가-힣]/g,"").slice(0,60);

/* ══ 지면 글자 대조로 자동 연결 (2026-09-24) ══════════════════════════════
   요약(ChatGPT)에 "• 사진: 07" 이 빠지는 날이 많아서, 서버가 신문 사진 속 글자를 읽어 둔 것
   (scripts/news_page_text.py → /api/news/pagetext)과 요약 기사를 **직접 대조**한다.
     · 조각 뽑는 규칙은 서버 tokens() 와 **똑같아야** 한다(숫자 3자리↑·소수 / 한글 낱말 앞 2·3글자 / 영문 약어)
     · 점수 = 겹친 조각마다 '드문 정도'(여러 장에 나오는 말일수록 낮게) × 가중치(숫자는 2.5배 — 1305가구·8만2793가구
       같은 숫자는 거의 그 기사에만 나온다)
     · 1등 점수가 충분히 높고(MATCH_MIN) 2등보다 확실히 앞설 때(MATCH_GAP)만 붙인다 — 애매하면 짐작하지 않는다 */
const PT_STOP=new Set(["있다","있는","있어","하는","했다","한다","것으","것이","이번","지난","올해","기자","그러","하지","또한",
  "등의","등을","위해","대한","대해","통해","따라","이후","이상","WHAT","WHY","HOW"]);
function pageTokens(text){
  const out=new Set(); text=String(text||"");
  for(const n0 of text.match(/\d[\d,]*(?:\.\d+)?/g)||[]){ const n=n0.replace(/,/g,""); if(n.includes(".")||n.length>=3) out.add("#"+n); }
  for(const w of text.match(/[가-힣]{2,}/g)||[]){ out.add(w.slice(0,2)); if(w.length>=3) out.add(w.slice(0,3)); }
  for(const w of text.match(/[A-Za-z]{2,}/g)||[]) out.add(w.toUpperCase());
  return new Set([...out].filter(t=>!PT_STOP.has(t)&&!PT_STOP.has(t.replace(/^#/,""))));
}
const MATCH_MIN=4, MATCH_GAP=1.35;
const PT={date:"", data:null, busy:false, at:0};   // 날짜별로 한 번만 받아 둔다
function loadPageText(date){
  // 받았으면 끝. 서버가 아직 글자를 다 못 읽어 비어 있었으면 5분 뒤 다시 물어본다(새벽에 사진이 막 올라온 경우)
  if(PT.busy||(PT.date===date&&(PT.data||Date.now()-PT.at<300000))) return;
  PT.busy=true; PT.at=Date.now();
  fetch(`/api/news/pagetext?date=${date}`,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
    .then(d=>{ PT.busy=false; PT.date=date;
      PT.data=(d&&d.ok)?{n:d.n, df:d.df||{}, pages:Object.fromEntries(Object.entries(d.pages||{}).map(([k,v])=>[k,new Set(v)]))}:null;
      if(PT.data) decorate(true); });
}
// 기사 글 → 가장 잘 맞는 사진 이름 (확실하지 않으면 null)
function matchPage(text, names){
  const D=PT.data; if(!D) return null;
  const A=pageTokens(text), N=D.n||names.length;
  const sc=names.map(n=>{
    const P=D.pages[n]; if(!P) return 0;
    let s=0;
    for(const t of A){ if(!P.has(t)) continue;
      const w=Math.log(1+N/(D.df[t]||1)) * (t[0]==="#"?2.5:(t.length>=3?1.2:1));
      s+=w; }
    return s;
  });
  let b=-1, b2=-1;
  sc.forEach((v,i)=>{ if(b<0||v>sc[b]){ b2=b; b=i; } else if(b2<0||v>sc[b2]) b2=i; });
  if(b<0||sc[b]<MATCH_MIN) return null;
  if(b2>=0 && sc[b2]>0 && sc[b]<sc[b2]*MATCH_GAP) return null;
  return {name:names[b], score:sc[b], second:b2>=0?sc[b2]:0};
}

/* 사진 칸을 붙이거나(글+지면) 걷어낸다(글만). 여러 번 불러도 안전하다.
   20초마다 목록을 다시 받아도 바뀐 게 없으면 손대지 않는다 → 사진이 깜빡이지 않는다. */
let feedVer=0, lastDecor="";
function decorate(force){
  const feed=document.getElementById("feed"); if(!feed) return;
  const paper=viewMode()==="paper";
  const imgs=(newsState.date===state.date && newsState.images)||[];
  const sig=[paper,feedVer,state.date,!!(PT.data&&PT.date===state.date),imgs.map(i=>i.name).join(","),JSON.stringify(allLinks()[state.date]||{})].join("|");
  if(!force && sig===lastDecor) return;
  lastDecor=sig;

  document.body.classList.toggle("paper", paper);
  feed.querySelectorAll(".brf-side,.paper-note").forEach(n=>n.remove());
  feed.querySelectorAll(".brf-art.has-side").forEach(a=>a.classList.remove("has-side"));
  if(!paper) return;                                   // 글만 = 기존 화면 그대로

  const arts=[...feed.querySelectorAll(".brf-art")].filter(a=>a.querySelector(".brf-main"));
  if(!arts.length){
    feed.insertAdjacentHTML("afterbegin",'<div class="paper-note">📰 이 날짜엔 지면을 붙일 신문 브리핑이 없어요. 브리핑이 올라오면 기사마다 옆에 신문 사진이 붙습니다.</div>');
    return;
  }
  if(!imgs.length){
    feed.insertAdjacentHTML("afterbegin",'<div class="paper-note">📰 이 날짜의 신문 사진이 아직 서버에 없어요 — 사진이 준비되면 기사 옆에 자동으로 붙습니다.</div>');
    return;
  }
  const byName=new Map(imgs.map((im,i)=>[im.name,i]));
  loadPageText(state.date);                          // 지면 글자(한 번만 받음) — 오면 다시 그린다
  arts.forEach(art=>{
    const title=artTitle(art), key=artKey(title);
    if(!key) return;
    // ① 직접 연결 → ② 요약문의 사진 번호 → ③ 모름
    let idx=-1, how="", box=null;
    const linked=getLink(key);
    const meta=findMeta(title);                      // 요약 GPT 가 붙여 준 JSON(쪽 번호·기사 영역)
    const mp=meta?parseInt(meta.page,10):0;
    if(linked && byName.has(linked)){ idx=byName.get(linked); how="직접 연결"; }
    else if(mp>=1 && mp<=imgs.length){
      idx=mp-1; box=validBox(meta.bbox);
      how="요약 JSON · "+mp+"쪽"+(box?" · 기사 영역":"");
    }
    else{
      const n=+art.dataset.page||0;
      if(n>=1 && n<=imgs.length){ idx=n-1; how="요약문 표기"; }
      else{
        // ③ 지면 글자 대조 — 요약 기사 글(제목·WHAT·WHY·HOW)과 사진 속 글자를 맞춰 본다
        const mt=matchPage((art.querySelector(".brf-main")||art).textContent, imgs.map(i=>i.name));
        if(mt && byName.has(mt.name)){ idx=byName.get(mt.name); how="지면 글자 대조(자동)"; }
      }
    }
    const side=document.createElement("aside");
    side.className="brf-side"+(idx<0?" nolink":"");
    side.dataset.key=key; side.dataset.title=title;
    if(idx>=0){
      const im=imgs[idx], no=String(idx+1).padStart(2,"0");
      side.dataset.i=idx;
      if(box) side.dataset.box=box.join(",");
      // 기사 영역(box)이 있으면 그 부분만 잘라 보여준다 — 잘라 보이려면 선명해야 해서 썸네일 대신 원본을 쓴다
      side.innerHTML=
        `<button class="side-fig${box?" crop":""}" data-act="pen" title="눌러서 줄 긋기(형광펜) — ${no}번째 장${box?"의 이 기사":""}">`+
          `<img loading="lazy" decoding="async" src="${box?im.url:(im.thumb||im.url)}" alt="${no}번째 신문 사진"><canvas></canvas>`+
          `<span class="side-no">${no}</span></button>`+
        `<div class="side-acts">`+
          `<button class="primary" data-act="pen" title="형광펜을 켠 채로 크게 열기">🖍 줄 긋기</button>`+
          `<button data-act="view" title="크게 보기(확대·넘기기)">🔍 크게</button>`+
          `<button class="quiet" data-act="pick" title="다른 장으로 바꾸기">바꾸기</button>`+
        `</div>`+
        `<div class="side-src">사진 ${no} · ${how}</div>`;
      const img=side.querySelector("img");
      img.addEventListener("load",()=>{ if(box) cropFig(side.querySelector(".side-fig"),img,box); drawSideMark(side); });
    }else{
      side.innerHTML=
        `<div class="side-empty">어느 지면에 실렸는지<br>아직 몰라요</div>`+
        `<div class="side-acts"><button class="primary" data-act="pick" title="넘겨 보며 이 기사가 실린 장을 골라 연결">📌 지면 찾아 연결</button></div>`;
    }
    art.classList.add("has-side");
    art.appendChild(side);
  });
}

/* 기사 옆 작은 사진 위에 형광펜 줄을 겹쳐 그린다 — 뷰어에서 그은 줄이 여기서도 보이게.
   (그은 줄은 여전히 이 창 메모리에만 있다. 새로고침하면 둘 다 사라진다.) */
function drawSideMark(side){
  const img=side.querySelector(".side-fig img"), cv=side.querySelector(".side-fig canvas");
  if(!img||!cv||side.dataset.box) return;          // 잘라 보인 칸은 줄을 겹치지 않는다(뷰어에선 그대로 보인다)
  const w=img.clientWidth, h=img.clientHeight;
  if(!(w>0&&h>0)) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=w+"px"; cv.style.height=h+"px";
  const pw=Math.round(w*dpr), ph=Math.round(h*dpr);
  if(cv.width!==pw||cv.height!==ph){ cv.width=pw; cv.height=ph; }
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,pw,ph);
  ctx.lineCap="round"; ctx.lineJoin="round";
  const name=(newsState.images[+side.dataset.i]||{}).name;
  const list=(M.date===state.date && name && M.marks[name])||[];
  for(const st of list) strokeOne(ctx, st, pw, ph, 1);
}
/* 기사 영역만 잘라 보이기: 칸의 가로세로 비율을 '영역' 비율로 맞추고, 사진을 그만큼 키워 영역이 칸에 딱 차게 민다.
   (CSS 의 %: left·width 는 칸 너비 기준, top 은 칸 높이 기준이라 비율 계산만으로 정확히 맞는다) */
function cropFig(fig,img,box){
  const [x,y,w,h]=box, nw=img.naturalWidth||1, nh=img.naturalHeight||1;
  fig.style.aspectRatio=String((w*nw)/(h*nh));
  Object.assign(img.style,{position:"absolute",width:(100/w)+"%",height:"auto",left:(-x/w*100)+"%",top:(-y/h*100)+"%",maxWidth:"none"});
}
function drawSideMarks(){ document.querySelectorAll(".brf-side[data-i]").forEach(drawSideMark); }

// 사진 칸의 버튼들 — 하나의 리스너로 처리(피드가 다시 그려져도 다시 달 필요 없음)
document.getElementById("feed").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const side=b.closest(".brf-side"); if(!side) return;
  e.preventDefault();
  const act=b.dataset.act;
  if(act==="pen"||act==="view"){
    // 기사 영역이 있으면 '줄 긋기'는 그 기사로 확대해서 열고, '크게'는 지면 전체로 연다
    const box=(act==="pen"&&side.dataset.box)?side.dataset.box.split(",").map(Number):null;
    openViewer(+side.dataset.i,{pen:act==="pen", box}); return;
  }
  if(act==="pick"){
    // 이미 연결된 장이 있으면 그 장에서, 없으면 마지막으로 고른 장(비슷한 면일 확률이 높다)에서 시작
    const start = side.dataset.i!==undefined ? +side.dataset.i : (V.lastPick||0);
    openViewer(start,{pick:{key:side.dataset.key, title:side.dataset.title}});
  }
});
$("lb-pick").onclick=()=>{
  if(!V.pick) return;
  const im=V.list[V.i]; if(!im) return;
  const key=V.pick.key;
  V.lastPick=V.i;
  closeViewer();
  setLink(key, im.name);
  // 방금 연결한 기사가 화면에서 사라지지 않게 그 자리로 살짝 스크롤
  const side=[...document.querySelectorAll(".brf-side")].find(s=>s.dataset.key===key);
  if(side) side.scrollIntoView({block:"nearest"});
};
let sideT=null;
window.addEventListener("resize",()=>{ clearTimeout(sideT); sideT=setTimeout(drawSideMarks,150); });

// ↻ 받아오기: 서버에게 드라이브에서 다시 가져오라고 시키고, 잠시 뒤 목록을 새로고침.
document.getElementById("news-refresh").addEventListener("click",async(e)=>{
  const b=e.currentTarget;
  if(newsState.busy) return;
  newsState.busy=true; b.disabled=true; b.textContent="↻ 받는 중…";
  try{ await fetch(`/api/news/refresh?date=${state.date}`,{method:"POST"}); }catch(_){}
  for(const wait of [4000,6000,10000]){ await new Promise(r=>setTimeout(r,wait)); await loadNews(); }
  newsState.busy=false; b.disabled=false; b.textContent="↻ 받아오기";
});

/* 🧹 지금까지 것 숨기기 (2026-09-24) — GPT 에게 요약을 새로 받을 때 먼저 올라온 것을 한 번에 치운다.
   서버(/slack/hide)에 '이 시각까지는 숨김' 기준만 적는다 → 폰·PC 모두 같게. 슬랙 원본은 지우지 않는다. */
function syncHideBtns(){
  const n=(state.data&&state.data.hidden)||0, un=document.getElementById("unhide");
  un.hidden=!n;
  if(n){ const t=(state.data.hidden_before||"").slice(11,16); un.textContent=`↩ 숨긴 ${n}개 다시 보기${t?` (${t} 이전)`:""}`; }
}
document.getElementById("hide-old").addEventListener("click",async()=>{
  const n=(state.data.messages||[]).length;
  if(!n){ alert("이 날짜에 숨길 메시지가 없어요."); return; }
  if(!confirm(`${state.date} 에 지금까지 올라온 메시지 ${n}개를 화면에서 숨길까요?\n\n· 이후에 새로 올라오는 요약만 보입니다.\n· 슬랙 원본은 지우지 않습니다.\n· '다시 보기' 로 언제든 되돌릴 수 있어요.`)) return;
  try{ await fetch(`/slack/hide?date=${state.date}`,{method:"POST"}); }catch(e){}
  lastSnapshot=null; load();
});
document.getElementById("unhide").addEventListener("click",async()=>{
  try{ await fetch(`/slack/unhide?date=${state.date}`,{method:"POST"}); }catch(e){}
  lastSnapshot=null; load();
});

document.getElementById("datepick").addEventListener("change",e=>{state.date=e.target.value;load();loadNews()});
document.getElementById("today").addEventListener("click",()=>{state.date=todayKST();load();loadNews()});

applyFont();                                   // 첫 화면부터 고른 크기로(깜빡임 없이)
load(); loadNews();
setInterval(()=>{ if(state.date===todayKST()){ load(); loadNews(); } },20000); // 오늘 볼 때만 자동 갱신
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
